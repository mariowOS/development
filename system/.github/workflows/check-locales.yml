# Checks the translations when someone proposes a new language or changes one
# (see TRANSLATING.md). Runs tools/check-locales.js, which needs no dependencies.
name: Check translations

on:
  pull_request:
    paths: ['desktop/**', 'tools/check-locales.js']
  push:
    branches: [main]
    paths: ['desktop/**', 'tools/check-locales.js']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check locales
        run: node tools/check-locales.js
