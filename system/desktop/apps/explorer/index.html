<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Files</title>
<link href="/desktop/assets/fonts/fonts.css" rel="stylesheet">
<script src="/desktop/assets/mariowos-dialogs.js"></script>
<style>
  :root {
    --accent: #0a84ff;
    --text: #fff;
    --muted: rgba(255,255,255,.55);
    --dim: rgba(255,255,255,.35);
    --border: rgba(255,255,255,.08);
    --hover: rgba(255,255,255,.07);
    --sidebar: rgba(20,21,26,.72);
    --menu: rgba(26,28,34,.97);
    --spring: cubic-bezier(.16,1,.3,1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100vh; overflow: hidden; }
  body { display: flex; font-family: 'Poppins', sans-serif; color: var(--text); background: transparent; -webkit-font-smoothing: antialiased; user-select: none; }
  button, input { font-family: inherit; color: inherit; }
  .ms { font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal; line-height: 1; display: inline-block; white-space: nowrap; direction: ltr; -webkit-font-smoothing: antialiased; font-feature-settings: 'liga'; }

  /* Sidebar */
  .sidebar { width: 220px; flex: 0 0 220px; display: flex; flex-direction: column; background: var(--sidebar); border-right: 1px solid rgba(0,0,0,.35); backdrop-filter: blur(30px); overflow-y: auto; padding: 10px 8px; }
  .side-label { padding: 12px 10px 4px; font-size: 10.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--dim); }
  .side-item { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 9px; font-size: 13px; cursor: pointer; color: rgba(255,255,255,.85); transition: background .15s; }
  .side-item:hover { background: var(--hover); }
  .side-item.active { background: color-mix(in srgb, var(--accent) 24%, transparent); color: #fff; }
  .side-item.drop-target { outline: 2px dashed var(--accent); outline-offset: -2px; }
  .side-item .ms { font-size: 19px; width: 20px; color: var(--accent); }
  .side-item.trash .ms { color: rgba(255,255,255,.7); }
  .side-item .badge { margin-left: auto; font-size: 11px; color: var(--dim); }
  .storage { margin: auto 8px 4px; padding: 10px; border-radius: 10px; background: rgba(255,255,255,.04); font-size: 11px; color: var(--muted); }
  .storage-bar { height: 5px; margin-top: 6px; border-radius: 3px; background: rgba(255,255,255,.1); overflow: hidden; }
  .storage-bar span { display: block; height: 100%; background: var(--accent); border-radius: 3px; }

  /* Main */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
  .topbar { display: flex; align-items: center; gap: 4px; padding: 8px 10px; border-bottom: 1px solid var(--border); background: rgba(0,0,0,.18); }
  .ib { width: 32px; height: 32px; flex: 0 0 32px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 8px; background: transparent; color: rgba(255,255,255,.8); cursor: pointer; }
  .ib:hover:not(:disabled) { background: var(--hover); color: #fff; }
  .ib:disabled { opacity: .3; cursor: default; }
  .ib.on { color: var(--accent); background: color-mix(in srgb, var(--accent) 18%, transparent); }
  .ib .ms { font-size: 20px; }
  .crumbs { flex: 1; min-width: 0; height: 34px; display: flex; align-items: center; gap: 2px; padding: 0 6px; border-radius: 9px; background: rgba(0,0,0,.28); border: 1px solid var(--border); overflow: hidden; cursor: text; }
  .crumbs:focus-within { border-color: var(--accent); }
  .crumb { flex: 0 0 auto; padding: 3px 7px; border-radius: 6px; font-size: 12.5px; color: rgba(255,255,255,.8); cursor: pointer; white-space: nowrap; max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
  .crumb:hover { background: var(--hover); color: #fff; }
  .crumb.last { color: #fff; font-weight: 500; }
  .crumb-sep { flex: 0 0 auto; font-size: 16px; color: var(--dim); }
  .crumbs input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 12.5px; user-select: text; }
  .search { width: 200px; height: 34px; display: flex; align-items: center; gap: 6px; padding: 0 10px; border-radius: 9px; background: rgba(0,0,0,.28); border: 1px solid var(--border); }
  .search:focus-within { border-color: var(--accent); }
  .search .ms { font-size: 17px; color: var(--dim); }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 12.5px; user-select: text; }
  .actionbar { display: flex; align-items: center; gap: 2px; padding: 5px 10px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .ab { height: 30px; display: inline-flex; align-items: center; gap: 6px; padding: 0 9px; border: 0; border-radius: 8px; background: transparent; color: rgba(255,255,255,.82); cursor: pointer; font-size: 12.5px; }
  .ab:hover:not(:disabled) { background: var(--hover); color: #fff; }
  .ab:disabled { opacity: .3; cursor: default; }
  .ab .ms { font-size: 18px; }
  .ab.primary { background: color-mix(in srgb, var(--accent) 22%, transparent); color: #fff; }
  .sep { width: 1px; height: 18px; margin: 0 4px; background: rgba(255,255,255,.1); }
  .grow { flex: 1; }
  .readonly-pill { display: none; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; background: rgba(255,159,10,.15); color: #ffb340; font-size: 11px; }
  .readonly-pill.show { display: inline-flex; }
  .readonly-pill .ms { font-size: 14px; }

  /* Content */
  .content { flex: 1; overflow: auto; position: relative; outline: none; }
  .content.drag-over::after { content: 'Drop files to upload them here'; position: absolute; inset: 10px; display: flex; align-items: center; justify-content: center; border: 2px dashed var(--accent); border-radius: 14px; background: color-mix(in srgb, var(--accent) 10%, transparent); font-size: 14px; pointer-events: none; }
  .list-head { position: sticky; top: 0; z-index: 2; display: grid; grid-template-columns: minmax(0,1fr) 150px 110px 90px; gap: 10px; padding: 7px 16px; background: rgba(22,24,30,.96); border-bottom: 1px solid var(--border); font-size: 11.5px; color: var(--muted); }
  .list-head span { cursor: pointer; display: flex; align-items: center; gap: 3px; }
  .list-head span:hover { color: #fff; }
  .list-head span.right { justify-content: flex-end; }
  .list-head .ms { font-size: 15px; }
  .row { display: grid; grid-template-columns: minmax(0,1fr) 150px 110px 90px; gap: 10px; align-items: center; padding: 5px 16px; margin: 0 6px; border-radius: 8px; font-size: 13px; cursor: default; }
  .row:hover { background: var(--hover); }
  .row.selected, .tile.selected { background: color-mix(in srgb, var(--accent) 26%, transparent); }
  .row.cut, .tile.cut { opacity: .45; }
  .row.drop-target, .tile.drop-target { outline: 2px solid var(--accent); outline-offset: -2px; }
  .row .name { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .row .name span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .meta { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .meta.right { text-align: right; }
  .row .sub { color: var(--dim); font-size: 11px; }
  .ficon { font-size: 22px; flex: 0 0 22px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); gap: 6px; padding: 12px; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 6px 8px; border-radius: 12px; cursor: default; text-align: center; }
  .tile:hover { background: var(--hover); }
  .tile .thumb { width: 64px; height: 64px; display: flex; align-items: center; justify-content: center; border-radius: 10px; overflow: hidden; }
  .tile .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .tile .thumb .ms { font-size: 52px; }
  .tile .label { width: 100%; font-size: 12px; line-height: 1.3; word-break: break-word; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .rename-input { width: 100%; padding: 2px 6px; border-radius: 6px; border: 1px solid var(--accent); outline: 0; background: rgba(0,0,0,.5); font-size: 12.5px; user-select: text; }
  .empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; height: 70%; color: var(--dim); font-size: 13px; text-align: center; padding: 20px; }
  .empty .ms { font-size: 48px; opacity: .5; }
  .status { display: flex; align-items: center; gap: 14px; padding: 5px 14px; border-top: 1px solid var(--border); font-size: 11px; color: var(--dim); }
  .status .grow { flex: 1; }

  /* Icons by type */
  .c-folder { color: #64b5ff; } .c-image { color: #4cd964; } .c-audio { color: #ff6b9d; } .c-video { color: #bf5af2; }
  .c-doc { color: #5e9cff; } .c-code { color: #ffd60a; } .c-archive { color: #ff9f0a; } .c-pdf { color: #ff453a; } .c-exe { color: #a1a1a6; } .c-file { color: rgba(255,255,255,.6); } .c-drive { color: #8e8e93; }

  /* Menus, toasts, preview */
  .menu { position: fixed; z-index: 1000; min-width: 210px; padding: 6px; border-radius: 13px; background: var(--menu); border: 1px solid rgba(255,255,255,.1); box-shadow: 0 18px 50px rgba(0,0,0,.5); display: none; flex-direction: column; animation: pop .16s var(--spring); }
  .menu.open { display: flex; }
  @keyframes pop { from { opacity: 0; transform: scale(.96) translateY(-4px); } }
  .menu button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; border: 0; border-radius: 8px; background: transparent; cursor: pointer; font-size: 13px; text-align: left; }
  .menu button:hover:not(:disabled) { background: rgba(255,255,255,.1); }
  .menu button:disabled { opacity: .35; cursor: default; }
  .menu button .ms { font-size: 18px; width: 20px; color: rgba(255,255,255,.7); }
  .menu button.danger, .menu button.danger .ms { color: #ff6961; }
  .menu button.checked .check { margin-left: auto; color: var(--accent); }
  .menu kbd { margin-left: auto; font: 11px 'Poppins', sans-serif; color: var(--dim); }
  .menu hr { border: 0; border-top: 1px solid rgba(255,255,255,.08); margin: 4px 2px; }
  .toasts { position: absolute; bottom: 36px; right: 14px; display: flex; flex-direction: column; gap: 8px; z-index: 500; }
  .toast { min-width: 220px; max-width: 320px; padding: 9px 12px; border-radius: 11px; background: rgba(28,30,36,.96); border: 1px solid rgba(255,255,255,.1); box-shadow: 0 12px 34px rgba(0,0,0,.45); font-size: 12.5px; animation: pop .2s var(--spring); }
  .toast .bar { height: 4px; margin-top: 7px; border-radius: 2px; background: rgba(255,255,255,.12); overflow: hidden; }
  .toast .bar span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .toast.error { border-color: rgba(255,69,58,.5); }
  .toast button { margin-left: 8px; border: 0; background: none; color: var(--accent); font-weight: 600; cursor: pointer; font-size: 12.5px; }
  .preview { position: fixed; inset: 0; z-index: 900; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.72); backdrop-filter: blur(8px); }
  .preview.open { display: flex; }
  .preview-box { position: relative; width: min(92vw, 1000px); height: min(86vh, 720px); display: flex; flex-direction: column; border-radius: 16px; overflow: hidden; background: #16181d; border: 1px solid rgba(255,255,255,.1); box-shadow: 0 30px 80px rgba(0,0,0,.6); animation: pop .2s var(--spring); }
  .preview-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px 8px 16px; border-bottom: 1px solid var(--border); font-size: 13px; }
  .preview-head .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .preview-body { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: auto; }
  .preview-body img, .preview-body video { max-width: 100%; max-height: 100%; object-fit: contain; }
  .preview-body iframe { width: 100%; height: 100%; border: 0; background: #fff; }
  .preview-body pre { width: 100%; height: 100%; margin: 0; padding: 16px 20px; overflow: auto; font: 12.5px/1.6 'JetBrains Mono', 'Roboto Mono', monospace; white-space: pre-wrap; word-break: break-word; color: #e8e8ea; user-select: text; }
  .preview-body .audio { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .preview-body .audio .ms { font-size: 90px; color: #ff6b9d; }
  .preview-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border: 0; border-radius: 50%; background: rgba(0,0,0,.55); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .preview-nav.prev { left: 10px; } .preview-nav.next { right: 10px; }
  .props { display: grid; grid-template-columns: 110px 1fr; gap: 8px 14px; font-size: 13px; }
  .props span:nth-child(odd) { color: var(--muted); }
  .props span:nth-child(even) { user-select: text; word-break: break-all; }

  @media (max-width: 720px) {
    .sidebar { width: 58px; flex-basis: 58px; padding: 10px 6px; }
    .side-item { justify-content: center; padding: 9px; }
    .side-item .txt, .side-item .badge, .side-label, .storage { display: none; }
    .search { width: 130px; }
    .list-head, .row { grid-template-columns: minmax(0,1fr) 80px; }
    .list-head .c-date, .list-head .c-type, .row .m-date, .row .m-type { display: none; }
    .ab .txt { display: none; }
  }
  * { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent; }
</style>
</head>
<body>

<aside class="sidebar" id="sidebar"></aside>

<main class="main">
  <div class="topbar">
    <button class="ib" id="backBtn" title="Back (Alt+Left)"><span class="ms">arrow_back</span></button>
    <button class="ib" id="fwdBtn" title="Forward (Alt+Right)"><span class="ms">arrow_forward</span></button>
    <button class="ib" id="upBtn" title="Up (Alt+Up)"><span class="ms">arrow_upward</span></button>
    <button class="ib" id="refreshBtn" title="Refresh (F5)"><span class="ms">refresh</span></button>
    <div class="crumbs" id="crumbs" title="Click to type a path (Ctrl+L)"></div>
    <label class="search"><span class="ms">search</span><input id="searchInput" placeholder="Search" spellcheck="false" autocomplete="off"></label>
  </div>
  <div class="actionbar" id="actionbar">
    <button class="ab primary" id="newFolderBtn" title="New folder (Ctrl+Shift+N)"><span class="ms">create_new_folder</span><span class="txt">New folder</span></button>
    <button class="ab" id="newFileBtn" title="New text file"><span class="ms">note_add</span><span class="txt">New file</span></button>
    <button class="ab" id="uploadBtn" title="Upload files"><span class="ms">upload</span><span class="txt">Upload</span></button>
    <div class="sep"></div>
    <button class="ab" id="cutBtn" title="Cut (Ctrl+X)"><span class="ms">content_cut</span></button>
    <button class="ab" id="copyBtn" title="Copy (Ctrl+C)"><span class="ms">content_copy</span></button>
    <button class="ab" id="pasteBtn" title="Paste (Ctrl+V)"><span class="ms">content_paste</span></button>
    <button class="ab" id="renameBtn" title="Rename (F2)"><span class="ms">drive_file_rename_outline</span></button>
    <button class="ab" id="deleteBtn" title="Move to trash (Delete)"><span class="ms">delete</span></button>
    <div class="grow"></div>
    <span class="readonly-pill" id="readonlyPill"><span class="ms">lock</span>Read-only</span>
    <button class="ab" id="sortBtn" title="Sort"><span class="ms">sort</span><span class="txt">Sort</span></button>
    <button class="ib" id="viewBtn" title="Switch view"><span class="ms">grid_view</span></button>
  </div>
  <div class="content" id="content" tabindex="0"></div>
  <div class="status"><span id="statusLeft"></span><span class="grow"></span><span id="statusRight"></span></div>
  <div class="toasts" id="toasts"></div>
</main>

<div class="menu" id="ctxMenu"></div>
<div class="menu" id="sortMenu"></div>
<div class="preview" id="preview">
  <div class="preview-box">
    <div class="preview-head"><span class="title" id="previewTitle"></span>
      <button class="ib" id="previewOpen" title="Open in Notes"><span class="ms">edit_note</span></button>
      <button class="ib" id="previewDownload" title="Download"><span class="ms">download</span></button>
      <button class="ib" id="previewClose" title="Close (Esc)"><span class="ms">close</span></button></div>
    <div class="preview-body" id="previewBody"></div>
    <button class="preview-nav prev" id="previewPrev"><span class="ms">chevron_left</span></button>
    <button class="preview-nav next" id="previewNext"><span class="ms">chevron_right</span></button>
  </div>
</div>
<input type="file" id="uploadInput" multiple hidden>

<script>
/* ───────────────────────── Setup ───────────────────────── */
const $ = id => document.getElementById(id);
const IS_EMBEDDED = window.parent !== window;
const TRASH = 'trash:';
const HOME_FOLDERS = [
  { name: 'Home', path: '/home', icon: 'home' },
  { name: 'Desktop', path: '/home/Desktop', icon: 'desktop_windows' },
  { name: 'Documents', path: '/home/Documents', icon: 'description' },
  { name: 'Downloads', path: '/home/Downloads', icon: 'download' },
  { name: 'Pictures', path: '/home/Pictures', icon: 'image' },
  { name: 'Music', path: '/home/Music', icon: 'music_note' },
  { name: 'Videos', path: '/home/Videos', icon: 'movie' }
];
const TYPES = {
  image: ['.png', '.jpg', '.jpeg', '.gif', '.webp', '.bmp', '.svg', '.ico', '.avif'],
  audio: ['.mp3', '.wav', '.ogg', '.m4a', '.flac', '.aac'],
  video: ['.mp4', '.webm', '.mov', '.mkv', '.avi'],
  pdf: ['.pdf'],
  code: ['.js', '.ts', '.json', '.html', '.htm', '.css', '.py', '.java', '.c', '.cpp', '.h', '.cs', '.php', '.rb', '.go', '.rs', '.sh', '.bat', '.ps1', '.xml', '.yml', '.yaml', '.sql', '.vbs'],
  doc: ['.txt', '.md', '.rtf', '.doc', '.docx', '.odt', '.csv', '.log', '.ini', '.cfg'],
  archive: ['.zip', '.rar', '.7z', '.tar', '.gz', '.bz2', '.xz'],
  exe: ['.exe', '.msi', '.dll', '.bin', '.iso', '.dmg', '.apk']
};
const TYPE_ICON = { folder: 'folder', image: 'image', audio: 'music_note', video: 'movie', pdf: 'picture_as_pdf', code: 'code', doc: 'description', archive: 'folder_zip', exe: 'terminal', file: 'draft', drive: 'hard_drive' };
const TYPE_LABEL = { folder: 'Folder', image: 'Image', audio: 'Audio', video: 'Video', pdf: 'PDF document', code: 'Code', doc: 'Document', archive: 'Archive', exe: 'Program', file: 'File', drive: 'Drive' };
const TEXT_EXT = new Set([...TYPES.code, '.txt', '.md', '.csv', '.log', '.ini', '.cfg']);

function kindOf(item) {
  if (item.isVolume) return 'drive';
  if (item.type === 'folder') return 'folder';
  for (const [kind, exts] of Object.entries(TYPES)) if (exts.includes(item.ext)) return kind;
  return 'file';
}
const store = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
try {
  const accent = JSON.parse(localStorage.getItem('desktopStyle') || '{}').accent;
  if (/^#[0-9a-f]{6}$/i.test(accent)) document.documentElement.style.setProperty('--accent', accent);
} catch (e) {}

let currentPath = '/home';
let items = [];
let readOnly = false;
let selection = new Set();
let anchor = null;
let clipboard = store.get('files-clipboard', null);   // { mode, fromPath, names }
let viewMode = store.get('files-view', 'list');
let sortKey = store.get('files-sort', 'name');
let sortDir = store.get('files-sort-dir', 1);
let showHidden = store.get('files-hidden', false);
let searchQuery = '';
let searchResults = null;
const history = { back: [], fwd: [] };
let loadToken = 0;

/* ───────────────────────── Helpers ───────────────────────── */
function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
function icon(name, cls = '') { return el('span', 'ms ' + cls, name); }
function joinPath(dir, name) { return (dir === '/' ? '' : dir.replace(/\/$/, '')) + '/' + name; }
function parentOf(p) {
  if (p === '/' || p === TRASH) return null;
  if (p === '/device') return '/';
  const up = p.replace(/\/[^/]*\/?$/, '') || '/';
  return /^\/device\/[A-Za-z]:?$/.test(p) ? '/device' : up;
}
const isHome = p => p === '/home' || p.startsWith('/home/');
function formatSize(bytes) {
  if (!(bytes >= 0)) return '';
  const u = ['B', 'KB', 'MB', 'GB', 'TB'];
  let i = 0, v = bytes;
  while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
  return `${i ? v.toFixed(1) : v} ${u[i]}`;
}
function formatDate(ms, fallback) {
  if (!ms) return fallback && fallback !== '--' ? fallback : '';
  const d = new Date(ms), now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  return sameDay ? `Today ${d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}` : d.toLocaleString([], { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}
async function api(url, options) {
  const res = await fetch(url, options);
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok || (data && data.success === false)) {
    const err = new Error(data?.error || (res.status === 401 ? 'Session expired: log in again' : `Request failed (${res.status})`));
    err.status = res.status;
    throw err;
  }
  return data || {};
}
const postJson = (url, body) => api(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
function toast(message, { error = false, action, progress = false, sticky = false } = {}) {
  const t = el('div', 'toast' + (error ? ' error' : ''));
  const line = el('div');
  const text = el('span', null, message);
  line.append(text);
  if (action) { const b = el('button', null, action.label); b.onclick = () => { action.run(); t.remove(); }; line.append(b); }
  t.append(line);
  let bar = null;
  if (progress) { const wrap = el('div', 'bar'); bar = el('span'); wrap.append(bar); t.append(wrap); }
  $('toasts').append(t);

  try {
    const d = await api('/api/system/files/trash');
    const ids = d.items.filter(t => t.from === lastTrashed.fromPath && lastTrashed.names.includes(t.name) && t.deletedAt >= lastTrashed.at - 5000).map(t => t.id);
    await postJson('/api/system/files/trash/restore', { ids });
    lastTrashed = null;
    await reload();
    notifyDesktop();
  } catch (e) { toast(e.message, { error: true }); }
}
async function deleteSelection({ permanent = false } = {}) {
  const sel = selectedItems();
  if (!sel.length) return;
  if (currentPath === TRASH) {
    if (!(await mDialog.confirm(`Delete ${sel.length === 1 ? `"${sel[0].name}"` : sel.length + ' items'} forever? This cannot be undone.`, { title: 'Delete forever', okText: 'Delete', danger: true }))) return;
    try { await postJson('/api/system/files/trash/empty', { ids: sel.map(i => i.trashId) }); await load(); } catch (e) { toast(e.message, { error: true }); }
    return;
  }
  if (readOnly) return;
  if (permanent) {
    if (!(await mDialog.confirm(`Delete ${sel.length === 1 ? `"${sel[0].name}"` : sel.length + ' items'} forever? They will not go to the trash.`, { title: 'Delete forever', okText: 'Delete', danger: true }))) return;
    for (const [dir, names] of groupByDir(sel)) {
      for (const name of names) {
        try { await postJson('/api/system/files/delete', { path: dir, name, recursive: true }); } catch (e) { toast(`${name}: ${e.message}`, { error: true }); }
      }
    }
    await reload();
    notifyDesktop();
    return;
  }
  for (const [dir, names] of groupByDir(sel)) await trashItems(names, dir);
}
async function restoreItems(list) {
  try {
    const d = await postJson('/api/system/files/trash/restore', { ids: list.map(i => i.trashId) });
    toast(`Restored ${d.restored.length} ${d.restored.length === 1 ? 'item' : 'items'}`);
    await load();
    notifyDesktop();
  } catch (e) { toast(e.message, { error: true }); }
}
async function emptyTrash() {
  if (!(await mDialog.confirm('Permanently delete everything in the trash?', { title: 'Empty trash', okText: 'Empty', danger: true }))) return;
  try { await postJson('/api/system/files/trash/empty', {}); await load(); } catch (e) { toast(e.message, { error: true }); }
}
function setClipboard(mode) {
  const sel = selectedItems().filter(i => isHome(i.dir || currentPath) && !i.trashId);
  if (!sel.length) return;
  const groups = groupByDir(sel);
  if (groups.size > 1) { toast('Select items from one folder to copy or cut', { error: true }); return; }
  const [[fromPath, names]] = groups;
  clipboard = { mode, fromPath, names };
  store.set('files-clipboard', clipboard);
  toast(`${names.length} ${names.length === 1 ? 'item' : 'items'} ${mode === 'cut' ? 'cut' : 'copied'}`);
  render();
}
async function paste(toPath = currentPath) {
  if (!clipboard || readOnly || currentPath === TRASH) return;
  await transfer(clipboard.fromPath, toPath, clipboard.names, clipboard.mode === 'cut' ? 'move' : 'copy');
  if (clipboard.mode === 'cut') { clipboard = null; store.set('files-clipboard', null); }
}
async function transfer(fromPath, toPath, names, mode) {
  const t = toast(`${mode === 'move' ? 'Moving' : 'Copying'} ${names.length} ${names.length === 1 ? 'item' : 'items'}…`, { sticky: true });
  try {
    const d = await postJson('/api/system/files/transfer', { fromPath, toPath, names, mode });
    const errors = (d.results || []).filter(r => r.error);
    t.remove();
    if (errors.length) toast(errors.map(r => `${r.name}: ${r.error}`).join('\n'), { error: true });
    else toast(`${mode === 'move' ? 'Moved' : 'Copied'} ${names.length} ${names.length === 1 ? 'item' : 'items'}`);
  } catch (e) { t.remove(); toast(e.message, { error: true }); }
  await reload();
  notifyDesktop();
}
async function reload() {
  if (searchResults) await runSearch(searchQuery); else await load();
}

/* ── Uploads with progress (raw binary, no base64) ── */
function uploadFiles(files, toPath = currentPath) {
  if (readOnly || currentPath === TRASH || !files.length) return;
  const list = [...files];
  const t = toast(`Uploading ${list.length} ${list.length === 1 ? 'file' : 'files'}…`, { progress: true });
  const total = list.reduce((s, f) => s + f.size, 0) || 1;
  let sent = 0, failed = 0;
  const next = i => {
    if (i >= list.length) {
      t.done(failed ? `${list.length - failed} uploaded, ${failed} failed` : `Uploaded ${list.length} ${list.length === 1 ? 'file' : 'files'}`, failed > 0);
      load();
      notifyDesktop();
      return;
    }
    const file = list[i];
    const xhr = new XMLHttpRequest();
    xhr.open('POST', `/api/system/files/upload-raw?path=${encodeURIComponent(toPath)}&name=${encodeURIComponent(file.name)}&conflict=rename`);
    xhr.setRequestHeader('Content-Type', 'application/octet-stream');
    xhr.upload.onprogress = e => t.set(Math.round((sent + e.loaded) / total * 100), `Uploading ${file.name} (${i + 1}/${list.length})`);
    xhr.onload = () => { if (xhr.status >= 300) failed++; sent += file.size; next(i + 1); };
    xhr.onerror = () => { failed++; sent += file.size; next(i + 1); };
    xhr.send(file);
  };
  next(0);
}
$('uploadBtn').onclick = () => $('uploadInput').click();
$('uploadInput').onchange = e => { uploadFiles(e.target.files); e.target.value = ''; };

/* ── Drag and drop: internal moves and external uploads ── */
let dragData = null;
function onDragStart(e, item) {
  if (!selection.has(itemKey(item))) selectOnly(item);
  const sel = selectedItems();
  const groups = groupByDir(sel);
  if (groups.size !== 1) { e.preventDefault(); return; }
  const [[fromPath, names]] = groups;
  dragData = { fromPath, names };
  e.dataTransfer.effectAllowed = 'copyMove';
  e.dataTransfer.setData('text/plain', names.join('\n'));
}
function makeDropTarget(node, getPath) {
  node.addEventListener('dragover', e => {
    const target = getPath();
    if (dragData ? (dragData.names.length && !(dragData.fromPath === parentOf(target) && dragData.names.includes(target.split('/').pop())) && target !== dragData.fromPath) : e.dataTransfer.types.includes('Files')) {
      e.preventDefault();
      e.stopPropagation();
      e.dataTransfer.dropEffect = dragData && (e.ctrlKey || e.altKey) ? 'copy' : dragData ? 'move' : 'copy';
      node.classList.add('drop-target');
    }
  });
  node.addEventListener('dragleave', () => node.classList.remove('drop-target'));
  node.addEventListener('drop', e => {
    e.preventDefault();
    e.stopPropagation();
    node.classList.remove('drop-target');
    const target = getPath();
    if (dragData) { const d = dragData; dragData = null; transfer(d.fromPath, target, d.names, e.ctrlKey || e.altKey ? 'copy' : 'move'); }
    else if (e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files, target);
  });
}
const content = $('content');
content.addEventListener('dragover', e => {
  if (dragData || readOnly || currentPath === TRASH || !e.dataTransfer.types.includes('Files')) return;
  e.preventDefault();
  content.classList.add('drag-over');
});
content.addEventListener('dragleave', e => { if (e.target === content) content.classList.remove('drag-over'); });
content.addEventListener('drop', e => {
  content.classList.remove('drag-over');
  if (dragData) return;
  e.preventDefault();
  if (e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files);
});

/* ───────────────────────── Search ───────────────────────── */
let searchTimer = null;
$('searchInput').addEventListener('input', e => {
  clearTimeout(searchTimer);
  const q = e.target.value.trim();
  searchTimer = setTimeout(() => runSearch(q), 300);
});
$('searchInput').addEventListener('keydown', e => {
  if (e.key === 'Escape') { e.target.value = ''; runSearch(''); $('content').focus(); }
  if (e.key === 'ArrowDown' || e.key === 'Enter') { e.preventDefault(); $('content').focus(); moveSelection(0); }
});
async function runSearch(q) {
  searchQuery = q;
  selection.clear();
  if (!q) { searchResults = null; render(); return; }
  if (!isHome(currentPath)) {
    // Outside Home: filter the current folder only.
    searchResults = items.filter(i => i.name.toLowerCase().includes(q.toLowerCase())).map(i => ({ ...i, dir: currentPath }));
    render();
    return;
  }
  const token = ++loadToken;
  try {
    const d = await api(`/api/system/files/search?path=${encodeURIComponent(currentPath)}&q=${encodeURIComponent(q)}`);
    if (token !== loadToken) return;
    searchResults = d.results;
    render();
  } catch (e) { toast(e.message, { error: true }); }
}

/* ───────────────────────── Menus ───────────────────────── */
function menuItem(iconName, label, run, { kbd = '', danger = false, disabled = false, checked = null } = {}) {
  const b = el('button', (danger ? 'danger ' : '') + (checked ? 'checked' : ''));
  b.disabled = disabled;
  b.append(icon(iconName), el('span', null, label));
  if (checked !== null) b.append(icon(checked ? 'check' : '', 'check'));
  else if (kbd) b.append(el('kbd', null, kbd));
  b.onclick = () => { closeMenus(); run(); };
  return b;
}
const hr = () => el('hr');
function openMenu(menu, x, y) {
  closeMenus();
  menu.classList.add('open');
  const r = menu.getBoundingClientRect();
  menu.style.left = Math.max(6, Math.min(x, innerWidth - r.width - 6)) + 'px';
  menu.style.top = Math.max(6, Math.min(y, innerHeight - r.height - 6)) + 'px';
}
function closeMenus() { document.querySelectorAll('.menu.open').forEach(m => m.classList.remove('open')); }
document.addEventListener('mousedown', e => { if (!e.target.closest('.menu') && !e.target.closest('#sortBtn')) closeMenus(); });
window.addEventListener('blur', closeMenus);

function openContextMenu(x, y, item) {
  const menu = $('ctxMenu');
  menu.replaceChildren();
  const sel = selectedItems();
  const writable = !readOnly && currentPath !== TRASH;
  if (currentPath === TRASH) {
    if (sel.length) menu.append(menuItem('restore_from_trash', 'Restore', () => restoreItems(sel)), menuItem('delete_forever', 'Delete forever', () => deleteSelection(), { danger: true }));
    else menu.append(menuItem('delete_sweep', 'Empty trash', emptyTrash, { danger: true, disabled: !items.length }));
  } else if (item) {
    const kind = kindOf(item);
    const inHome = isHome(item.dir || currentPath);
    menu.append(menuItem(item.type === 'folder' ? 'folder_open' : 'open_in_new', 'Open', () => openItem(item), { kbd: 'Enter' }));
    if (item.type === 'file' && inHome) {
      if (['image', 'audio', 'video', 'pdf'].includes(kind) || TEXT_EXT.has(item.ext)) menu.append(menuItem('visibility', 'Quick look', () => openPreview(item), { kbd: 'Space' }));
      if (TEXT_EXT.has(item.ext) || !item.ext) menu.append(menuItem('edit_note', 'Edit in Notes', () => openInNotes(item)));
      menu.append(menuItem('download', 'Download', () => sel.forEach(download)));
    }
    if (searchResults) menu.append(menuItem('folder', 'Show in folder', () => { const d = item.dir; navigate(d).then(() => { const f = items.find(i => i.name === item.name); if (f) selectOnly(f); }); }));
    if (item.type === 'folder') menu.append(menuItem('terminal', 'Open in Terminal', () => openTerminal(joinPath(item.dir || currentPath, item.name))));
    menu.append(hr(),
      menuItem('content_cut', 'Cut', () => setClipboard('cut'), { kbd: 'Ctrl+X', disabled: !inHome || readOnly }),
      menuItem('content_copy', 'Copy', () => setClipboard('copy'), { kbd: 'Ctrl+C', disabled: !inHome }),
      menuItem('drive_file_rename_outline', 'Rename', () => startRename(item), { kbd: 'F2', disabled: sel.length !== 1 || !inHome || readOnly }),
      menuItem('content_copy', 'Copy path', () => navigator.clipboard?.writeText(joinPath(item.dir || currentPath, item.name))),
      menuItem('info', 'Properties', () => showProperties(item)),
      hr(),
      menuItem('delete', 'Move to trash', () => deleteSelection(), { kbd: 'Del', danger: true, disabled: !inHome || readOnly }));
  } else {
    menu.append(
      menuItem('create_new_folder', 'New folder', createFolder, { disabled: !writable }),
      menuItem('note_add', 'New text file', createFile, { disabled: !writable }),
      menuItem('upload', 'Upload files…', () => $('uploadInput').click(), { disabled: !writable }),
      menuItem('content_paste', 'Paste', () => paste(), { kbd: 'Ctrl+V', disabled: !writable || !clipboard }),
      hr(),
      menuItem('select_all', 'Select all', selectAll, { kbd: 'Ctrl+A' }),
      menuItem('refresh', 'Refresh', load, { kbd: 'F5' }),
      menuItem('terminal', 'Open in Terminal', () => openTerminal(currentPath)),
      menuItem('visibility', 'Show hidden files', toggleHidden, { checked: showHidden }));
  }
  openMenu(menu, x, y);
}
function openTerminal(p) {
  if (IS_EMBEDDED) window.parent.postMessage({ type: 'open-terminal-in-directory', path: p || '/' }, location.origin);
}
function toggleHidden() { showHidden = !showHidden; store.set('files-hidden', showHidden); render(); }
function selectAll() { selection = new Set(visibleItems().map(itemKey)); refreshSelectionClasses(); }

$('sortBtn').onclick = () => {
  const menu = $('sortMenu');
  menu.replaceChildren();
  [['name', 'Name'], ['date', 'Date modified'], ['size', 'Size'], ['type', 'Type']].forEach(([key, label]) =>
    menu.append(menuItem(key === 'name' ? 'sort_by_alpha' : key === 'date' ? 'schedule' : key === 'size' ? 'straighten' : 'category', label, () => { sortKey = key; store.set('files-sort', key); render(); }, { checked: sortKey === key })));
  menu.append(hr(),
    menuItem('arrow_upward', 'Ascending', () => { sortDir = 1; store.set('files-sort-dir', 1); render(); }, { checked: sortDir > 0 }),
    menuItem('arrow_downward', 'Descending', () => { sortDir = -1; store.set('files-sort-dir', -1); render(); }, { checked: sortDir < 0 }),
    hr(),
    menuItem('visibility', 'Show hidden files', toggleHidden, { checked: showHidden }));
  const r = $('sortBtn').getBoundingClientRect();
  openMenu(menu, r.left, r.bottom + 6);
};
$('viewBtn').onclick = () => { viewMode = viewMode === 'list' ? 'grid' : 'list'; store.set('files-view', viewMode); render(); };
$('newFolderBtn').onclick = createFolder;
$('newFileBtn').onclick = createFile;
$('cutBtn').onclick = () => setClipboard('cut');
$('copyBtn').onclick = () => setClipboard('copy');
$('pasteBtn').onclick = () => paste();
$('renameBtn').onclick = () => startRename(selectedItems()[0]);
$('deleteBtn').onclick = () => deleteSelection();

function showProperties(item) {
  const kind = kindOf(item);
  const box = el('div', 'props');
  const rows = [['Name', item.name], ['Type', TYPE_LABEL[kind] + (item.ext ? ` (${item.ext})` : '')], ['Location', item.dir || currentPath],
    ['Size', item.bytes >= 0 ? `${formatSize(item.bytes)} (${item.bytes.toLocaleString()} bytes)` : '—'], ['Modified', formatDate(item.mtime, item.date) || '—']];
  rows.forEach(([k, v]) => box.append(el('span', null, k), el('span', null, v)));
  mDialog.alert(rows.map(([k, v]) => `${k}: ${v}`).join('\n'), { title: 'Properties', kind: 'info' });
}

/* ───────────────────────── Keyboard ───────────────────────── */
document.addEventListener('keydown', e => {
  if (document.querySelector('.mdlg-backdrop')) return;
  const inField = e.target.closest('input');
  const ctrl = e.ctrlKey || e.metaKey;
  if ($('preview').classList.contains('open')) {
    if (e.key === 'Escape' || e.key === ' ') { e.preventDefault(); closePreview(); }
    if (e.key === 'ArrowRight') $('previewNext').click();
    if (e.key === 'ArrowLeft') $('previewPrev').click();
    return;
  }
  if (e.key === 'Escape') { closeMenus(); if (!inField) { selection.clear(); refreshSelectionClasses(); } return; }
  if (ctrl && e.key.toLowerCase() === 'l') { e.preventDefault(); editAddress(); return; }
  if (ctrl && e.key.toLowerCase() === 'f') { e.preventDefault(); $('searchInput').focus(); $('searchInput').select(); return; }
  if (e.key === 'F5') { e.preventDefault(); load(); return; }
  if (e.altKey && e.key === 'ArrowLeft') { e.preventDefault(); $('backBtn').click(); return; }
  if (e.altKey && e.key === 'ArrowRight') { e.preventDefault(); $('fwdBtn').click(); return; }
  if (e.altKey && e.key === 'ArrowUp') { e.preventDefault(); $('upBtn').click(); return; }
  if (inField) return;
  const sel = selectedItems();
  if (ctrl && e.shiftKey && e.key.toLowerCase() === 'n') { e.preventDefault(); createFolder(); }
  else if (ctrl && e.key.toLowerCase() === 'a') { e.preventDefault(); selectAll(); }
  else if (ctrl && e.key.toLowerCase() === 'c') { e.preventDefault(); setClipboard('copy'); }
  else if (ctrl && e.key.toLowerCase() === 'x') { e.preventDefault(); setClipboard('cut'); }
  else if (ctrl && e.key.toLowerCase() === 'v') { e.preventDefault(); paste(); }
  else if (e.key === 'F2') { e.preventDefault(); if (sel.length === 1) startRename(sel[0]); }
  else if (e.key === 'Delete') { e.preventDefault(); deleteSelection({ permanent: e.shiftKey }); }
  else if (e.key === 'Enter') { e.preventDefault(); if (sel.length === 1) openItem(sel[0]); }
  else if (e.key === 'Backspace') { e.preventDefault(); $('backBtn').click(); }
  else if (e.key === ' ') { e.preventDefault(); if (sel.length === 1 && sel[0].type === 'file') openPreview(sel[0]); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); moveSelection(viewMode === 'grid' ? 2 : 1, e.shiftKey); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); moveSelection(viewMode === 'grid' ? -2 : -1, e.shiftKey); }
  else if (e.key === 'ArrowRight' && viewMode === 'grid') { e.preventDefault(); moveSelection(1, e.shiftKey); }
  else if (e.key === 'ArrowLeft' && viewMode === 'grid') { e.preventDefault(); moveSelection(-1, e.shiftKey); }
});
// Mouse back/forward buttons over the window.
window.addEventListener('mouseup', e => {
  if (e.button === 3) { e.preventDefault(); $('backBtn').click(); }
  if (e.button === 4) { e.preventDefault(); $('fwdBtn').click(); }
});

/* ───────────────────────── Desktop integration ───────────────────────── */
window.addEventListener('message', e => {
  if (e.origin !== location.origin || !e.data || typeof e.data !== 'object') return;
  if (e.data.type === 'navigate' && typeof e.data.path === 'string') navigate(e.data.path);
  if (e.data.type === 'refresh-view') load();
});
// The old Files app injected tabs into the desktop window header: restore it.
(function restoreDesktopHeader() {
  if (!IS_EMBEDDED) return;
  try {
    const doc = window.parent.document;
    const header = doc.querySelector('#popup10 .popup-header');
    if (header && header.querySelector('#os-explorer-tabs, #os-explorer-actions')) {
      header.style.gap = '';
      header.innerHTML = '<span>Files</span><div class="window-actions">' +
        '<span class="material-symbols-outlined action-btn min-btn" onclick="minimizePopup(\'popup10\')">remove</span>' +
        '<span class="material-symbols-outlined action-btn max-btn" onclick="toggleMaximize(\'popup10\')">crop_square</span>' +
        '<span class="material-symbols-outlined action-btn close-btn" onclick="closePopup(\'popup10\')">close</span></div>';
    }
    doc.getElementById('explorer-os-styles')?.remove();
  } catch (e) {}
})();

/* ───────────────────────── Boot ───────────────────────── */
const startPath = new URLSearchParams(location.search).get('path') || '/home';
renderSidebar();
navigate(startPath, { push: false });
setInterval(loadStorage, 60000);
</script>
