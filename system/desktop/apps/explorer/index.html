<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="/desktop/assets/i18n-data.js"></script>
<script src="/desktop/assets/i18n.js"></script>
<script src="/api/users/me.js"></script>
<script src="/desktop/assets/accent.js"></script>
<title data-i18n="explorer.title">Files</title>
<link href="/desktop/assets/fonts/fonts.css" rel="stylesheet">
<script src="/desktop/assets/mariowos-dialogs.js"></script>
<style>
  :root {
    --accent: var(--sys-accent);
    --text: #fff;
    --muted: rgba(255,255,255,.55);
    --dim: rgba(255,255,255,.35);
    --border: rgba(255,255,255,.08);
    --hover: rgba(255,255,255,.07);
    --sidebar: rgba(20,21,26,.72);
    --menu: rgba(26,28,34,.97);
    --spring: cubic-bezier(.16,1,.3,1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100vh; overflow: hidden; }
  body { display: flex; font-family: 'Poppins', sans-serif; color: var(--text); background: transparent; -webkit-font-smoothing: antialiased; user-select: none; }
  button, input { font-family: inherit; color: inherit; }
  .ms { font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal; line-height: 1; display: inline-block; white-space: nowrap; direction: ltr; -webkit-font-smoothing: antialiased; font-feature-settings: 'liga'; }

  /* Sidebar */
  .sidebar { width: 220px; flex: 0 0 220px; display: flex; flex-direction: column; background: var(--sidebar); border-right: 1px solid rgba(0,0,0,.35); backdrop-filter: blur(30px); overflow-y: auto; padding: 10px 8px; }
  .side-label { padding: 12px 10px 4px; font-size: 10.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--dim); }
  .side-item { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 9px; font-size: 13px; cursor: pointer; color: rgba(255,255,255,.85); transition: background .15s; }
  .side-item:hover { background: var(--hover); }
  .side-item.active { background: color-mix(in srgb, var(--accent) 24%, transparent); color: #fff; }
  .side-item.drop-target { outline: 2px dashed var(--accent); outline-offset: -2px; }
  .side-item .ms { font-size: 19px; width: 20px; color: var(--sys-accent-text); }
  .side-item.trash .ms { color: rgba(255,255,255,.7); }
  .side-item .badge { margin-left: auto; font-size: 11px; color: var(--dim); }
  /* Colored gradient icon tiles — mariowOS "language", matching Settings. */
  .side-item .icon-bg { width: 24px; height: 24px; flex: 0 0 24px; border-radius: 6px; display: flex;
    align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(0,0,0,.28); }
  .side-item .icon-bg .ms { font-size: 15px; width: auto; color: #fff; }
  .ic-home { background: linear-gradient(180deg, #0a84ff, #007aff); }
  .ic-desktop { background: linear-gradient(180deg, #8e8e93, #636366); }
  .ic-documents { background: linear-gradient(180deg, #2fa8ff, #1f9dff); }
  .ic-downloads { background: linear-gradient(180deg, #34c759, #28cd41); }
  .ic-pictures { background: linear-gradient(180deg, #32c8a0, #28bd96); }
  .ic-music { background: linear-gradient(180deg, #ff375f, #ff2d55); }
  .ic-videos { background: linear-gradient(180deg, #bf5af2, #af52de); }
  .ic-trash { background: linear-gradient(180deg, #8e8e93, #636366); }
  .ic-system { background: linear-gradient(180deg, #5e5ce6, #5856d6); }
  .ic-drive { background: linear-gradient(180deg, #40c8e0, #30b8d4); }
  .storage { margin: auto 8px 4px; padding: 10px; border-radius: 10px; background: rgba(255,255,255,.04); font-size: 11px; color: var(--muted); }
  .storage-bar { height: 5px; margin-top: 6px; border-radius: 3px; background: rgba(255,255,255,.1); overflow: hidden; }
  .storage-bar span { display: block; height: 100%; background: var(--accent); border-radius: 3px; color: var(--sys-accent-on); }

  /* Main */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
  .topbar { display: flex; align-items: center; gap: 4px; padding: 8px 10px; border-bottom: 1px solid var(--border); background: rgba(0,0,0,.18); }
  .ib { width: 32px; height: 32px; flex: 0 0 32px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 8px; background: transparent; color: rgba(255,255,255,.8); cursor: pointer; }
  .ib:hover:not(:disabled) { background: var(--hover); color: #fff; }
  .ib:disabled { opacity: .3; cursor: default; }
  .ib.on { color: var(--sys-accent-text); background: color-mix(in srgb, var(--accent) 18%, transparent); }
  .ib .ms { font-size: 20px; }
  .crumbs { flex: 1; min-width: 0; height: 34px; display: flex; align-items: center; gap: 2px; padding: 0 6px; border-radius: 9px; background: rgba(0,0,0,.28); border: 1px solid var(--border); overflow: hidden; cursor: text; }
  .crumbs:focus-within { border-color: var(--sys-accent-text); }
  .crumb { flex: 0 0 auto; padding: 3px 7px; border-radius: 6px; font-size: 12.5px; color: rgba(255,255,255,.8); cursor: pointer; white-space: nowrap; max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
  .crumb:hover { background: var(--hover); color: #fff; }
  .crumb.last { color: #fff; font-weight: 500; }
  .crumb-sep { flex: 0 0 auto; font-size: 16px; color: var(--dim); }
  .crumbs input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 12.5px; user-select: text; }
  .search { width: 200px; height: 34px; display: flex; align-items: center; gap: 6px; padding: 0 10px; border-radius: 9px; background: rgba(0,0,0,.28); border: 1px solid var(--border); }
  .search:focus-within { border-color: var(--sys-accent-text); }
  .search .ms { font-size: 17px; color: var(--dim); }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 12.5px; user-select: text; }
  .actionbar { display: flex; align-items: center; gap: 2px; padding: 5px 10px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .ab { height: 30px; display: inline-flex; align-items: center; gap: 6px; padding: 0 9px; border: 0; border-radius: 8px; background: transparent; color: rgba(255,255,255,.82); cursor: pointer; font-size: 12.5px; }
  .ab:hover:not(:disabled) { background: var(--hover); color: #fff; }
  .ab:disabled { opacity: .3; cursor: default; }
  .ab .ms { font-size: 18px; }
  .ab.primary { background: color-mix(in srgb, var(--accent) 22%, transparent); color: #fff; }
  .sep { width: 1px; height: 18px; margin: 0 4px; background: rgba(255,255,255,.1); }
  .grow { flex: 1; }
  .readonly-pill { display: none; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; background: rgba(255,159,10,.15); color: #ffb340; font-size: 11px; }
  .readonly-pill.show { display: inline-flex; }
  .readonly-pill .ms { font-size: 14px; }

  /* Content */
  .content { flex: 1; overflow: auto; position: relative; outline: none; }
  .content.drag-over::after { content: attr(data-drop-text); position: absolute; inset: 10px; display: flex; align-items: center; justify-content: center; border: 2px dashed var(--accent); border-radius: 14px; background: color-mix(in srgb, var(--accent) 10%, transparent); font-size: 14px; pointer-events: none; }
  .list-head { position: sticky; top: 0; z-index: 2; display: grid; grid-template-columns: minmax(0,1fr) 150px 110px 90px; gap: 10px; padding: 7px 16px; background: rgba(22,24,30,.96); border-bottom: 1px solid var(--border); font-size: 11.5px; color: var(--muted); }
  .list-head span { cursor: pointer; display: flex; align-items: center; gap: 3px; }
  .list-head span:hover { color: #fff; }
  .list-head span.right { justify-content: flex-end; }
  .list-head .ms { font-size: 15px; }
  .row { display: grid; grid-template-columns: minmax(0,1fr) 150px 110px 90px; gap: 10px; align-items: center; padding: 5px 16px; margin: 0 6px; border-radius: 8px; font-size: 13px; cursor: default; }
  .row:hover { background: var(--hover); }
  .row.selected, .tile.selected { background: color-mix(in srgb, var(--accent) 26%, transparent); }
  .row.cut, .tile.cut { opacity: .45; }
  .row.drop-target, .tile.drop-target { outline: 2px solid var(--accent); outline-offset: -2px; }
  .row .name { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .row .name span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .meta { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .meta.right { text-align: right; }
  .row .sub { color: var(--dim); font-size: 11px; }
  .ficon { font-size: 22px; flex: 0 0 22px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); gap: 6px; padding: 12px; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 6px 8px; border-radius: 12px; cursor: default; text-align: center; }
  .tile:hover { background: var(--hover); }
  .tile .thumb { width: 64px; height: 64px; display: flex; align-items: center; justify-content: center; border-radius: 10px; overflow: hidden; }
  .tile .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .tile .thumb .ms { font-size: 52px; }
  .tile .label { width: 100%; font-size: 12px; line-height: 1.3; word-break: break-word; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .rename-input { width: 100%; padding: 2px 6px; border-radius: 6px; border: 1px solid var(--accent); outline: 0; background: rgba(0,0,0,.5); font-size: 12.5px; user-select: text; }
  .empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; height: 70%; color: var(--dim); font-size: 13px; text-align: center; padding: 20px; }
  .empty .ms { font-size: 48px; opacity: .5; }
  .status { display: flex; align-items: center; gap: 14px; padding: 5px 14px; border-top: 1px solid var(--border); font-size: 11px; color: var(--dim); }
  .status .grow { flex: 1; }

  /* Icons by type — colored gradient chips (Settings/mariowOS icon language) */
  .fchip { display: flex; align-items: center; justify-content: center; border-radius: 7px; color: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .fchip .ms { color: #fff; }
  .row .fchip { width: 30px; height: 30px; flex: 0 0 30px; }
  .row .fchip .ms { font-size: 18px; }
  .tile .thumb .fchip { width: 100%; height: 100%; border-radius: 12px; }
  .tile .thumb .fchip .ms { font-size: 34px; }
  .c-folder { background: none; box-shadow: none; }
  .fchip.c-folder .ms { color: var(--sys-accent-text); font-variation-settings: 'FILL' 1; }
  .row .fchip.c-folder .ms { font-size: 28px; }
  .tile .thumb .fchip.c-folder .ms { font-size: 72px; }
  .c-image { background: linear-gradient(180deg,#32c8a0,#28bd96); } .c-audio { background: linear-gradient(180deg,#ff375f,#ff2d55); } .c-video { background: linear-gradient(180deg,#bf5af2,#af52de); }
  .c-doc { background: linear-gradient(180deg,#2fa8ff,#1f9dff); } .c-code { background: linear-gradient(180deg,#ffbf1a,#f0b000); } .c-archive { background: linear-gradient(180deg,#ff9f0a,#ff9500); } .c-pdf { background: linear-gradient(180deg,#ff453a,#ff3b30); } .c-exe { background: linear-gradient(180deg,#8e8e93,#636366); } .c-file { background: linear-gradient(180deg,#8e8e93,#636366); } .c-drive { background: linear-gradient(180deg,#8e8e93,#636366); }

  /* Menus, toasts, preview */
  .menu { position: fixed; z-index: 1000; min-width: 210px; padding: 6px; border-radius: 13px; background: var(--menu); border: 1px solid rgba(255,255,255,.1); box-shadow: 0 18px 50px rgba(0,0,0,.5); display: none; flex-direction: column; animation: pop .16s var(--spring); }
  .menu.open { display: flex; }
  @keyframes pop { from { opacity: 0; transform: scale(.96) translateY(-4px); } }
  .menu button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; border: 0; border-radius: 8px; background: transparent; cursor: pointer; font-size: 13px; text-align: left; }
  .menu button:hover:not(:disabled) { background: rgba(255,255,255,.1); }
  .menu button:disabled { opacity: .35; cursor: default; }
  .menu button .ms { font-size: 18px; width: 20px; color: rgba(255,255,255,.7); }
  .menu button.danger, .menu button.danger .ms { color: #ff6961; }
  .menu button.checked .check { margin-left: auto; color: var(--sys-accent-text); }
  .menu kbd { margin-left: auto; font: 11px 'Poppins', sans-serif; color: var(--dim); }
  .menu hr { border: 0; border-top: 1px solid rgba(255,255,255,.08); margin: 4px 2px; }
  .toasts { position: absolute; bottom: 36px; right: 14px; display: flex; flex-direction: column; gap: 8px; z-index: 500; }
  .toast { min-width: 220px; max-width: 320px; padding: 9px 12px; border-radius: 11px; background: rgba(28,30,36,.96); border: 1px solid rgba(255,255,255,.1); box-shadow: 0 12px 34px rgba(0,0,0,.45); font-size: 12.5px; animation: pop .2s var(--spring); }
  .toast .bar { height: 4px; margin-top: 7px; border-radius: 2px; background: rgba(255,255,255,.12); overflow: hidden; }
  .toast .bar span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; color: var(--sys-accent-on); }
  .toast.error { border-color: rgba(255,69,58,.5); }
  .toast button { margin-left: 8px; border: 0; background: none; color: var(--sys-accent-text); font-weight: 600; cursor: pointer; font-size: 12.5px; }
  .preview { position: fixed; inset: 0; z-index: 900; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.72); backdrop-filter: blur(8px); }
  .preview.open { display: flex; }
  .preview-box { position: relative; width: min(92vw, 1000px); height: min(86vh, 720px); display: flex; flex-direction: column; border-radius: 16px; overflow: hidden; background: #16181d; border: 1px solid rgba(255,255,255,.1); box-shadow: 0 30px 80px rgba(0,0,0,.6); animation: pop .2s var(--spring); }
  .preview-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px 8px 16px; border-bottom: 1px solid var(--border); font-size: 13px; }
  .preview-head .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .preview-body { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: auto; }
  .preview-body img, .preview-body video { max-width: 100%; max-height: 100%; object-fit: contain; }
  .preview-body iframe { width: 100%; height: 100%; border: 0; background: #fff; }
  .preview-body pre { width: 100%; height: 100%; margin: 0; padding: 16px 20px; overflow: auto; font: 12.5px/1.6 'JetBrains Mono', 'Roboto Mono', monospace; white-space: pre-wrap; word-break: break-word; color: #e8e8ea; user-select: text; }
  .preview-body .audio { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .preview-body .audio .ms { font-size: 90px; color: #ff6b9d; }
  .preview-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border: 0; border-radius: 50%; background: rgba(0,0,0,.55); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .preview-nav.prev { left: 10px; } .preview-nav.next { right: 10px; }
  .props { display: grid; grid-template-columns: 110px 1fr; gap: 8px 14px; font-size: 13px; }
  .props span:nth-child(odd) { color: var(--muted); }
  .props span:nth-child(even) { user-select: text; word-break: break-all; }

  @media (max-width: 720px) {
    .sidebar { width: 58px; flex-basis: 58px; padding: 10px 6px; }
    .side-item { justify-content: center; padding: 9px; }
    .side-item .txt, .side-item .badge, .side-label, .storage { display: none; }
    .search { width: 130px; }
    .list-head, .row { grid-template-columns: minmax(0,1fr) 80px; }
    .list-head .c-date, .list-head .c-type, .row .m-date, .row .m-type { display: none; }
    .ab .txt { display: none; }
  }
  * { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent; }

  /* ── HarmonyOS-style layout, in the mariowOS dark glass ── */
  .sidebar { width: 236px; flex-basis: 236px; padding: 12px 10px; gap: 1px; }
  .side-item { padding: 8px 10px; font-size: 13.5px; border-radius: 11px; position: relative; }
  .side-item.home-item { margin-bottom: 6px; padding: 10px; font-weight: 500; }
  .side-item.active { background: color-mix(in srgb, var(--accent) 22%, rgba(255,255,255,.04)); font-weight: 500; }
  .side-item .txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side-pin { width: 24px; height: 24px; flex: 0 0 24px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 6px; background: transparent; color: var(--dim); cursor: pointer; opacity: .65; transition: opacity .15s, background .15s; }
  .side-pin .ms { font-size: 15px; width: auto; color: inherit; font-variation-settings: 'FILL' 1; }
  .side-pin:hover { opacity: 1; background: var(--hover); color: #fff; }
  .side-tree-toggle { width: 18px; height: 18px; flex: 0 0 18px; display: flex; align-items: center; justify-content: center; margin-left: -4px; border: 0; background: transparent; color: var(--dim); cursor: pointer; transition: transform .25s var(--spring); }
  .side-tree-toggle .ms { font-size: 18px; width: auto; color: inherit; }
  .side-tree-toggle.open { transform: rotate(90deg); }
  .side-children { padding-left: 18px; display: flex; flex-direction: column; gap: 1px; }
  .side-children .side-item { padding: 6px 10px; font-size: 12.5px; }
  .side-section { display: flex; align-items: center; justify-content: space-between; width: 100%; margin-top: 8px; padding: 10px 10px 6px; border: 0; background: transparent; color: var(--dim); font-size: 12px; font-weight: 500; letter-spacing: 0; text-transform: none; cursor: pointer; }
  .side-section:hover { color: var(--muted); }
  .side-section .ms { font-size: 18px; transition: transform .3s var(--spring); }
  .side-section.collapsed .ms { transform: rotate(180deg); }
  /* The sidebar scrolls; its sections never squash to fit it. */
  .side-group { display: flex; flex-direction: column; gap: 1px; flex-shrink: 0; }
  .sidebar > * { flex-shrink: 0; }
  .side-group.collapsed { display: none; }
  .side-item.pinned { cursor: pointer; }
  .side-item.pin-dragging { opacity: .4; }
  .side-item.pin-before { box-shadow: inset 0 2px 0 var(--sys-accent-text); }
  .side-item.pin-after { box-shadow: inset 0 -2px 0 var(--sys-accent-text); }

  .topbar { gap: 6px; padding: 10px 12px 8px; border-bottom: 0; background: transparent; }
  .address { flex: 1; min-width: 0; height: 36px; display: flex; align-items: center; gap: 4px; padding: 0 4px 0 10px; border-radius: 11px; background: rgba(255,255,255,.06); border: 1px solid transparent; }
  .address:focus-within { border-color: var(--sys-accent-text); }
  .address-icon { display: flex; }
  .address-icon .icon-bg { width: 20px; height: 20px; flex: 0 0 20px; border-radius: 5px; display: flex; align-items: center; justify-content: center; }
  .address-icon .icon-bg .ms { font-size: 13px; color: #fff; }
  .address .crumbs { height: 34px; border: 0; background: transparent; padding: 0 2px; }
  .ib.small { width: 28px; height: 28px; flex-basis: 28px; }
  .ib.small .ms { font-size: 17px; }
  .search { width: 260px; height: 36px; border-radius: 11px; background: rgba(255,255,255,.06); border-color: transparent; }
  .actionbar { gap: 2px; padding: 4px 12px 8px; border-bottom: 1px solid var(--border); flex-wrap: nowrap; overflow: hidden; }
  .ab { height: 32px; padding: 0 8px; border-radius: 9px; color: rgba(255,255,255,.78); }
  .ab .caret { font-size: 18px; margin: 0 -4px 0 -4px; opacity: .7; }
  .ab.on { background: color-mix(in srgb, var(--accent) 20%, transparent); color: #fff; }
  .sep { margin: 0 6px; }

  .body-row { flex: 1; min-height: 0; display: flex; }
  .body-row .content { flex: 1; min-width: 0; }
  .pane { width: 0; flex: 0 0 auto; overflow: hidden; border-left: 1px solid transparent; transition: width .35s var(--spring), border-color .35s; }
  .pane.open { width: 260px; border-left-color: var(--border); }
  .pane-inner { width: 260px; height: 100%; overflow-y: auto; padding: 18px 16px; display: flex; flex-direction: column; gap: 12px; }
  .pane-thumb { height: 150px; border-radius: 14px; background: rgba(255,255,255,.04); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .pane-thumb img { width: 100%; height: 100%; object-fit: contain; }
  .pane-thumb .fchip { width: 72px; height: 72px; border-radius: 18px; }
  .pane-thumb .fchip .ms { font-size: 40px; }
  .pane-thumb .fchip.c-folder .ms { font-size: 96px; }
  .pane-name { font-size: 14px; font-weight: 600; word-break: break-word; user-select: text; }
  .pane-props { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 12px; }
  .pane-props span:nth-child(odd) { color: var(--muted); }
  .pane-props span:nth-child(even) { text-align: right; word-break: break-all; user-select: text; }
  .pane-empty { margin: auto; text-align: center; color: var(--dim); font-size: 12.5px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .pane-empty .ms { font-size: 40px; opacity: .5; }

  .status { justify-content: center; padding: 7px 14px; }

  /* Tabs: in the window title bar inside mariowOS; this strip is for the page on its own. */
  body.embedded .tabbar { display: none; }
  .tabbar { display: flex; align-items: center; gap: 4px; padding: 8px 10px 0; min-width: 0; }
  .tabs { display: flex; align-items: center; gap: 4px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }

let pinned = store.get('files-pinned', ['/home/Desktop', '/home/Documents', '/home/Downloads', '/home/Pictures', '/home/Music', '/home/Videos', TRASH]);

/* ───────────────────────── Helpers ───────────────────────── */
function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }

// What a folder looks like in the sidebar and on the Home page.

        '<span class="material-symbols-outlined action-btn close-btn" onclick="closePopup(\'popup10\')">close</span></div>';
    }
    doc.getElementById('explorer-os-styles')?.remove();
  } catch (e) {}
})();

/* ───────────────────────── Boot ───────────────────────── */
$('content').dataset.dropText = mariowOSI18n.t("explorer.drop-hint", "Drop files to upload them here");
const askedPath = new URLSearchParams(location.search).get('path');
const savedTabs = store.get('files-tabs', null);
const restored = Array.isArray(savedTabs?.paths) ? savedTabs.paths.filter(p => typeof p === 'string').slice(0, 12) : [];
tabs = (restored.length ? restored : [HOME_VIEW]).map(p => ({ id: nextTabId++, path: normalizePath(p), back: [], fwd: [] }));
activeTab = Math.min(Math.max(0, Number(savedTabs?.active) || 0), tabs.length - 1);
// Opened on a folder (from the desktop): that folder gets its own tab.
if (askedPath) { tabs.push({ id: nextTabId++, path: normalizePath(askedPath), back: [], fwd: [] }); activeTab = tabs.length - 1; }
renderSidebar();
renderTabs();
navigate(tabs[activeTab].path, { push: false });
setInterval(loadStorage, 60000);
</script>
</body>
</html>
