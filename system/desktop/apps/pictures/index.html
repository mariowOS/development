<!DOCTYPE html>
<html lang="en">
<head>
<script src="/desktop/assets/i18n-data.js"></script>
<script src="/desktop/assets/i18n.js"></script>
<script src="/desktop/assets/accent.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="pictures.title">Pictures</title>
<link href="/desktop/assets/fonts/fonts.css" rel="stylesheet">
<style>
  :root {
    --accent: var(--sys-accent);
    --text: #ffffff;
    --muted: rgba(255,255,255,.5);
    --dim: rgba(255,255,255,.35);
    --hover: rgba(255,255,255,.08);
    --border: rgba(255,255,255,.1);
    --sidebar: rgba(22,22,25,.65);
    --spring: cubic-bezier(0.16,1,0.3,1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100vh; overflow: hidden; }
  body { display: flex; font-family: 'Poppins', sans-serif; color: var(--text); background: transparent;
    -webkit-font-smoothing: antialiased; user-select: none; }
  button { font-family: inherit; color: inherit; }
  .material-symbols-outlined { font-variation-settings: 'wght' 400; }

  .sidebar { width: 220px; flex: 0 0 220px; display: flex; flex-direction: column; padding: 8px; background: var(--sidebar);
    border-right: 1px solid rgba(0,0,0,.35); box-shadow: inset -1px 0 0 rgba(255,255,255,.05); min-height: 0; }
  .sidebar-title { font-size: 20px; font-weight: 600; letter-spacing: -.4px; padding: 12px 8px 10px; }
  .sidebar-heading { padding: 12px 10px 4px; color: var(--dim); font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
  .sidebar-list { flex: 0 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  .sidebar-hint { padding: 6px 10px; color: var(--dim); font-size: 12px; line-height: 1.5; }
  .list-item { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; padding: 6px 8px; border-radius: 10px; font-size: 13px; cursor: pointer; min-width: 0; transition: background 180ms ease; }
  .list-item:hover:not(.active) { background: rgba(255,255,255,.1); }
  .list-item.active { background: var(--accent); color: var(--sys-accent-on); }
  .list-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .import { flex: 0 0 auto; margin-top: auto; padding: 10px; border: 1px dashed rgba(255,255,255,.16); border-radius: 12px; background: transparent; color: rgba(255,255,255,.75);
    font-size: 12.5px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: background .18s ease, color .18s ease; }
  .import:hover { background: var(--hover); color: #fff; }
  .import .material-symbols-outlined { font-size: 17px; }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .stage { flex: 1; min-height: 0; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }

  .bar { flex: 0 0 auto; display: flex; align-items: center; gap: 20px; padding: 12px 20px; background: rgba(18,18,21,.72); border-top: 1px solid rgba(255,255,255,.07); min-height: 72px; }
  .now { display: flex; align-items: center; gap: 12px; width: 230px; flex-shrink: 0; min-width: 0; }
  .now-art { width: 48px; height: 48px; flex: 0 0 48px; border-radius: 12px; background: linear-gradient(145deg, var(--art-a), var(--art-b)); background-size: cover; background-position: center;
    display: flex; align-items: center; justify-content: center; color: #fff; box-shadow: 0 6px 18px rgba(0,0,0,.45); }
  .now-art .material-symbols-outlined { font-size: 22px; }
  .now-art.has-image .material-symbols-outlined { display: none; }
  .now-text { min-width: 0; }
  .now-title { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now-sub { margin-top: 1px; color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .spacer { flex: 1; min-width: 0; }
  .ib { width: 36px; height: 36px; flex: 0 0 36px; border: 0; border-radius: 50%; background: transparent; color: var(--muted); cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center; transition: color .2s, background .2s, transform .15s ease; }
  .ib:hover:not(:disabled) { color: #fff; background: var(--hover); transform: scale(1.08); }
  .ib:active:not(:disabled) { transform: scale(.92); }
  .ib:disabled { opacity: .3; cursor: default; }
  .ib .material-symbols-outlined { font-size: 22px; }

  .empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--muted); text-align: center; padding: 24px; }
  .empty-icon { width: 72px; height: 72px; border-radius: 20px; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; color: #fff; background: linear-gradient(180deg, var(--art-a), var(--art-b)); box-shadow: 0 10px 28px rgba(0,0,0,.4); }
  .empty-icon .material-symbols-outlined { font-size: 38px; }
  .empty h2 { font-size: 19px; font-weight: 600; letter-spacing: -.3px; color: #fff; }
  .empty p { font-size: 13px; max-width: 340px; line-height: 1.5; }
  .open-btn { margin-top: 8px; display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; border: 0; border-radius: 999px; background: var(--accent); color: var(--sys-accent-on);
    font: 600 13px 'Poppins', sans-serif; cursor: pointer; transition: transform .15s ease, filter .15s ease; }
  .open-btn:hover { transform: scale(1.04); filter: brightness(1.08); }
  .open-btn .material-symbols-outlined { font-size: 18px; }

  .drophint { position: absolute; inset: 12px; border: 2px dashed var(--sys-accent-text); border-radius: 16px; display: none; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 600; color: var(--sys-accent-text); background: color-mix(in srgb, var(--sys-accent) 12%, transparent); z-index: 5; pointer-events: none; }
  body.dragging .drophint { display: flex; }
  @media (max-width: 720px) { .sidebar { display: none; } .now { width: auto; flex: 1; } .bar { gap: 8px; } }
  :root { --art-a: #32c8a0; --art-b: #28bd96; }
  .stage img { position: absolute; max-width: none; transform-origin: center center; border-radius: 6px; box-shadow: 0 14px 40px rgba(0,0,0,.45);
    transition: transform .12s var(--spring); -webkit-user-drag: none; }
  .stage.panning img { transition: none; cursor: grabbing; }
  .stage.zoomed img { cursor: grab; }
  .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border: 0; border-radius: 50%; background: rgba(18,18,21,.72); color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center; z-index: 3; box-shadow: 0 6px 18px rgba(0,0,0,.35); transition: background .15s, transform .15s ease; }
  .nav:hover { background: rgba(40,40,46,.85); transform: translateY(-50%) scale(1.08); }
  .nav.prev { left: 14px; } .nav.next { right: 14px; }
  .nav[hidden] { display: none; }
  .thumb { flex: 0 0 36px; width: 36px; height: 28px; border-radius: 6px; overflow: hidden; background: #000; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .zoom { display: flex; align-items: center; gap: 2px; padding: 2px; border-radius: 999px; background: rgba(255,255,255,.06); }
  .zoom .ib { width: 32px; height: 32px; flex-basis: 32px; }
  .zoom-label { min-width: 46px; text-align: center; font-size: 12px; color: rgba(255,255,255,.75); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-title" data-i18n="pictures.title">Pictures</div>
    <div class="sidebar-heading" data-i18n="pictures.opened">Opened</div>
    <div class="sidebar-list" id="filmstrip"></div>
    <div class="sidebar-hint" id="listHint" data-i18n="pictures.none-opened">Images you open appear here.</div>
    <button class="import" id="btnOpen" title="Open image(s)" data-i18n-title="pictures.open-images"><span class="material-symbols-outlined">add</span><span data-i18n="pictures.open-images">Open images</span></button>
  </aside>

  <div class="main">
    <div class="stage" id="stage">
      <button class="nav prev" id="navPrev" hidden><span class="material-symbols-outlined">chevron_left</span></button>
      <button class="nav next" id="navNext" hidden><span class="material-symbols-outlined">chevron_right</span></button>
      <div class="empty" id="empty">
        <div class="empty-icon"><span class="material-symbols-outlined">image</span></div>
        <h2 data-i18n="pictures.empty.title">No image open</h2>
        <p data-i18n="pictures.empty.text">Open a picture to view it, or drag an image anywhere into this window.</p>
        <button class="open-btn" id="emptyOpen"><span class="material-symbols-outlined">folder_open</span> <span data-i18n="pictures.empty.open">Open image</span></button>
      </div>
      <div class="drophint" data-i18n="pictures.drop">Drop to open</div>
    </div>

    <div class="bar">
      <div class="now">
        <div class="now-art" id="nowArt"><span class="material-symbols-outlined">image</span></div>
        <div class="now-text"><div class="now-title" id="title"></div><div class="now-sub" id="subtitle"></div></div>
      </div>
      <span class="spacer"></span>
      <div class="zoom">
        <button class="ib" id="btnZoomOut" title="Zoom out" data-i18n-title="pictures.zoom-out"><span class="material-symbols-outlined">remove</span></button>
        <span class="zoom-label" id="zoomLabel">100%</span>
        <button class="ib" id="btnZoomIn" title="Zoom in" data-i18n-title="pictures.zoom-in"><span class="material-symbols-outlined">add</span></button>
      </div>
      <button class="ib" id="btnFit" title="Fit to window" data-i18n-title="pictures.fit"><span class="material-symbols-outlined">fit_screen</span></button>
      <button class="ib" id="btnRotate" title="Rotate" data-i18n-title="pictures.rotate"><span class="material-symbols-outlined">rotate_right</span></button>
      <button class="ib" id="btnDownload" title="Download" data-i18n-title="pictures.download"><span class="material-symbols-outlined">download</span></button>
    </div>
  </div>

  <input type="file" id="fileInput" accept="image/*" multiple hidden>

<script>
  "use strict";
  const $ = id => document.getElementById(id);
  const stage = $('stage'), empty = $('empty'), filmstrip = $('filmstrip'), fileInput = $('fileInput');
  $('title').textContent = mariowOSI18n.t("pictures.empty.title", "No image open");
  let items = [];          // { url, name }
  let index = -1;
  let imgEl = null;
  let scale = 1, rotation = 0, fitScale = 1;
  let panX = 0, panY = 0;

  function revokeAll() { items.forEach(it => { try { URL.revokeObjectURL(it.url); } catch (e) {} }); }

  function loadFiles(fileList) {
    const files = [...fileList].filter(f => f.type.startsWith('image/'));
    if (!files.length) return;
    revokeAll();
    items = files.map(f => ({ url: URL.createObjectURL(f), name: f.name }));
    index = 0;
    buildFilmstrip();
    show(0);
  }

  function buildFilmstrip() {
    filmstrip.replaceChildren();
    $('listHint').hidden = items.length > 0;
    items.forEach((it, i) => {
      const row = document.createElement('div');
      row.className = 'list-item' + (i === index ? ' active' : '');
      const thumb = document.createElement('div'); thumb.className = 'thumb';
      const im = document.createElement('img'); im.src = it.url; im.alt = '';
      thumb.appendChild(im);
      const name = document.createElement('span'); name.className = 'list-name'; name.textContent = it.name;
      row.append(thumb, name);
      row.addEventListener('click', () => show(i));
      filmstrip.appendChild(row);
    });
  }

  function show(i) {
    if (i < 0 || i >= items.length) return;
    index = i;
    empty.style.display = 'none';
    if (imgEl) imgEl.remove();
    imgEl = document.createElement('img');
    imgEl.alt = '';
    imgEl.addEventListener('load', () => { fitToWindow(); });
    imgEl.src = items[i].url;
    stage.appendChild(imgEl);
    rotation = 0;
    const it = items[i];
    $('title').textContent = it.name;
    $('subtitle').textContent = items.length > 1 ? mariowOSI18n.t("pictures.position", "{current} of {total}", { current: i + 1, total: items.length }) : '';
    $('nowArt').style.backgroundImage = `url("${it.url.replace(/"/g, '%22')}")`;
    $('nowArt').classList.add('has-image');
    $('navPrev').hidden = items.length < 2;
    $('navNext').hidden = items.length < 2;
    [...filmstrip.children].forEach((t, ti) => t.classList.toggle('active', ti === index));
    updateButtons();
  }

  function fitToWindow() {
    if (!imgEl || !imgEl.naturalWidth) return;
    const rot = rotation % 180 !== 0;
    const w = rot ? imgEl.naturalHeight : imgEl.naturalWidth;
    const h = rot ? imgEl.naturalWidth : imgEl.naturalHeight;
    const aw = stage.clientWidth - 32, ah = stage.clientHeight - 32;
    fitScale = Math.min(aw / w, ah / h, 1) || 1;
    scale = fitScale;
    panX = 0; panY = 0;
    applyTransform();
  }

  function applyTransform() {
    if (!imgEl) return;
    imgEl.style.transform = `translate(${panX}px, ${panY}px) rotate(${rotation}deg) scale(${scale})`;
    $('zoomLabel').textContent = Math.round(scale / (fitScale || 1) * 100) + '%';
    stage.classList.toggle('zoomed', scale > fitScale + 0.001);
    updateButtons();
  }

  function updateButtons() {
    const has = index >= 0;
    ['btnZoomOut','btnZoomIn','btnFit','btnRotate','btnDownload'].forEach(id => { $(id).disabled = !has; });
  }

  function zoom(factor) {
    if (!imgEl) return;
    scale = Math.min(Math.max(scale * factor, fitScale * 0.5), fitScale * 8);
    applyTransform();
  }

  // Controls
  $('btnZoomIn').addEventListener('click', () => zoom(1.25));
  $('btnZoomOut').addEventListener('click', () => zoom(0.8));
  $('btnFit').addEventListener('click', fitToWindow);
  $('btnRotate').addEventListener('click', () => { rotation = (rotation + 90) % 360; fitToWindow(); });
  $('btnDownload').addEventListener('click', () => {
    if (index < 0) return;
    const a = document.createElement('a'); a.href = items[index].url; a.download = items[index].name; a.click();
  });
  $('btnOpen').addEventListener('click', () => fileInput.click());
  $('emptyOpen').addEventListener('click', () => fileInput.click());
  $('navPrev').addEventListener('click', () => show((index - 1 + items.length) % items.length));
  $('navNext').addEventListener('click', () => show((index + 1) % items.length));
  fileInput.addEventListener('change', e => { loadFiles(e.target.files); fileInput.value = ''; });

  // Wheel zoom
  stage.addEventListener('wheel', e => { if (!imgEl) return; e.preventDefault(); zoom(e.deltaY < 0 ? 1.1 : 0.9); }, { passive: false });

  // Pan when zoomed
  let dragging = false, sx = 0, sy = 0, spx = 0, spy = 0;
  stage.addEventListener('pointerdown', e => {
    if (!imgEl || scale <= fitScale + 0.001) return;
    dragging = true; sx = e.clientX; sy = e.clientY; spx = panX; spy = panY;
    stage.classList.add('panning'); stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointermove', e => {
    if (!dragging) return; panX = spx + (e.clientX - sx); panY = spy + (e.clientY - sy); applyTransform();
  });
  const endPan = () => { dragging = false; stage.classList.remove('panning'); };
  stage.addEventListener('pointerup', endPan);
  stage.addEventListener('pointercancel', endPan);

  // Keyboard
  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' && items.length > 1) show((index + 1) % items.length);
    else if (e.key === 'ArrowLeft' && items.length > 1) show((index - 1 + items.length) % items.length);
    else if (e.key === '+' || e.key === '=') zoom(1.25);
    else if (e.key === '-') zoom(0.8);
    else if (e.key === '0') fitToWindow();
  });

  // Drag & drop
  let dragDepth = 0;
  window.addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; document.body.classList.add('dragging'); });
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('dragleave', e => { e.preventDefault(); if (--dragDepth <= 0) document.body.classList.remove('dragging'); });
  window.addEventListener('drop', e => {
    e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging');
    if (e.dataTransfer && e.dataTransfer.files.length) loadFiles(e.dataTransfer.files);
  });

  window.addEventListener('resize', () => { if (imgEl) fitToWindow(); });
  window.addEventListener('beforeunload', revokeAll);
  updateButtons();

  // Open a file handed over by the desktop shell (from the Files app), loaded from the
  // backend via /api/system/files/raw (range-capable, correct MIME). Same-origin only.
  function loadFromBackend(path, name) {
    revokeAll();
    const url = `/api/system/files/raw?path=${encodeURIComponent(path)}&name=${encodeURIComponent(name)}`;
    items = [{ url, name }];
    index = 0;
    buildFilmstrip();
    show(0);
  }
  window.addEventListener('message', (e) => {
    if (e.origin !== location.origin) return;
    const d = e.data || {};
    if (d.type === 'open-file-in-picture' && typeof d.path === 'string' && typeof d.name === 'string') {
      loadFromBackend(d.path, d.name);
    }
  });
  // Tell the shell we're ready to receive a file (mirrors the Notes handshake).
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: 'picture-ready' }, location.origin);
  }
</script>
</body>
</html>
