

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Backup & Restore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"/>
  <style>
    body { font-family: 'Poppins', sans-serif; color: white; margin: 0; padding: 10px 0; background: transparent; overflow-x: hidden; overflow-y: auto; }
    .container { width: 100%; position: relative; padding: 0 10px; box-sizing: border-box; }
    .panel { background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; overflow: hidden; margin-bottom: 20px; }
    .list-item { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); cursor: pointer; transition: background 0.2s; }
    .list-item:hover { background: rgba(255, 255, 255, 0.1); }
    .list-item:last-child { border-bottom: none; }
    .item-left { display: flex; align-items: center; gap: 14px; }
    .icon-badge { display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 6px; color: white; flex-shrink: 0; }
    .icon-badge .material-symbols-outlined { font-size: 18px; }
    .item-title { font-size: 14px; font-weight: 500; }
    .item-subtitle { font-size: 12px; color: rgba(255, 255, 255, 0.5); margin-top: 2px; }
    .item-right { color: rgba(255, 255, 255, 0.3); display: flex; align-items: center; }
  </style>
</head>
<body>

<div class="container">
  <div class="panel">
    <div class="list-item" onclick="exportBackup()">
      <div class="item-left">
        <div class="icon-badge" style="background: linear-gradient(180deg, #32d74b, #28cd41);"><span class="material-symbols-outlined">download</span></div>
        <div>
          <div class="item-title">Export Settings</div>
          <div class="item-subtitle">Download your data as credentials.json</div>
        </div>
      </div>
      <div class="item-right"><span class="material-symbols-outlined">chevron_right</span></div>
    </div>

    <div class="list-item" onclick="document.getElementById('fileInput').click()">
      <div class="item-left">
        <div class="icon-badge" style="background: linear-gradient(180deg, #0a84ff, #007aff);"><span class="material-symbols-outlined">upload</span></div>
        <div>
          <div class="item-title">Import Settings</div>
          <div class="item-subtitle">Restore from a credentials.json file</div>
        </div>
      </div>
      <div class="item-right"><span class="material-symbols-outlined">chevron_right</span></div>
      <input type="file" id="fileInput" accept=".json" style="display:none" onchange="importBackup(event)">
    </div>
  </div>
</div>

<script>
function requirePassword(onSuccess, onCancel) {
  if (window.parent && window.parent.requirePassword) {
    window.parent.requirePassword(onSuccess, onCancel);
  } else {
    console.warn("Parent window password handler not found.");
  }
}

function exportBackup() {
  requirePassword(() => {
    fetch('/api/system/backup').then(r => r.blob()).then(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'credentials.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    });
  });
}

function importBackup(e) {
  const file = e.target.files[0];
  if (!file) return;
  requirePassword(() => {
    const fd = new FormData();
    fd.append('backupFile', file);
    fetch('/api/system/restore', { method: 'POST', body: fd })
      .then(r => r.json()).then(res => {
        if(res.success) {
          window.parent.postMessage({ type: 'show-notification', title: 'Backup Restored', msg: 'System config updated successfully.', icon: '☁️' }, '*');
        } else {
          alert("Error: " + res.error);
        }
      });
  }, () => {
    e.target.value = ''; 
  });
}
</script>
</body>
</html>
