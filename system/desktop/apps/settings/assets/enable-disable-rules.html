

<!DOCTYPE html>
<html lang="en">
<head>
<script src="/desktop/assets/i18n-data.js"></script>
<script src="/desktop/assets/i18n.js"></script>
<script src="/desktop/assets/accent.js"></script>
<script src="/desktop/assets/mariowos-dialogs.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enable/Disable Rules</title>

<link href="/desktop/assets/fonts/fonts.css" rel="stylesheet">

<style>
body {
  font-family: 'Poppins', sans-serif;
  color: #fff;
  margin: 0;
  padding: 40px;
  background: transparent;
  overflow-y: auto;
  display: flex;
  align-items: center;
  justify-content: center;
}

.container {
  max-width: 600px;
  width: 100%;
  position: relative;
  background: transparent;
}

.header {
  font-size: 22px;
  font-weight: 600;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.back-btn {
  font-size: 18px;
  color: rgba(255,255,255,0.5);
  cursor: pointer;
  transition: color 0.15s ease;
}

.back-btn:hover {
  color: #fff;
}

.banner {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  padding: 18px;
  margin-bottom: 15px;
}

.banner .title {
  font-size: 15px;
  font-weight: 500;
}

.banner .desc {
  font-size: 13px;
  color: rgba(255,255,255,0.5);
  margin-top: 4px;
}

.toggle-container {
  background: rgba(255,255,255,0.05);
  border-radius: 10px;
  padding: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.toggle-label {
  font-size: 16px;
  font-weight: 500;
}

.toggle-switch {
  position: relative;
  width: 44px;
  height: 24px;
  background: rgba(255,255,255,0.2);
  border-radius: 12px;
  cursor: pointer;
  transition: background 0.3s;
}

.toggle-switch.active {
  background: #34c759;
}

.toggle-slider {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 20px;
  height: 20px;
  background: #fff;
  border-radius: 50%;
  transition: transform 0.3s;
}

.toggle-switch.active .toggle-slider {
  transform: translateX(20px);
}

.btn {
  background: rgba(255,255,255,0.1);
  border: none;
  padding: 12px 20px;
  border-radius: 8px;
  color: #fff;
  cursor: pointer;
  font-family: 'Poppins', sans-serif;
  margin-top: 20px;
  width: 100%;
  transition: background 0.15s;
}

.btn:hover {
  background: rgba(255,255,255,0.2);
}

html::-webkit-scrollbar {
  display: none;
}
</style>
<link rel="stylesheet" href="/desktop/assets/fonts/fonts.css">
<link rel="stylesheet" href="settings-submenu.css">
</head>
<body>

<div class="container">
  <div class="settings-page-header">
    <button class="settings-page-back" type="button" aria-label="Back" data-i18n-aria-label="common.back" onclick="window.history.back()">
      <span class="material-symbols-outlined">arrow_back_ios_new</span>
    </button>
    <h1 data-i18n="settings.enable-disable-rules.title">Enable or Disable Rules</h1>
  </div>

  <div class="banner">
    <div class="title" data-i18n="settings.enable-disable-rules.banner">Control All Rules</div>
    <div class="desc" data-i18n="settings.enable-disable-rules.banner-desc">Temporarily enable or disable all automation rules.</div>
  </div>

  <div class="toggle-container">
    <div class="toggle-label">All Rules Enabled</div>
    <button class="toggle-switch active" id="rulesToggle" type="button" role="switch" aria-checked="true" aria-label="Enable all rules" data-i18n-aria-label="settings.enable-disable-rules.toggle">
      <span class="toggle-slider"></span>
    </button>
  </div>

  <button class="btn" id="saveBtn" data-i18n="settings.enable-disable-rules.save">Save Changes</button>
</div>

<script>
const rulesToggle = document.getElementById('rulesToggle');
const saveBtn = document.getElementById('saveBtn');
const label = rulesToggle.previousElementSibling;
label.textContent = mariowOSI18n.t('settings.enable-disable-rules.enabled', 'All Rules Enabled');

async function loadToggleState() {
  let allRulesEnabled = localStorage.getItem('allRulesEnabled') !== 'false';
  try {
    const response = await fetch('/api/rules/enabled');
    if (response.ok) allRulesEnabled = (await response.json()).enabled !== false;
  } catch (error) {}
  if (allRulesEnabled) {
    rulesToggle.classList.add('active');
    rulesToggle.setAttribute('aria-checked', 'true');
    label.textContent = mariowOSI18n.t('settings.enable-disable-rules.enabled', 'All Rules Enabled');
  } else {
    rulesToggle.classList.remove('active');
    rulesToggle.setAttribute('aria-checked', 'false');
    label.textContent = mariowOSI18n.t('settings.enable-disable-rules.disabled', 'All Rules Disabled');
  }
}

rulesToggle.addEventListener('click', () => {
  rulesToggle.classList.toggle('active');
  const enabled = rulesToggle.classList.contains('active');
  rulesToggle.setAttribute('aria-checked', String(enabled));
  label.textContent = enabled ? mariowOSI18n.t('settings.enable-disable-rules.enabled', 'All Rules Enabled') : mariowOSI18n.t('settings.enable-disable-rules.disabled', 'All Rules Disabled');
});

saveBtn.addEventListener('click', async () => {
  const allRulesEnabled = rulesToggle.classList.contains('active');
  try {
    const response = await fetch('/api/rules/enabled', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ enabled: allRulesEnabled })
    });
    if (!response.ok) throw new Error(mariowOSI18n.t('settings.enable-disable-rules.update-failed', 'Could not update rule execution.'));
  } catch (error) {
    await mDialog.alert(error.message || mariowOSI18n.t('settings.enable-disable-rules.update-failed', 'Could not update rule execution.'));
    return;
  }

  localStorage.setItem('allRulesEnabled', allRulesEnabled);

  // Add to history
  let history = JSON.parse(localStorage.getItem('ruleHistory')) || [];
  history.push({
    id: Date.now(),
    ruleName: 'All Rules',
    action: allRulesEnabled ? 'Enabled' : 'Disabled',
    timestamp: new Date().toISOString()
  });
  localStorage.setItem('ruleHistory', JSON.stringify(history));

  await mDialog.alert(mariowOSI18n.t('settings.enable-disable-rules.saved', 'Changes saved!'));
});

// Load state on page load
loadToggleState();
</script>

</body>
</html>
