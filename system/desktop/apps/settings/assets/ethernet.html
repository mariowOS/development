<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"/>
  <style>
    body { font-family: 'Poppins', sans-serif; color: white; margin: 0; padding: 0; overflow-y: auto; }
    .panel { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; margin-bottom: 20px; overflow: hidden; }
    .row { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .row:last-child { border-bottom: none; }
    .left { display: flex; align-items: center; gap: 12px; }
    .title { font-size: 14px; font-weight: 500; }
    .subtitle { font-size: 12px; color: rgba(255,255,255,0.5); }
    .badge { background: rgba(52, 199, 89, 0.2); color: #34c759; padding: 4px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="panel" id="ethPanel">
    <div class="row"><div class="subtitle">Checking physical connections...</div></div>
  </div>

  <script>
    async function loadEth() {
      const res = await fetch('/api/system/ethernet-stats');
      const data = await res.json();
      
      let html = '';
      let realEth = [];

      if(data.interfaces && data.interfaces.length > 0) {
        const invalidKeywords = ['vethernet', 'wsl', 'hyper-v', 'virtual', 'vmware', 'vbox', 'tailscale', 'zerotier', 'vpn', 'bluetooth'];
        realEth = data.interfaces.filter(eth => {
          const lowerName = eth.name.toLowerCase();
          return !invalidKeywords.some(keyword => lowerName.includes(keyword));
        });
      }

      if(realEth.length > 0) {
        realEth.forEach(eth => {
          html += `
            <div class="row">
              <div class="left">
                <span class="material-symbols-outlined">settings_ethernet</span>
                <div>
                  <div class="title">${eth.name}</div>
                  <div class="subtitle">IP: ${eth.ip}</div>
                </div>
              </div>
              <div class="badge">${eth.status}</div>
            </div>
          `;
        });
      } else {
        html = `
          <div class="row">
            <div class="left">
              <span class="material-symbols-outlined" style="opacity:0.5">cable</span>
              <div class="title" style="opacity:0.5">Cable Unplugged</div>
            </div>
          </div>
        `;
      }
      document.getElementById('ethPanel').innerHTML = html;
    }
    loadEth();
  </script>
</body>
</html>
