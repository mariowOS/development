

<!DOCTYPE html>
<html lang="en">
<head>
<script src="/desktop/assets/mariowos-dialogs.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Rules</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Poppins', sans-serif;
  color: #fff;
  margin: 0;
  padding: 40px;
  background: transparent;
  overflow-y: auto;
  display: flex;
  align-items: center;
  justify-content: center;
}

.container {
  max-width: 600px;
  width: 100%;
  position: relative;
  background: transparent;
}

.header {
  font-size: 22px;
  font-weight: 600;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.back-btn {
  font-size: 18px;
  color: rgba(255,255,255,0.5);
  cursor: pointer;
  transition: color 0.15s ease;
}

.back-btn:hover {
  color: #fff;
}

.banner {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  padding: 18px;
  margin-bottom: 15px;
}

.banner .title {
  font-size: 15px;
  font-weight: 500;
}

.banner .desc {
  font-size: 13px;
  color: rgba(255,255,255,0.5);
  margin-top: 4px;
}

.rule-item {
  background: rgba(255,255,255,0.05);
  border-radius: 10px;
  padding: 14px 18px;
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.rule-title {
  font-size: 16px;
  font-weight: 500;
}

.rule-desc {
  font-size: 13px;
  color: rgba(255,255,255,0.5);
  margin-top: 3px;
}

.rule-actions {
  display: flex;
  gap: 10px;
}

.btn {
  background: rgba(255,255,255,0.1);
  border: none;
  padding: 8px 12px;
  border-radius: 8px;
  color: #fff;
  cursor: pointer;
  font-family: 'Poppins', sans-serif;
  font-size: 12px;
  transition: background 0.15s;
}

.btn:hover {
  background: rgba(255,255,255,0.2);
}

.btn.edit {
  background: #0a84ff;
}

.btn.delete {
  background: #ff453a;
}

html::-webkit-scrollbar {
  display: none;
}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
<link rel="stylesheet" href="settings-submenu.css">
</head>
<body>

<div class="container">
  <div class="settings-page-header">
    <button class="settings-page-back" type="button" aria-label="Back" onclick="window.history.back()">
      <span class="material-symbols-outlined">arrow_back_ios_new</span>
    </button>
    <h1>Manage Rules</h1>
  </div>

  <div class="banner">
    <div class="title">Manage Existing Rules</div>
    <div class="desc">
      View, edit, or delete your automation rules.
    </div>
  </div>

  <div class="panel" id="rulesContainer">
    <!-- Rules will be loaded here -->
  </div>
</div>

<script>
const rulesContainer = document.getElementById('rulesContainer');

async function loadRules() {
  let rules = JSON.parse(localStorage.getItem('rules')) || [];
  try {
    const response = await fetch('/api/rules');
    if (response.ok) {
      const serverRules = await response.json();
      const knownIds = new Set(serverRules.map(rule => String(rule.id)));
      rules = [...serverRules, ...rules.filter(rule => !knownIds.has(String(rule.id)))];
    }
  } catch (error) {}
  rulesContainer.innerHTML = '';

  if (rules.length === 0) {
    rulesContainer.innerHTML = '<p class="empty-state">No rules found. Create a new rule first.</p>';
    return;
  }

  rules.forEach(rule => {
    const ruleItem = document.createElement('div');
    ruleItem.className = 'rule-item';
    ruleItem.innerHTML = `
      <div class="text-group">
        <div class="rule-title">${rule.name}</div>
        <div class="rule-desc">${describeRule(rule)}</div>
      </div>
      <div class="rule-actions">
        <button class="btn edit" data-id="${rule.id}">Edit</button>
        <button class="btn delete" data-id="${rule.id}">Delete</button>
      </div>
    `;
    rulesContainer.appendChild(ruleItem);
  });

  // Add event listeners for edit and delete buttons
  document.querySelectorAll('.btn.edit').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const ruleId = parseInt(e.target.dataset.id);
      editRule(ruleId);
    });
  });

  document.querySelectorAll('.btn.delete').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const ruleId = parseInt(e.target.dataset.id);
      deleteRule(ruleId);
    });
  });
}

function describeRule(rule) {
  if (rule.trigger === 'time') return `Daily at ${rule.triggerValue || 'unscheduled'} · ${rule.action}`;
  if (rule.trigger === 'battery') return `Battery at or below ${rule.triggerValue}% · ${rule.action}`;
  if (rule.trigger === 'startup') return `At desktop startup · ${rule.actionParams?.appId || 'app not selected'}`;
  return `Trigger: ${rule.trigger} | Action: ${rule.action}`;
}

function editRule(ruleId) {
  const rules = JSON.parse(localStorage.getItem('rules')) || [];
  const rule = rules.find(r => r.id === ruleId);
  if (rule) {
    // For simplicity, redirect to new-rule.html with query params (in a real app, you'd have an edit page)
    window.location.href = `new-rule.html?edit=${ruleId}`;
  }
}

async function deleteRule(ruleId) {
  if (await mDialog.confirm('Are you sure you want to delete this rule?', { danger: true, okText: 'Delete' })) {
    const localRules = JSON.parse(localStorage.getItem('rules')) || [];
    const ruleName = localRules.find(r => r.id === ruleId)?.name || 'Unknown';
    try {
      const response = await fetch('/api/rules');
      if (response.ok) {
        const serverRules = await response.json();
        const saveResponse = await fetch('/api/rules/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ rules: serverRules.filter(rule => Number(rule.id) !== ruleId) })
        });
        if (!saveResponse.ok) throw new Error('Could not delete the saved rule.');
      }
    } catch (error) {
      await mDialog.alert(error.message || 'Could not delete the saved rule.');
      return;
    }
    localStorage.setItem('rules', JSON.stringify(localRules.filter(rule => Number(rule.id) !== ruleId)));

    // Add to history
    let history = JSON.parse(localStorage.getItem('ruleHistory')) || [];
    history.push({
      id: Date.now(),
      ruleName: ruleName,
      action: 'Deleted',
      timestamp: new Date().toISOString()
    });
    localStorage.setItem('ruleHistory', JSON.stringify(history));

    loadRules();
  }
}

// Load rules on page load
loadRules();
</script>

</body>
</html>
