

<!DOCTYPE html>
<html lang="en">
<head>
<script src="/desktop/assets/i18n-data.js"></script>
<script src="/desktop/assets/i18n.js"></script>
<script src="/desktop/assets/accent.js"></script>
<script src="/desktop/assets/mariowos-dialogs.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Rules</title>

<link href="/desktop/assets/fonts/fonts.css" rel="stylesheet">

<style>
body {
  font-family: 'Poppins', sans-serif;
  color: #fff;
  margin: 0;
  padding: 40px;
  background: transparent;
  overflow-y: auto;
  display: flex;
  align-items: center;
  justify-content: center;
}

.container {
  max-width: 600px;
  width: 100%;
  position: relative;
  background: transparent;
}

.header {
  font-size: 22px;
  font-weight: 600;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.back-btn {
  font-size: 18px;
  color: rgba(255,255,255,0.5);
  cursor: pointer;
  transition: color 0.15s ease;
}

.back-btn:hover {
  color: #fff;
}

.banner {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  padding: 18px;
  margin-bottom: 15px;
}

.banner .title {
  font-size: 15px;
  font-weight: 500;
}

.banner .desc {
  font-size: 13px;
  color: rgba(255,255,255,0.5);
  margin-top: 4px;
}

.rule-item {
  background: rgba(255,255,255,0.05);
  border-radius: 10px;
  padding: 14px 18px;
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.rule-title {
  font-size: 16px;
  font-weight: 500;
}

.rule-desc {
  font-size: 13px;
  color: rgba(255,255,255,0.5);
  margin-top: 3px;
}

.rule-actions {
  display: flex;
  gap: 10px;
}

.btn {
  background: rgba(255,255,255,0.1);
  border: none;
  padding: 8px 12px;
  border-radius: 8px;
  color: #fff;
  cursor: pointer;
  font-family: 'Poppins', sans-serif;
  font-size: 12px;
  transition: background 0.15s;
}

.btn:hover {
  background: rgba(255,255,255,0.2);
}

.btn.edit {
  background: var(--sys-accent);
  color: var(--sys-accent-on);
}

.btn.delete {
  background: #ff453a;
}

html::-webkit-scrollbar {
  display: none;
}
</style>
<link rel="stylesheet" href="/desktop/assets/fonts/fonts.css">
<link rel="stylesheet" href="settings-submenu.css">
</head>
<body>

<div class="container">
  <div class="settings-page-header">
    <button class="settings-page-back" type="button" aria-label="Back" data-i18n-aria-label="common.back" onclick="window.history.back()">
      <span class="material-symbols-outlined">arrow_back_ios_new</span>
    </button>
    <h1 data-i18n="settings.manage-rules.title">Manage Rules</h1>
  </div>

  <div class="banner">
    <div class="title" data-i18n="settings.manage-rules.banner">Manage Existing Rules</div>
    <div class="desc" data-i18n="settings.manage-rules.banner-desc">View, edit, or delete your automation rules.</div>
  </div>

  <div class="panel" id="rulesContainer">
    <!-- Rules will be loaded here -->
  </div>
</div>

<script>
const rulesContainer = document.getElementById('rulesContainer');

async function loadRules() {
  let rules = JSON.parse(localStorage.getItem('rules')) || [];
  try {
    const response = await fetch('/api/rules');
    if (response.ok) {
      const serverRules = await response.json();
      const knownIds = new Set(serverRules.map(rule => String(rule.id)));
      rules = [...serverRules, ...rules.filter(rule => !knownIds.has(String(rule.id)))];
    }
  } catch (error) {}
  rulesContainer.innerHTML = '';

  if (rules.length === 0) {
    rulesContainer.innerHTML = '<p class="empty-state" data-i18n="settings.manage-rules.empty">No rules found. Create a new rule first.</p>';
    return;
  }

  rules.forEach(rule => {
    const ruleItem = document.createElement('div');
    ruleItem.className = 'rule-item';
    ruleItem.innerHTML = `
      <div class="text-group">
        <div class="rule-title">${rule.name}</div>
        <div class="rule-desc">${describeRule(rule)}</div>
      </div>
      <div class="rule-actions">
        <button class="btn edit" data-id="${rule.id}" data-i18n="common.edit">Edit</button>
        <button class="btn delete" data-id="${rule.id}" data-i18n="common.delete">Delete</button>
      </div>
    `;
    rulesContainer.appendChild(ruleItem);
  });

  // Add event listeners for edit and delete buttons
  document.querySelectorAll('.btn.edit').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const ruleId = parseInt(e.target.dataset.id);
      editRule(ruleId);
    });
  });

  document.querySelectorAll('.btn.delete').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const ruleId = parseInt(e.target.dataset.id);
      deleteRule(ruleId);
    });
  });
}

function describeRule(rule) {
  if (rule.trigger === 'time') return mariowOSI18n.t('settings.manage-rules.desc-time', 'Daily at {time} · {action}', { time: rule.triggerValue || mariowOSI18n.t('settings.manage-rules.unscheduled', 'unscheduled'), action: rule.action });
  if (rule.trigger === 'battery') return mariowOSI18n.t('settings.manage-rules.desc-battery', 'Battery at or below {level}% · {action}', { level: rule.triggerValue, action: rule.action });
  if (rule.trigger === 'startup') return mariowOSI18n.t('settings.manage-rules.desc-startup', 'At desktop startup · {app}', { app: rule.actionParams?.appId || mariowOSI18n.t('settings.manage-rules.no-app', 'app not selected') });
  return mariowOSI18n.t('settings.manage-rules.desc-other', 'Trigger: {trigger} | Action: {action}', { trigger: rule.trigger, action: rule.action });
}

function editRule(ruleId) {
  const rules = JSON.parse(localStorage.getItem('rules')) || [];
  const rule = rules.find(r => r.id === ruleId);
  if (rule) {
    // For simplicity, redirect to new-rule.html with query params (in a real app, you'd have an edit page)
    window.location.href = `new-rule.html?edit=${ruleId}`;
  }
}

async function deleteRule(ruleId) {
  if (await mDialog.confirm(mariowOSI18n.t('settings.manage-rules.delete-confirm', 'Are you sure you want to delete this rule?'), { danger: true, okText: mariowOSI18n.t('common.delete', 'Delete') })) {
    const localRules = JSON.parse(localStorage.getItem('rules')) || [];
    const ruleName = localRules.find(r => r.id === ruleId)?.name || mariowOSI18n.t('settings.manage-rules.unknown', 'Unknown');
    try {
      const response = await fetch('/api/rules');
      if (response.ok) {
        const serverRules = await response.json();
        const saveResponse = await fetch('/api/rules/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ rules: serverRules.filter(rule => Number(rule.id) !== ruleId) })
        });
        if (!saveResponse.ok) throw new Error(mariowOSI18n.t('settings.manage-rules.delete-failed', 'Could not delete the saved rule.'));
      }
    } catch (error) {
      await mDialog.alert(error.message || mariowOSI18n.t('settings.manage-rules.delete-failed', 'Could not delete the saved rule.'));
      return;
    }
    localStorage.setItem('rules', JSON.stringify(localRules.filter(rule => Number(rule.id) !== ruleId)));

    // Add to history
    let history = JSON.parse(localStorage.getItem('ruleHistory')) || [];
    history.push({
      id: Date.now(),
      ruleName: ruleName,
      action: 'Deleted',
      timestamp: new Date().toISOString()
    });
    localStorage.setItem('ruleHistory', JSON.stringify(history));

    loadRules();
  }
}

// Load rules on page load
loadRules();
</script>

</body>
</html>
