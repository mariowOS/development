<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Desktop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"/>

<style>
:root {
  --md-sys-color-background: #141218;
  --md-sys-color-surface-container: #2b2930;
  --md-sys-color-surface-container-high: #36343b;
  --md-sys-color-secondary-container: #4a4458;
  --md-sys-color-on-secondary-container: #e8def8;
  --md-sys-color-on-surface: #e6e0e9;
  --md-sys-color-on-surface-variant: #cac4d0;
  --md-sys-color-error: #ffb4ab;
  --md-sys-color-error-container: #93000a;
  --md-sys-color-on-error-container: #ffdad6;
}

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: transparent;
  color: var(--md-sys-color-on-surface);
  overflow-y: auto;
  padding: 32px 20px;
  display: flex;
  justify-content: center;
}   

.container {
  max-width: 560px;
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.warning-banner {
  background: var(--md-sys-color-error-container);
  color: var(--md-sys-color-on-error-container);
  border-radius: 24px;
  padding: 20px 24px;
}

.warning-banner h3 {
  margin: 0 0 8px 0;
  font-size: 18px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 10px;
}

.warning-banner p {
  margin: 0;
  font-size: 13px;
  line-height: 1.6;
  opacity: 0.9;
}

.checkbox-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 20px;
  background: var(--md-sys-color-surface-container);
  border-radius: 20px;
}

.checkbox-card input[type="checkbox"] {
  width: 20px;
  height: 20px;
  accent-color: var(--md-sys-color-error);
  cursor: pointer;
}

.checkbox-card label {
  margin: 0;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  color: var(--md-sys-color-on-surface);
}

.button-row {
  display: flex;
  gap: 12px;
  margin-top: 8px;
}

button {
  flex: 1;
  padding: 14px 20px;
  border: none;
  border-radius: 28px;
  font-family: 'Poppins', sans-serif;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.1s;
}

button:hover {
  opacity: 0.9;
}

button:active {
  transform: scale(0.98);
}

button.btn-secondary {
  background: var(--md-sys-color-secondary-container);
  color: var(--md-sys-color-on-secondary-container);
}

button.btn-danger {
  background: var(--md-sys-color-error-container);
  color: var(--md-sys-color-on-error-container);
}

html::-webkit-scrollbar {
  display: none;
}
</style>
<link rel="stylesheet" href="/desktop/assets/material-you.css">
<script src="/desktop/assets/monet-engine.js"></script>
</head>
<body>

<div class="container">
  <div class="warning-banner">
    <h3>
      <span class="material-symbols-outlined">warning</span>
      Warning
    </h3>
    <p>You're about to reset your desktop. It will restore the <strong>desktop to its original state</strong>. This will <strong>NOT</strong> affect your personal data.</p>
  </div>

  <div class="checkbox-card">
    <input type="checkbox" id="resetBackground" disabled checked>
    <label for="resetBackground">Reset desktop to default</label>
  </div>

  <div class="button-row">
    <button class="btn-secondary" onclick="goBack()">Cancel</button>
    <button class="btn-danger" id="resetBtn">Reset Desktop</button>
  </div>
</div>

<script>
function goBack() {
  window.history.back();
}

window.addEventListener("DOMContentLoaded", () => {
    const btn = document.getElementById("resetBtn");
    if (!btn) return;

    btn.addEventListener("click", () => {
        const wallpaperPath = "../../../assets/wallpaper.factory.png";
        localStorage.setItem("wallpaper", wallpaperPath);

        const desktop = window.opener || window.parent;
        if (desktop && desktop.document.body) {
            desktop.document.body.style.backgroundImage = `url('${wallpaperPath}')`;
        }

        location.reload();
    });
});
</script>
</body>
</html>
