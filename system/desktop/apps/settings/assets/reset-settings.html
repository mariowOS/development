

<!DOCTYPE html>
<html lang="en">
<head>
<script src="/desktop/assets/i18n-data.js"></script>
<script src="/desktop/assets/i18n.js"></script>
<script src="/desktop/assets/accent.js"></script>
<script src="/desktop/assets/mariowos-dialogs.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Settings</title>
<link href="/desktop/assets/fonts/fonts.css" rel="stylesheet">
<link rel="stylesheet" href="/desktop/assets/fonts/fonts.css"/>

<style>
:root {
  --md-sys-color-background: transparent;
  --md-sys-color-surface-container: rgba(255,255,255,0.06);
  --md-sys-color-surface-container-high: rgba(255,255,255,0.1);
  --md-sys-color-secondary-container: color-mix(in srgb, var(--sys-accent) 18%, transparent);
  --md-sys-color-on-secondary-container: #ffffff;
  --md-sys-color-on-surface: #ffffff;
  --md-sys-color-on-surface-variant: rgba(255,255,255,0.5);
  --md-sys-color-error: #ff453a;
  --md-sys-color-error-container: rgba(255,69,58,0.18);
  --md-sys-color-on-error-container: #ff453a;
}

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: transparent;
  color: var(--md-sys-color-on-surface);
  overflow-y: auto;
  padding: 32px 20px;
  display: flex;
  justify-content: center;
}   

.container {
  max-width: 560px;
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.warning-banner {
  background: var(--md-sys-color-error-container);
  color: var(--md-sys-color-on-error-container);
  border-radius: 10px;
  border: 1px solid rgba(255,69,58,0.4);
  padding: 20px 24px;
}

.warning-banner h3 {
  margin: 0 0 8px 0;
  font-size: 18px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 10px;
}

.warning-banner p {
  margin: 0;
  font-size: 13px;
  line-height: 1.6;
  color: rgba(255,255,255,0.7);
}

.checkbox-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 20px;
  background: var(--md-sys-color-surface-container);
  border-radius: 10px;
}

.checkbox-card input[type="checkbox"] {
  width: 20px;
  height: 20px;
  accent-color: var(--md-sys-color-error);
  cursor: pointer;
}

.checkbox-card label {
  margin: 0;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  color: var(--md-sys-color-on-surface);
}

.button-row {
  display: flex;
  gap: 12px;
  margin-top: 8px;
}

button {
  flex: 1;
  padding: 9px 16px;
  border: none;
  border-radius: 8px;
  font-family: 'Poppins', sans-serif;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.1s;
}

button:hover {
  opacity: 0.9;
}

button:active {
  transform: scale(0.98);
}

button.btn-secondary {
  background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1);
  color: #fff;
}

button.btn-danger {
  background: #ff453a;
  color: #fff;
}

html::-webkit-scrollbar {
  display: none;
}
</style>
</head>
<body>

<div class="container">
  <div class="warning-banner">
    <h3>
      <span class="material-symbols-outlined">warning</span>
      <span data-i18n="settings.reset-settings.warning">Warning</span>
    </h3>
    <p><span data-i18n="settings.reset-settings.intro-1">This will reset your</span> <strong data-i18n="settings.reset-settings.intro-2">account email, its verification and the daily report preference</strong><span data-i18n="settings.reset-settings.intro-3">, plus local preferences (lock screen, Lab, time). Your password, files, apps and wallpaper are</span> <strong data-i18n="settings.reset-settings.intro-4">NOT</strong> <span data-i18n="settings.reset-settings.intro-5">affected.</span></p>
  </div>

  <div class="button-row">
    <button class="btn-secondary" onclick="goBack()" data-i18n="common.cancel">Cancel</button>
    <button class="btn-danger" id="resetBtn" data-i18n="settings.reset-settings.reset">Reset Settings</button>
  </div>
</div>

<script>
function goBack() {
  window.history.back();
}

function withPassword(cb, onCancel) {
  // The settings shell shows the auth dialog and hands back the verified password.
  if (window.parent && window.parent !== window && typeof window.parent.requirePassword === "function") {
    window.parent.requirePassword(cb, onCancel);
  } else {
    cb(""); // no shell gate available (e.g. no password set): backend decides
  }
}

async function doResetSettings(password) {
  const res = await fetch("/api/system/reset-settings", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ password: password || "" })
  });
  const data = await res.json();
  if (!data.success) throw new Error(data.error || mariowOSI18n.t("settings.reset-settings.unknown-error", "Unknown error"));
  ["clockFont", "clockWeight", "liveWallpaper", "lab-darkMode", "lab-performance", "lab-animations", "lab-developer", "lab-allowFlashing", "systemTimeOffset", "manualTimeEnabled", "timezoneOffset"].forEach(k => {
    try { localStorage.removeItem(k); } catch (e) {}
  });
  await mDialog.alert(mariowOSI18n.t("settings.reset-settings.done", "Settings restored to default."));
  if (window.top !== window) window.top.location.reload();
  else goBack();
}

document.getElementById("resetBtn").addEventListener("click", () => {
  const btn = document.getElementById("resetBtn");
  btn.disabled = true;
  withPassword(async (password) => {
    try {
      await doResetSettings(password);
    } catch (e) {
      await mDialog.alert(mariowOSI18n.t("settings.reset-settings.failed", "Reset failed: {error}", { error: e.message }));
      btn.disabled = false;
    }
  }, () => { btn.disabled = false; });
});
</script>
</body>
</html>
