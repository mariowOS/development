

<!DOCTYPE html>
<html lang="en">
<head>
<script src="/desktop/assets/i18n-data.js"></script>
<script src="/desktop/assets/i18n.js"></script>
<script src="/desktop/assets/accent.js"></script>
<script src="/desktop/assets/mariowos-dialogs.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Settings</title>
  
  <link href="/desktop/assets/fonts/fonts.css" rel="stylesheet">
  <link rel="stylesheet" href="/desktop/assets/fonts/fonts.css"/>

  <style>
    body { 
      font-family: 'Poppins', sans-serif; 
      color: white; 
      margin: 0; 
      padding: 10px 0 40px 0; 
      background: transparent; 
      overflow-x: hidden;
      overflow-y: auto; 
    }

    .container {
      width: 100%;
      padding: 0 10px;
      box-sizing: border-box;
    }

    /* macOS Panel Groups - Full Width Edge-to-Edge Style */
    .panel { 
      background: rgba(255, 255, 255, 0.06); 
      border: 1px solid rgba(255, 255, 255, 0.1); 
      border-radius: 10px; 
      overflow: hidden;
      margin-bottom: 20px;
    }

    .list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      cursor: pointer;
      transition: background 0.2s;
    }
    .list-item:hover { background: rgba(255, 255, 255, 0.1); }
    .list-item:last-child { border-bottom: none; }

    .item-left { display: flex; align-items: center; gap: 14px; }
    
    .icon-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      color: white;
      flex-shrink: 0;
    }
    .icon-badge .material-symbols-outlined { font-size: 18px; }

    /* Colors */
    .bg-gray { background: linear-gradient(180deg, #8e8e93, #636366); }
    .bg-danger { background: linear-gradient(180deg, #ff3b30, #ff453a); }

    .item-title { font-size: 14px; font-weight: 500; }
    .item-subtitle { font-size: 12px; color: rgba(255, 255, 255, 0.5); margin-top: 2px; }
    
    .danger-text .item-title { color: #ff453a; }

    .item-right { color: rgba(255, 255, 255, 0.3); display: flex; align-items: center; }

    /* Expandable Edit Area */
    .edit-panel {
      display: none;
      flex-direction: column;
      gap: 12px;
      padding: 16px;
      background: rgba(0, 0, 0, 0.15);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .edit-panel input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 14px; 
      border-radius: 8px; 
      border: 1px solid rgba(255, 255, 255, 0.1); 
      background: rgba(0, 0, 0, 0.25); 
      color: white; 
      font-family: inherit; 
      font-size: 13px; 
      outline: none; 
      transition: border-color 0.2s;
    }
    
    .edit-panel input:focus { border-color: var(--sys-accent-text); }

    .btn-row {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-top: 4px;
    }

    .btn { 
      padding: 8px 16px; 
      border-radius: 6px; 
      border: none; 
      background: var(--sys-accent); 
      color: var(--sys-accent-on); 
      font-weight: 500; 
      font-size: 13px;
      cursor: pointer; 
      font-family: inherit; 
      transition: background 0.2s; 
    }
    .btn:hover { background: color-mix(in srgb, var(--sys-accent) 85%, black); color: var(--sys-accent-on); }

    html::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>

<div class="container">
  
  <div class="panel">
    <!-- Change Password -->
    <div class="list-item" onclick="toggleDropdown('pwdDrop')">
      <div class="item-left">
        <div class="icon-badge bg-gray"><span class="material-symbols-outlined">password</span></div>
        <div>
          <div class="item-title" data-i18n="settings.security.password">Set or Change Password</div>
          <div class="item-subtitle" data-i18n="settings.security.password-desc">Update your login credentials</div>
        </div>
      </div>
      <div class="item-right"><span class="material-symbols-outlined" id="pwdIcon">expand_more</span></div>
    </div>
    
    <!-- Hidden Form -->
    <div class="edit-panel" id="pwdDrop">
      <input type="text" id="secUser" placeholder="Username" data-i18n-placeholder="settings.security.username">
      <input type="password" id="secCurrent" placeholder="Current Password (leave empty if none)" data-i18n-placeholder="settings.security.current-password">
      <input type="password" id="secPass" placeholder="New Password" data-i18n-placeholder="settings.security.new-password">
      <div class="btn-row">
        <button class="btn" onclick="savePassword()" data-i18n="settings.security.update">Update Security Info</button>
      </div>
    </div>

    <!-- Clear Password -->
    <div class="list-item" onclick="removePassword()">
      <div class="item-left">
        <div class="icon-badge bg-gray"><span class="material-symbols-outlined">lock_open</span></div>
        <div>
          <div class="item-title" data-i18n="settings.security.clear">Clear Password</div>
          <div class="item-subtitle" data-i18n="settings.security.clear-desc">Allow logging in without a password</div>
        </div>
      </div>
      <div class="item-right"></div>
    </div>
  </div>

  <div class="panel">
    <!-- Reset Desktop -->
    <div class="list-item danger-text" onclick="resetDesktop()">
      <div class="item-left">
        <div class="icon-badge bg-danger"><span class="material-symbols-outlined">wallpaper</span></div>
        <div>
          <div class="item-title" data-i18n="settings.security.reset-desktop">Reset Desktop Layout</div>
          <div class="item-subtitle" data-i18n="settings.security.reset-desktop-desc">Clears active wallpaper and avatar</div>
        </div>
      </div>
      <div class="item-right"></div>
    </div>
    
    <!-- Factory Reset -->
    <div class="list-item danger-text" onclick="factoryReset()">
      <div class="item-left">
        <div class="icon-badge bg-danger"><span class="material-symbols-outlined">warning</span></div>
        <div>
          <div class="item-title" data-i18n="settings.security.factory">Factory Reset System</div>
          <div class="item-subtitle" data-i18n="settings.security.factory-desc">Erase network configs and user data</div>
        </div>
      </div>
      <div class="item-right"></div>
    </div>
  </div>

</div>

<script src="factory-reset.js"></script>
<script>
  async function loadUserData() {
    try {
      const res = await fetch('/get-settings');
      const data = await res.json();
      if (data.username) {
        document.getElementById('secUser').value = data.username;
      }
    } catch (e) {}
  }

  function toggleDropdown(id) {
    const el = document.getElementById(id);
    const icon = document.getElementById('pwdIcon');
    
    if (el.style.display === 'flex') {
      el.style.display = 'none';
      icon.innerText = 'expand_more';
    } else {
      el.style.display = 'flex';
      icon.innerText = 'expand_less';
    }
  }

  async function savePassword() {
    const username = document.getElementById('secUser').value;
    const newPassword = document.getElementById('secPass').value;

    if (!username || !newPassword) {
      await mDialog.alert(mariowOSI18n.t("settings.security.fields-required", "Both fields are required."));
      return;
    }

    const currentPassword = document.getElementById('secCurrent').value;
    try {
      const res = await fetch('/set-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, newPassword, currentPassword })
      });
      const text = await res.text();
      if (!res.ok) { await mDialog.alert(mariowOSI18n.t("settings.security.update-failed", "Could not update password: {error}", { error: text })); return; }
      await mDialog.alert(mariowOSI18n.t("settings.security.updated", "Password updated successfully."));
      document.getElementById('secPass').value = '';
      document.getElementById('secCurrent').value = '';
      toggleDropdown('pwdDrop');
    } catch (e) {
      await mDialog.alert(mariowOSI18n.t("settings.security.network-error", "Network error: {error}", { error: e.message }));
    }
  }

  async function removePassword() {
    if (await mDialog.confirm(mariowOSI18n.t("settings.security.clear-confirm", "Are you sure you want to remove your password? Anyone will be able to log in without it."), { danger: true, okText: mariowOSI18n.t("common.remove", "Remove") })) {
      const currentPassword = await mDialog.prompt(mariowOSI18n.t("settings.security.clear-prompt", "Enter your current password to confirm:"), { type: "password", title: mariowOSI18n.t("settings.security.confirm-password", "Confirm password") });
      if (currentPassword === null) return;
      try {
        const res = await fetch('/clear-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ currentPassword })
        });
        const text = await res.text();
        await mDialog.alert(res.ok ? mariowOSI18n.t("settings.security.cleared", "Password cleared.") : mariowOSI18n.t("settings.security.clear-failed", "Could not clear password: {error}", { error: text }));
      } catch (e) {
        await mDialog.alert(mariowOSI18n.t("settings.security.network-error", "Network error: {error}", { error: e.message }));
      }
    }
  }

  async function resetDesktop() {
    if (await mDialog.confirm(mariowOSI18n.t("settings.security.reset-desktop-confirm", "Reset desktop wallpaper and avatar to default?"), { danger: true, okText: mariowOSI18n.t("settings.security.reset", "Reset") })) {
      const res = await fetch('/api/system/reset-desktop', { method: 'POST' });
      if (!res.ok) { await mDialog.alert(mariowOSI18n.t("settings.security.reset-desktop-failed", "Desktop reset failed.")); return; }
      try { localStorage.removeItem('wallpaper'); } catch (e) {}
      await mDialog.alert(mariowOSI18n.t("settings.security.reset-desktop-done", "Desktop reset. Reloading system..."));
      window.top.location.reload();
    }
  }

  async function factoryReset() {
    if (await mDialog.confirm(mariowOSI18n.t("settings.security.factory-confirm", "This will erase all system preferences, apps and data. Continue?"), { danger: true, okText: mariowOSI18n.t("settings.security.erase-everything", "Erase everything"), title: mariowOSI18n.t("settings.security.factory-title", "Factory reset") })) {
      const password = await askFactoryResetPassword();
      if (password === null) return;
      try {
        await runFactoryReset(password);
      } catch (e) {
        await mDialog.alert(mariowOSI18n.t("settings.security.factory-failed", "Factory reset failed: {error}", { error: e.message }));
      }
    }
  }

  loadUserData();
</script>

</body>
</html>
