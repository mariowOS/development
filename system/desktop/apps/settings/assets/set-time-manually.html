<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set Time Manually</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"/>

<style>
:root {
  --md-sys-color-background: #141218;
  --md-sys-color-surface-container: #2b2930;
  --md-sys-color-surface-container-high: #36343b;
  --md-sys-color-primary: #d0bcff;
  --md-sys-color-on-primary: #381e72;
  --md-sys-color-on-surface: #e6e0e9;
  --md-sys-color-on-surface-variant: #cac4d0;
  --md-sys-color-outline: #938f99;
}

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: transparent;
  color: var(--md-sys-color-on-surface);
  overflow-y: auto;
  padding: 32px 20px;
  display: flex;
  justify-content: center;
}   

.container {
  max-width: 560px;
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.setting-card {
  background: var(--md-sys-color-surface-container);
  border-radius: 24px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.setting-card label {
  font-size: 14px;
  font-weight: 500;
  color: var(--md-sys-color-on-surface-variant);
  margin-left: 4px;
}

.setting-card input[type="time"] {
  width: 100%;
  padding: 14px 16px;
  background: var(--md-sys-color-surface-container-high);
  border: 1px solid transparent;
  border-radius: 16px;
  color: var(--md-sys-color-on-surface);
  font-family: 'Poppins', sans-serif;
  font-size: 16px;
  box-sizing: border-box;
  outline: none;
  cursor: pointer;
  transition: all 0.2s ease;
}

.setting-card input[type="time"]:focus {
  border-color: var(--md-sys-color-primary);
}

/* Material You TimePicker icon styling */
::-webkit-calendar-picker-indicator {
  filter: invert(0.8);
  cursor: pointer;
}

.btn-primary {
  width: 100%;
  padding: 14px 24px;
  background: var(--md-sys-color-primary);
  color: var(--md-sys-color-on-primary);
  border: none;
  border-radius: 28px;
  font-family: 'Poppins', sans-serif;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.1s;
}

.btn-primary:hover {
  opacity: 0.9;
}

.btn-primary:active {
  transform: scale(0.98);
}

html::-webkit-scrollbar {
  display: none;
}
</style>
<link rel="stylesheet" href="/desktop/assets/material-you.css">
<script src="/desktop/assets/monet-engine.js"></script>
</head>
<body>

<div class="container">
  <div class="setting-card">
    <label for="timeInput">Select Time</label>
    <input type="time" id="timeInput">
  </div>

  <button class="btn-primary" onclick="setTime()">Set System Time</button>
</div>

<script>
window.addEventListener('load', function() {
  const timeInput = document.getElementById('timeInput');
  const now = new Date();
  const hours = String(now.getHours()).padStart(2, '0');
  const minutes = String(now.getMinutes()).padStart(2, '0');
  timeInput.value = `${hours}:${minutes}`;
});

function setTime() {
  const timeInput = document.getElementById('timeInput');
  
  if (!timeInput.value) {
    alert('Please select a time');
    return;
  }

  const [hours, minutes] = timeInput.value.split(':');
  const h = parseInt(hours, 10);
  const m = parseInt(minutes, 10);

  const now = new Date();
  const offsetMs = (h - now.getHours()) * 3600000 + (m - now.getMinutes()) * 60000;
  
  localStorage.setItem('systemTimeOffset', offsetMs);
  localStorage.setItem('manualTimeEnabled', 'true');
  localStorage.removeItem('timezoneOffset');

  alert(`System time set to: ${hours}:${minutes}`);
  
  setTimeout(function() {
    window.history.back();
  }, 500);
}
</script>

</body>
</html>
