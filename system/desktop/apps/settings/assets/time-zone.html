<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Zone Settings</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"/>

<style>
:root {
  --md-sys-color-background: #141218;
  --md-sys-color-surface-container: #2b2930;
  --md-sys-color-surface-container-high: #36343b;
  --md-sys-color-surface-container-highest: #4a4458;
  --md-sys-color-primary: #d0bcff;
  --md-sys-color-on-primary: #381e72;
  --md-sys-color-on-surface: #e6e0e9;
  --md-sys-color-on-surface-variant: #cac4d0;
  --md-sys-color-outline: #938f99;
}

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: transparent;
  color: var(--md-sys-color-on-surface);
  overflow-y: auto;
  padding: 32px 20px;
  display: flex;
  justify-content: center;
}   

.container {
  max-width: 560px;
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.setting-card {
  background: var(--md-sys-color-surface-container);
  border-radius: 24px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.setting-card label {
  font-size: 14px;
  font-weight: 500;
  color: var(--md-sys-color-on-surface-variant);
  margin-left: 4px;
}

.setting-card select {
  width: 100%;
  padding: 14px 16px;
  background: var(--md-sys-color-surface-container-high);
  border: 1px solid transparent;
  border-radius: 16px;
  color: var(--md-sys-color-on-surface);
  font-family: 'Poppins', sans-serif;
  font-size: 14px;
  box-sizing: border-box;
  outline: none;
  cursor: pointer;
  transition: all 0.2s ease;
}

.setting-card select:focus {
  border-color: var(--md-sys-color-primary);
}

.setting-card select option {
  background: #2b2930;
  color: var(--md-sys-color-on-surface);
}

.preview-box {
  font-size: 32px;
  font-weight: 600;
  text-align: center;
  padding: 24px;
  background: var(--md-sys-color-surface-container-high);
  border-radius: 16px;
  color: var(--md-sys-color-primary);
  letter-spacing: 1px;
}

.btn-primary {
  width: 100%;
  padding: 14px 24px;
  background: var(--md-sys-color-primary);
  color: var(--md-sys-color-on-primary);
  border: none;
  border-radius: 28px;
  font-family: 'Poppins', sans-serif;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.1s;
}

.btn-primary:hover {
  opacity: 0.9;
}

.btn-primary:active {
  transform: scale(0.98);
}

html::-webkit-scrollbar {
  display: none;
}
</style>
<link rel="stylesheet" href="/desktop/assets/material-you.css">
<script src="/desktop/assets/monet-engine.js"></script>
</head>
<body>

<div class="container">
  
  <div class="setting-card">
    <label for="timezoneSelect">Select Time Zone</label>
    <select id="timezoneSelect" onchange="updatePreviewClock()">
      <option value="-12">UTC−12 (International Date Line West)</option>
      <option value="-11">UTC−11 (Samoa Time)</option>      
      <option value="-10">UTC−10 (Hawaii Time)</option>
      <option value="-9">UTC−9 (Alaska Time)</option>
      <option value="-8">UTC−8 (Pacific Time)</option>
      <option value="-7">UTC−7 (Mountain Time)</option>
      <option value="-6">UTC−6 (Central Time)</option>
      <option value="-5">UTC−5 (Eastern Time)</option>
      <option value="-4">UTC−4 (Atlantic Time)</option>
      <option value="-3">UTC−3 (Buenos Aires Time)</option>
      <option value="-2">UTC−2 (Fernando de Noronha Time)</option>
      <option value="-1">UTC−1 (Azores Time)</option>
      <option value="0">UTC±0 (Greenwich Mean Time)</option>
      <option value="1">UTC+1 (CET – Winter Time)</option>
      <option value="2">UTC+2 (EET / CEST – Summer Time)</option>
      <option value="3">UTC+3 (Eastern European Time)</option>
      <option value="4">UTC+4 (Gulf Standard Time)</option>
      <option value="5">UTC+5 (Pakistan Standard Time)</option>
      <option value="5.5">UTC+5:30 (India Standard Time)</option>
      <option value="6">UTC+6 (Bangladesh Standard Time)</option>
      <option value="7">UTC+7 (Indochina Time)</option>
      <option value="8">UTC+8 (China Standard Time)</option>
      <option value="9">UTC+9 (Japan Standard Time)</option>
      <option value="10">UTC+10 (Australian Eastern Time)</option>
      <option value="11">UTC+11 (Solomon Islands Time)</option>
      <option value="12">UTC+12 (New Zealand Standard Time)</option>
    </select>
  </div>

  <div class="setting-card">
    <label>Preview Time</label>
    <div class="preview-box" id="previewClock">
      --:--
    </div>
  </div>

  <button class="btn-primary" onclick="setTimeZone()">Set Time Zone</button>
</div>

<script>
window.addEventListener('load', function() {
  const saved = localStorage.getItem('timezoneOffset');
  if (saved !== null) {
    document.getElementById('timezoneSelect').value = saved;
  }
  updatePreviewClock();
  setInterval(updatePreviewClock, 1000);
});

function updatePreviewClock() {
  const select = document.getElementById('timezoneSelect');
  const offset = parseFloat(select.value);
  
  let now = new Date();
  let utcMs = now.getTime() - (now.getTimezoneOffset() * 60000);
  utcMs = utcMs + (offset * 3600000);
  
  let displayTime = new Date(utcMs);
  
  let h = displayTime.getUTCHours(), m = displayTime.getUTCMinutes(), s = displayTime.getUTCSeconds();
  const ampm = h >= 12 ? "PM" : "AM";
  h = h % 12; h = h ? h : 12;
  m = m < 10 ? "0" + m : m;
  s = s < 10 ? "0" + s : s;
  
  const txt = `${h}:${m}:${s} ${ampm}`;
  document.getElementById("previewClock").textContent = txt;
}

function setTimeZone() {
  const select = document.getElementById('timezoneSelect');
  const offset = parseFloat(select.value);
  
  localStorage.setItem('timezoneOffset', offset);
  localStorage.setItem('systemTimeOffset', 0);
  localStorage.setItem('manualTimeEnabled', 'false');
  
  alert(`Time zone set to UTC${offset >= 0 ? '+' : ''}${offset}`);
  
  setTimeout(function() {
    window.history.back();
  }, 500);
}
</script>

</body>
</html>
