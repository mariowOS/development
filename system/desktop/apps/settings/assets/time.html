

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time & Date</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"/>

<style>
:root {
  --md-sys-color-background: #141218;
  --md-sys-color-surface-container: #2b2930;
  --md-sys-color-surface-container-high: #36343b;
  --md-sys-color-surface-container-highest: #4a4458;
  --md-sys-color-primary: #d0bcff;
  --md-sys-color-primary-container: #4f378b;
  --md-sys-color-on-primary-container: #eaddff;
  --md-sys-color-on-surface: #e6e0e9;
  --md-sys-color-on-surface-variant: #cac4d0;
}

body {
  font-family: 'Poppins', sans-serif;
  color: var(--md-sys-color-on-surface);
  margin: 0;
  padding: 32px 20px;
  background: transparent;
  overflow-y: auto;
  display: flex;
  justify-content: center;
}

.container {
  max-width: 560px;
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.time-display {
  background: var(--md-sys-color-surface-container);
  border-radius: 28px;
  padding: 32px 20px;
  text-align: center;
}

.time-display .clock {
  font-size: 44px;
  font-weight: 600;
  color: var(--md-sys-color-primary);
  line-height: 1.1;
  margin-bottom: 8px;
}

.time-display .date {
  font-size: 14px;
  color: var(--md-sys-color-on-surface-variant);
  font-weight: 400;
}

.banner {
  background: var(--md-sys-color-surface-container-high);
  border-radius: 20px;
  padding: 16px 20px;
}

.banner .title {
  font-size: 15px;
  font-weight: 500;
  color: var(--md-sys-color-on-surface);
}

.banner .desc {
  font-size: 13px;
  color: var(--md-sys-color-on-surface-variant);
  margin-top: 4px;
}

.card-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.item {
  background: var(--md-sys-color-surface-container);
  border-radius: 20px;
  padding: 16px 20px;
  cursor: pointer;
  transition: background 0.2s, transform 0.15s;
  display: flex;
  justify-content: space-between;
  align-items: center;
  user-select: none;
}

.item:hover {
  background: var(--md-sys-color-surface-container-high);
}

.item:active {
  transform: scale(0.98);
}

.text-group {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.text-title {
  font-size: 15px;
  font-weight: 500;
  color: var(--md-sys-color-on-surface);
}

.text-desc {
  font-size: 13px;
  color: var(--md-sys-color-on-surface-variant);
}

.card-arrow {
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--md-sys-color-surface-container-highest);
  border-radius: 50%;
  color: var(--md-sys-color-on-surface-variant);
  flex-shrink: 0;
  transition: background 0.2s, color 0.2s;
}

.item:hover .card-arrow {
  background: var(--md-sys-color-primary-container);
  color: var(--md-sys-color-on-primary-container);
}

html::-webkit-scrollbar {
  display: none;
}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
<link rel="stylesheet" href="settings-submenu.css">
</head>
<body>

<div class="container">
  <div class="settings-page-header">
    <button class="settings-page-back" type="button" aria-label="Back to settings" onclick="goBackToSettings()">
      <span class="material-symbols-outlined">arrow_back_ios_new</span>
    </button>
    <h1>Time &amp; Date</h1>
  </div>

  <div class="time-display">
    <div class="clock" id="clock">--:-- --</div>
    <div class="date" id="date">-</div>
  </div>

  <div class="banner">
    <div class="title">Date and time settings</div>
    <div class="desc">
      Adjust your system clock and time zone.
    </div>
  </div>

  <div class="card-list">
    <div class="item" role="link" tabindex="0" onclick="navigateToFile('set-time-manually.html')" onkeydown="if(event.key==='Enter'||event.key===' ')navigateToFile('set-time-manually.html')">
      <div class="icon-badge"><span class="material-symbols-outlined">edit</span></div>
      <div class="text-group">
        <div class="text-title">Set time manually</div>
        <div class="text-desc">Manually set the system time</div>
      </div>
      <div class="item-right"><span class="material-symbols-outlined">chevron_right</span></div>
    </div>

    <div class="item" role="link" tabindex="0" onclick="navigateToFile('time-zone.html')" onkeydown="if(event.key==='Enter'||event.key===' ')navigateToFile('time-zone.html')">
      <div class="icon-badge"><span class="material-symbols-outlined">public</span></div>
      <div class="text-group">
        <div class="text-title">Time zone</div>
        <div class="text-desc">Change your time zone</div>
      </div>
      <div class="item-right"><span class="material-symbols-outlined">chevron_right</span></div>
    </div>

  </div>
</div>

<script>
function goBackToSettings() {
  if (window.parent && typeof window.parent.closeSettingsSubmenu === 'function') {
    window.parent.closeSettingsSubmenu('time');
  } else {
    window.history.back();
  }
}

function navigateToFile(file) {
  const openPage = () => {
    window.location.href = `/desktop/apps/settings/assets/${file}`;
  };

  if (window.parent !== window && typeof window.parent.requirePassword === 'function') {
    window.parent.requirePassword(openPage);
  } else {
    openPage();
  }
}

function updateTime() {
  const now = new Date();
  let hours = now.getHours();
  const minutes = now.getMinutes().toString().padStart(2, "0");
  const ampm = hours >= 12 ? "PM" : "AM";
  hours = hours % 12 || 12;
  document.getElementById('clock').textContent = `${hours}:${minutes} ${ampm}`;
  document.getElementById('date').textContent = now.toLocaleDateString(undefined, { weekday: "long", year: "numeric", month: "long", day: "numeric" });
}

updateTime();
setInterval(updateTime, 1000);
</script>

</body>
</html>
