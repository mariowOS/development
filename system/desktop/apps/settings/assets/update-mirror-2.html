<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mariowOS Update Center</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  padding: 0;
  min-height: 400px;
  overflow: hidden;
  font-family: 'Poppins', sans-serif;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
}

.card {
  text-align: center;
  padding: 40px 32px;
  width: 100%;
  max-width: 420px;
  position: relative;
  z-index: 1;
}

/* ── Logo ── */
.logo-container {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 28px;
}

.logo-img {
  width: 200px;
  height: auto;
  display: block;
  filter: drop-shadow(0 0 12px rgba(255,255,255,0.15));
  transition: filter 0.5s;
  position: relative;
}

.logo-img.updating {
  animation: logoPulse 2s ease-in-out infinite;
}

@keyframes logoPulse {
  0%, 100% { filter: drop-shadow(0 0 12px rgba(53,132,228,0.3)) brightness(1); }
  50% { filter: drop-shadow(0 0 28px rgba(53,132,228,0.6)) brightness(1.1); }
}

.logo-img.done {
  filter: drop-shadow(0 0 18px rgba(52,199,89,0.4));
}

/* ── Progress bar ── */
.progress-track {
  width: 200px;
  height: 4px;
  background: rgba(255,255,255,0.08);
  border-radius: 4px;
  margin: 0 auto 8px auto;
  overflow: hidden;
  display: none;
}

.progress-track.visible { display: block; }

.progress-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #3584e4, #60a5fa);
  border-radius: 4px;
  transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 0 10px rgba(53,132,228,0.4);
}

.progress-fill.complete {
  background: linear-gradient(90deg, #34c759, #60d680);
  box-shadow: 0 0 12px rgba(52,199,89,0.5);
}

.pct-text {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.5px;
  margin-bottom: 16px;
  transition: color 0.5s;
  display: none;
}

.pct-text.visible { display: block; }

.pct-text.complete {
  color: #34c759;
}

/* ── Status ── */
.status {
  font-size: 16px;
  font-weight: 500;
  color: #ccc;
  margin-bottom: 8px;
  min-height: 28px;
}

.status-update {
  font-size: 13px;
  color: #888;
  min-height: 20px;
}

/* ── Version info ── */
.version-row {
  display: flex;
  justify-content: center;
  gap: 24px;
  margin: 16px 0 24px 0;
  font-size: 12px;
  color: #666;
}

.version-row span {
  display: flex;
  align-items: center;
  gap: 6px;
}

.version-dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
}

.version-dot.current { background: #3584e4; }
.version-dot.latest { background: #34c759; }

/* ── Changelog ── */
.changelog {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 16px;
  padding: 18px 22px;
  margin-bottom: 24px;
  text-align: left;
  display: none;
  max-height: 160px;
  overflow-y: auto;
}

.changelog-title {
  font-size: 12px;
  font-weight: 600;
  color: #888;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 10px;
}

.changelog-text {
  font-size: 13px;
  color: #bbb;
  line-height: 1.6;
  white-space: pre-wrap;
}

.changelog::-webkit-scrollbar { width: 4px; }
.changelog::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

/* ── Button ── */
.btn {
  background: #3584e4;
  color: #fff;
  border: none;
  padding: 14px 32px;
  font-size: 15px;
  font-weight: 600;
  border-radius: 14px;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.25s ease;
  display: none;
  margin: 0 auto;
  width: 100%;
  box-shadow: 0 4px 20px rgba(53, 132, 228, 0.3);
}

.btn:hover {
  background: #2a6dc4;
  transform: translateY(-2px);
  box-shadow: 0 8px 30px rgba(53, 132, 228, 0.4);
}

.btn:active { transform: scale(0.97); }

.links {
  display: flex;
  gap: 20px;
  justify-content: center;
  margin-top: 20px;
}

.links a {
  color: #555;
  text-decoration: none;
  font-size: 13px;
  transition: color 0.2s;
}

.links a:hover { color: #888; }

/* ── Space particles ── */
.particles {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 0;
}

.particle {
  position: absolute;
  border-radius: 50%;
  background: #fff;
  animation: starFloat var(--dur) ease-in-out infinite;
  animation-delay: var(--delay);
}

.particle.s1 { width: 1.5px; height: 1.5px; opacity: 0.5; }
.particle.s2 { width: 2px; height: 2px; opacity: 0.7; }
.particle.s3 { width: 3px; height: 3px; opacity: 0.9; box-shadow: 0 0 4px rgba(255,255,255,0.5); }

@keyframes starFloat {
  0% { opacity: 0; transform: translateY(0) scale(0); }
  15% { opacity: var(--max-opacity, 1); }
  85% { opacity: var(--max-opacity, 1); }
  100% { opacity: 0; transform: translateY(-80px) scale(1); }
}
</style>
<link rel="stylesheet" href="/desktop/assets/material-you.css">
<script src="/desktop/assets/monet-engine.js"></script>
</head>
<body>
<div class="card" id="app">
  <div class="particles" id="particles"></div>
  <div class="logo-container">
    <img src="logo.png" alt="mariowOS" class="logo-img" id="logoImg"
      onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxNDAiIGhlaWdodD0iMTQwIiB2aWV3Qm94PSIwIDAgMjQgMjQiPjxwYXRoIGZpbGw9IiMzZWM2ZTAiIGQ9Ik0xMiAyQzIuMzggMiAyIDYuNzcgMiAxMnMuMzggMTAgMTAgMTAgMTAtNC43NyAxMC0xMC0uMzgtMTAtMTAtMTB6bTAgMThjLTQuMDYgMC00LTMuNjctNC04cy0uMDYtOCA0LTggNCAzLjY3IDQgOC0uMDYgOC00IDh6Ii8+PC9zdmc+'">
  </div>

  <div class="pct-text" id="pctText"></div>

  <div class="progress-track" id="progressTrack">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <div class="status" id="statusText">Checking for updates...</div>
  <div class="status-update" id="statusDetail"></div>

  <div class="version-row" id="versionRow" style="display:none;">
    <span><span class="version-dot current"></span> Current: <span id="currentVer">—</span></span>
    <span><span class="version-dot latest"></span> Latest: <span id="latestVer">—</span></span>
  </div>

  <div class="changelog" id="changelogBox">
    <div class="changelog-title">What's New</div>
    <div class="changelog-text" id="changelogText"></div>
  </div>

  <button class="btn" id="btnAction" onclick="startUpdate()">Update Now</button>

  <div class="links" id="linksRow">
    <a href="changechannel.html">Change channel</a>
    <a href="roadmap.html">Roadmap</a>
  </div>
</div>

<script>
let isUpdating = false;

function setStatus(text, detail) {
  document.getElementById('statusText').textContent = text;
  if (detail) document.getElementById('statusDetail').textContent = detail;
}

// Particles
(function createParticles() {
  const container = document.getElementById('particles');
  for (let i = 0; i < 24; i++) {
    const p = document.createElement('div');
    const size = i % 3 === 0 ? 's3' : i % 2 === 0 ? 's2' : 's1';
    p.className = 'particle ' + size;
    p.style.left = (3 + Math.random() * 94) + '%';
    p.style.top = (5 + Math.random() * 80) + '%';
    p.style.setProperty('--delay', (Math.random() * 6) + 's');
    p.style.setProperty('--dur', (3 + Math.random() * 4) + 's');
    p.style.setProperty('--max-opacity', (0.4 + Math.random() * 0.6));
    container.appendChild(p);
  }
})();

// Init
document.getElementById('logoImg').className = 'logo-img';

// Check for updates
async function checkUpdates() {
  const status = document.getElementById('statusText');
  const btn = document.getElementById('btnAction');

  try {
    const resp = await fetch('/api/system/check-update');
    const data = await resp.json();

    if (data.error) {
      status.textContent = 'Update server unreachable';
      return;
    }

    document.getElementById('versionRow').style.display = 'flex';
    document.getElementById('currentVer').textContent = data.current || '—';
    document.getElementById('latestVer').textContent = data.latest || data.current || '—';

    if (data.updateAvailable) {
      status.textContent = `Update ${data.latest} Available`;

      if (data.changelog) {
        document.getElementById('changelogBox').style.display = 'block';
        document.getElementById('changelogText').textContent = data.changelog;
      }

      btn.style.display = 'block';
      btn.textContent = `Download & Install`;
      document.getElementById('linksRow').style.display = 'flex';
    } else {
      status.textContent = `System Up to Date (v${data.current})`;
      btn.style.display = 'none';
    }
  } catch (err) {
    status.textContent = 'Update check failed';
    console.error(err);
  }
}

function showProgress(pct) {
  const fill = document.getElementById('progressFill');
  const pctT = document.getElementById('pctText');
  const track = document.getElementById('progressTrack');

  if (!track.classList.contains('visible')) {
    track.classList.add('visible');
    pctT.classList.add('visible');
  }
  pctT.textContent = Math.round(pct) + '%';
  fill.style.width = pct + '%';
}

// Start OTA
function startUpdate() {
  if (isUpdating) return;
  isUpdating = true;

  const btn = document.getElementById('btnAction');
  const links = document.getElementById('linksRow');
  const changelog = document.getElementById('changelogBox');

  btn.style.display = 'none';
  links.style.display = 'none';
  changelog.style.display = 'none';

  const eventSource = new EventSource('/api/system/ota-update');

  eventSource.onmessage = function(event) {
    const data = JSON.parse(event.data);
    showProgress(data.percent);

    const logo = document.getElementById('logoImg');

    if (data.percent >= 100) {
      document.getElementById('progressFill').classList.add('complete');
      document.getElementById('pctText').classList.add('complete');
      logo.className = 'logo-img done';
    } else {
      logo.className = 'logo-img updating';
    }

    if (data.status) setStatus(data.status);

    if (data.finished) {
      eventSource.close();
      isUpdating = false;

      if (data.percent >= 100) {
        btn.textContent = 'Reboot';
        btn.style.display = 'block';
        btn.onclick = () => window.parent.location.reload();
      }
    }
  };

  eventSource.onerror = function() {
    setStatus('Connection lost');
    btn.textContent = 'Retry';
    btn.style.display = 'block';
    btn.onclick = () => { eventSource.close(); startUpdate(); };
    isUpdating = false;
  };
}

window.addEventListener('DOMContentLoaded', checkUpdates);
</script>
</body>
</html>
