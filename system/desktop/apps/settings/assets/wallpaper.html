<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wallpaper Settings</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
body {
  font-family: 'Poppins', sans-serif;
  color: var(--md-sys-color-on-surface, #fff);
  margin: 0;
  padding: 24px;
  background: transparent;
  overflow-y: auto;
}
.container { max-width: 560px; }
.header { font: var(--md-sys-typescale-title-large, 600 22px/28px 'Poppins'); margin-bottom: 20px; }
.card {
  background: var(--md-sys-color-surface-container, rgba(255,255,255,0.03));
  border-radius: var(--md-sys-shape-corner-medium, 16px);
  padding: 24px;
  margin-bottom: 16px;
}
.upload-area {
  border: 2px dashed var(--md-sys-color-outline-variant, rgba(255,255,255,0.12));
  border-radius: var(--md-sys-shape-corner-small, 12px);
  padding: 28px;
  text-align: center;
  margin-bottom: 16px;
  transition: border-color 0.2s;
  cursor: pointer;
}
.upload-area:hover { border-color: color-mix(in srgb, var(--md-sys-color-primary, #3584e4) 40%, transparent); }
.upload-area.dragover { border-color: var(--md-sys-color-primary, #3584e4); background: color-mix(in srgb, var(--md-sys-color-primary, #3584e4) 6%, transparent); }
.upload-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.5; }
.upload-text { font-size: 14px; color: var(--md-sys-color-on-surface-variant, #888); margin-bottom: 4px; }
.upload-hint { font-size: 12px; color: var(--md-sys-color-on-surface-variant, #555); }
.file-input { display: none; }
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 40px;
  padding: 0 24px;
  background: var(--md-sys-color-primary, #3584e4);
  color: var(--md-sys-color-on-primary, #fff);
  border: none;
  border-radius: var(--md-sys-shape-corner-full, 9999px);
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  width: 100%;
}
.btn:hover { background: color-mix(in srgb, var(--md-sys-color-primary, #3584e4) 90%, #fff); }
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.preview-area {
  margin-bottom: 16px;
  display: none;
}
.preview-area img {
  width: 100%;
  border-radius: var(--md-sys-shape-corner-small, 12px);
  max-height: 200px;
  object-fit: cover;
  border: 1px solid var(--md-sys-color-outline-variant, rgba(255,255,255,0.06));
}
.status { font-size: 13px; margin-top: 12px; min-height: 20px; color: var(--md-sys-color-on-surface-variant, #888); }
.presets { display: flex; gap: 12px; margin-top: 16px; }
.preset-item {
  flex: 1;
  height: 80px;
  border-radius: var(--md-sys-shape-corner-small, 12px);
  cursor: pointer;
  border: 2px solid transparent;
  transition: all 0.2s;
  background-size: cover;
  background-position: center;
}
.preset-item:hover { border-color: var(--md-sys-color-outline, rgba(255,255,255,0.2)); }
.preset-item.active { border-color: var(--md-sys-color-primary, #3584e4); }
html::-webkit-scrollbar { display: none; }
</style>
<link rel="stylesheet" href="/desktop/assets/material-you.css">
<script src="/desktop/assets/monet-engine.js"></script>
</head>
<body>
<div class="container">
  <div class="card">
    <div class="upload-area" id="dropArea" onclick="document.getElementById('fileInput').click()">
      <div class="upload-icon">🖼️</div>
      <div class="upload-text">Click to upload wallpaper</div>
      <div class="upload-hint">PNG or JPEG recommended</div>
      <input type="file" id="fileInput" class="file-input" accept="image/png,image/jpeg" onchange="previewFile(event)">
    </div>

    <div class="preview-area" id="previewArea">
      <img id="previewImg" src="" alt="Preview">
    </div>

    <button class="btn" id="applyBtn" onclick="applyWallpaper()" disabled>Apply Wallpaper</button>
    <div id="status" class="status"></div>
  </div>

<script>
let selectedFile = null;

function previewFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  selectedFile = file;
  const reader = new FileReader();
  reader.onload = (e) => {
    document.getElementById('previewArea').style.display = 'block';
    document.getElementById('previewImg').src = e.target.result;
    document.getElementById('applyBtn').disabled = false;
    document.getElementById('status').textContent = '';
  };
  reader.readAsDataURL(file);
}

async function applyWallpaper() {
  if (!selectedFile) return;
  const status = document.getElementById('status');
  const btn = document.getElementById('applyBtn');
  btn.disabled = true;
  status.textContent = 'Uploading...';
  status.style.color = '#888';

  const formData = new FormData();
  formData.append('wallpaper', selectedFile);

  try {
    const res = await fetch('/upload-wallpaper', { method: 'POST', body: formData });
    const data = await res.json();
    if (data.success) {
      status.textContent = 'Wallpaper applied!';
      status.style.color = '#34c759';
      window.parent.postMessage({ type: 'apply-wallpaper' }, '*');
    } else {
      throw new Error(data.error);
    }
  } catch (err) {
    status.textContent = 'Error: ' + err.message;
    status.style.color = '#ff3b30';
  }
  btn.disabled = false;
}

function applyPreset(name) {
  document.querySelectorAll('.preset-item').forEach(el => el.classList.remove('active'));
  event.target.classList.add('active');
  selectedFile = null;
  document.getElementById('previewArea').style.display = 'none';
  document.getElementById('applyBtn').disabled = true;

  if (name === 'factory') {
    // Delete user wallpaper to revert to factory
    fetch('/api/system/reset-desktop', { method: 'POST' })
      .then(() => {
        document.getElementById('status').textContent = 'Factory wallpaper restored';
        document.getElementById('status').style.color = '#34c759';
        window.parent.postMessage({ type: 'apply-wallpaper' }, '*');
      });
  } else {
    document.getElementById('status').textContent = 'Preset selected (conceptual)';
    document.getElementById('status').style.color = '#888';
  }
}

// Drag and drop
const dropArea = document.getElementById('dropArea');
dropArea.addEventListener('dragover', (e) => { e.preventDefault(); dropArea.classList.add('dragover'); });
dropArea.addEventListener('dragleave', () => dropArea.classList.remove('dragover'));
dropArea.addEventListener('drop', (e) => {
  e.preventDefault();
  dropArea.classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (file) {
    document.getElementById('fileInput').files = e.dataTransfer.files;
    previewFile({ target: { files: [file] } });
  }
});
</script>
</body>
</html>
