<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Settings</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"/>

<style>
:root {
  --md-sys-color-background: #141218;
  --md-sys-color-surface-container: #2b2930;
  --md-sys-color-surface-container-high: #36343b;
  --md-sys-color-primary: #d0bcff;
  --md-sys-color-on-primary: #381e72;
  --md-sys-color-on-surface: #e6e0e9;
  --md-sys-color-on-surface-variant: #cac4d0;
  --md-sys-color-outline: #938f99;
}

body {
  font-family: 'Poppins', sans-serif;
  color: var(--md-sys-color-on-surface);
  margin: 0;
  padding: 32px 20px;
  background: transparent;
  overflow-y: auto;
  display: flex;
  align-items: center;
  justify-content: center;
}

.container {
  max-width: 560px;
  width: 100%;
  position: relative;
}

.card-group {
  background: var(--md-sys-color-surface-container);
  border-radius: 24px;
  padding: 24px;
  margin-bottom: 20px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.field label {
  font-size: 14px;
  font-weight: 500;
  color: var(--md-sys-color-on-surface-variant);
  margin-left: 4px;
}

.field input,
.field select {
  width: 100%;
  padding: 14px 16px;
  box-sizing: border-box;
  background: var(--md-sys-color-surface-container-high);
  border: 1px solid transparent;
  border-radius: 16px;
  color: var(--md-sys-color-on-surface);
  font-family: 'Poppins', sans-serif;
  font-size: 14px;
  transition: all 0.2s ease;
}

.field input:focus,
.field select:focus {
  outline: none;
  border-color: var(--md-sys-color-primary);
  background: var(--md-sys-color-surface-container-high);
}

.field input::placeholder {
  color: var(--md-sys-color-outline);
}

.btn-primary {
  width: 100%;
  padding: 14px 24px;
  background: var(--md-sys-color-primary);
  color: var(--md-sys-color-on-primary);
  border: none;
  border-radius: 28px;
  font-family: 'Poppins', sans-serif;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.1s;
}

.btn-primary:hover {
  opacity: 0.9;
}

.btn-primary:active {
  transform: scale(0.98);
}

html::-webkit-scrollbar {
  display: none;
}
</style>
<link rel="stylesheet" href="/desktop/assets/material-you.css">
<script src="/desktop/assets/monet-engine.js"></script>
</head>
<body>

<div class="container">
  <div class="card-group">
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Enter your username">
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Enter your email address">
    </div>
  </div>

  <button class="btn-primary" onclick="saveSettings()">Save Settings</button>
</div>

<script>
document.addEventListener('DOMContentLoaded', async () => {
  const urlParams = new URLSearchParams(window.location.search);
  const isEditing = urlParams.get('edit') === 'true';

  try {
    const resp = await fetch('/get-settings');
    if (!resp.ok) return;

    const cfg = await resp.json();

    if (cfg.username) document.getElementById('username').value = cfg.username;
    if (cfg.email) document.getElementById('email').value = cfg.email;

    const isComplete = cfg.username?.trim() && cfg.email?.trim();
    if (isComplete && !isEditing) {
      window.location.replace('youafter.html');
    }
  } catch (err) {
    console.warn('Settings check failed:', err);
  }
});

function saveSettings() {
  const username = document.getElementById('username').value.trim();
  const email = document.getElementById('email').value.trim();

  if (!username || !email) {
    alert('Username and Email cannot be empty.');
    return;
  }

  if (username.length > 30 || email.length > 50) {
    alert('Username is too long. Maximum 30 characters allowed.');
    return;
  }

  const settings = { username, email };

  fetch('/save-settings', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(settings)
  })
  .then(async response => {
    const ct = response.headers.get('content-type') || '';
    if (!ct.includes('application/json')) {
      alert('Server error: non-JSON response');
      return;
    }

    const data = await response.json();
    if (data.success) {
      window.location.href = 'youcode.html';
    } else {
      alert('Error: ' + (data.error || 'Unknown error'));
    }
  })
  .catch(err => {
    alert('Error saving settings: ' + err.message);
  });
}
</script>

</body>
</html>
