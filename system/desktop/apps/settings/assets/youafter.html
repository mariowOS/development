<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Account</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"/>

<style>
:root {
  --md-sys-color-background: #141218;
  --md-sys-color-surface-container: #2b2930;
  --md-sys-color-surface-container-high: #36343b;
  --md-sys-color-primary: #d0bcff;
  --md-sys-color-on-primary: #381e72;
  --md-sys-color-secondary-container: #4a4458;
  --md-sys-color-on-secondary-container: #e8def8;
  --md-sys-color-on-surface: #e6e0e9;
  --md-sys-color-on-surface-variant: #cac4d0;
  --md-sys-color-error: #ffb4ab;
  --md-sys-color-error-container: #93000a;
  --md-sys-color-on-error-container: #ffdad6;
}

body {
  font-family: 'Poppins', sans-serif;
  color: var(--md-sys-color-on-surface);
  margin: 0;
  padding: 32px 20px;
  background: transparent;
  overflow-y: auto;
  display: flex;
  align-items: center;
  justify-content: center;
}

.container {
  max-width: 560px;
  width: 100%;
  position: relative;
}

.account-card {
  background: var(--md-sys-color-surface-container);
  border-radius: 24px;
  padding: 24px;
  margin-bottom: 20px;
}

.account-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid var(--md-sys-color-surface-container-high);
}

.account-info:last-of-type {
  border-bottom: none;
  margin-bottom: 12px;
}

.account-info .label {
  font-size: 14px;
  font-weight: 500;
  color: var(--md-sys-color-on-surface-variant);
}

.account-info .value {
  font-size: 14px;
  font-weight: 600;
  color: var(--md-sys-color-on-surface);
}

.button-group {
  display: flex;
  gap: 12px;
}

button {
  flex: 1;
  padding: 12px 20px;
  background: var(--md-sys-color-secondary-container);
  color: var(--md-sys-color-on-secondary-container);
  border: none;
  border-radius: 28px;
  font-family: 'Poppins', sans-serif;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.1s;
}

button:hover {
  opacity: 0.9;
}

button:active {
  transform: scale(0.98);
}

button.secondary {
  background: var(--md-sys-color-error-container);
  color: var(--md-sys-color-on-error-container);
}

html::-webkit-scrollbar {
  display: none;
}
</style>
<link rel="stylesheet" href="/desktop/assets/material-you.css">
<script src="/desktop/assets/monet-engine.js"></script>
</head>
<body>

<div class="container">
  <div class="account-card">
    <div class="account-info">
      <span class="label">Username</span>
      <span class="value" id="u-username">—</span>
    </div>
    <div class="account-info">
      <span class="label">Email</span>
      <span class="value" id="u-email">—</span>
    </div>

    <div class="button-group">
      <button onclick="resetAvatar()">Reset Avatar</button>
      <button class="secondary" onclick="clearSettings()">Reset Settings</button>
    </div>
  </div>
</div>

<script>
(async function(){
  try {
    const r = await fetch('/get-settings');
    if (!r.ok) throw new Error('Network');
    const cfg = await r.json();
    
    if (!cfg || (!cfg.username && !cfg.email)) {
      window.location.href = 'you.html';
      return;
    }
    
    document.getElementById('u-username').textContent = cfg.username || '—';
    document.getElementById('u-email').textContent = cfg.email || '—';
  } catch (e) {
    console.warn('Failed to load settings:', e);
  }
})();

function editSettings() {
  window.location.href = 'you.html?edit=true';
}

async function resetAvatar() {
  if (!confirm('Are you sure you want to reset your avatar to default?')) return;

  try {
    const r = await fetch('/reset-avatar', { method: 'POST' });
    if (!r.ok) throw new Error('Network');
    const data = await r.json();
    if (data.success) {
      alert('Avatar reset to default successfully!');
    } else {
      alert('Error resetting avatar: ' + (data.error || 'unknown'));
    }
  } catch (e) {
    console.error('resetAvatar failed', e);
    alert('Network error while resetting avatar');
  }
}

async function clearSettings() {
  if (!confirm('Are you sure you want to reset your settings?')) return;

  try {
    const r = await fetch('/clear-settings', { method: 'POST' });
    if (!r.ok) throw new Error('Network');
    const data = await r.json();
    if (data.success) {
      window.location.href = 'you.html';
    } else {
      alert('Error resetting settings: ' + (data.error || 'unknown'));
    }
  } catch (e) {
    console.error('clearSettings failed', e);
    alert('Network error while resetting settings');
  }
}
</script>

</body>
</html>
