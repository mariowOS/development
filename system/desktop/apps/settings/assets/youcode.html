<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Email</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"/>

<style>
:root {
  --md-sys-color-background: #141218;
  --md-sys-color-surface-container: #2b2930;
  --md-sys-color-surface-container-high: #36343b;
  --md-sys-color-primary: #d0bcff;
  --md-sys-color-on-primary: #381e72;
  --md-sys-color-on-surface: #e6e0e9;
  --md-sys-color-on-surface-variant: #cac4d0;
  --md-sys-color-error: #ffb4ab;
  --md-sys-color-outline: #938f99;
}

body {
  font-family: 'Poppins', sans-serif;
  color: var(--md-sys-color-on-surface);
  margin: 0;
  padding: 32px 20px;
  background: transparent;
  overflow-y: auto;
  display: flex;
  align-items: center;
  justify-content: center;
}

.container {
  max-width: 560px;
  width: 100%;
  position: relative;
}

.card-group {
  background: var(--md-sys-color-surface-container);
  border-radius: 24px;
  padding: 24px;
  margin-bottom: 20px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.field label {
  font-size: 14px;
  font-weight: 500;
  color: var(--md-sys-color-on-surface-variant);
  margin-left: 4px;
}

.field input[type="text"] {
  width: 100%;
  padding: 14px 16px;
  box-sizing: border-box;
  background: var(--md-sys-color-surface-container-high);
  border: 1px solid transparent;
  border-radius: 16px;
  color: var(--md-sys-color-on-surface);
  font-family: 'Poppins', sans-serif;
  font-size: 16px;
  letter-spacing: 2px;
  transition: all 0.2s ease;
}

.field input[type="file"] {
  color: var(--md-sys-color-on-surface-variant);
  font-size: 13px;
}

.field input[type="text"]:focus {
  outline: none;
  border-color: var(--md-sys-color-primary);
}

.field input::placeholder {
  color: var(--md-sys-color-outline);
}

.btn-primary {
  width: 100%;
  padding: 14px 24px;
  background: var(--md-sys-color-primary);
  color: var(--md-sys-color-on-primary);
  border: none;
  border-radius: 28px;
  font-family: 'Poppins', sans-serif;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.1s;
}

.btn-primary:hover {
  opacity: 0.9;
}

.btn-primary:active {
  transform: scale(0.98);
}

.error {
  color: var(--md-sys-color-error);
  font-size: 12px;
  margin-top: 4px;
  margin-left: 4px;
}

html::-webkit-scrollbar {
  display: none;
}
</style>
<link rel="stylesheet" href="/desktop/assets/material-you.css">
<script src="/desktop/assets/monet-engine.js"></script>
</head>
<body>

<div class="container">
  <div class="card-group">
    <div class="field">
      <label for="code">Enter the 6-digit verification code sent to your email</label>
      <input type="text" id="code" placeholder="123456" maxlength="6">
      <div id="error" class="error"></div>
    </div>

    <div class="field">
      <label for="avatar">Optional: Upload your avatar (PNG or JPG)</label>
      <input type="file" id="avatar" accept="image/png,image/jpeg">
    </div>
  </div>

  <button class="btn-primary" onclick="verifyCode()">Verify Code</button>
</div>

<script>
async function verifyCode() {
  const code = document.getElementById('code').value.trim();
  const avatarFile = document.getElementById('avatar').files[0];
  const errorDiv = document.getElementById('error');

  if (!code || code.length !== 6) {
    errorDiv.textContent = 'Please enter a valid 6-digit code.';
    return;
  }

  errorDiv.textContent = '';

  if (avatarFile) {
    const formData = new FormData();
    formData.append('avatar', avatarFile);

    try {
      const uploadResponse = await fetch('/upload-avatar', {
        method: 'POST',
        body: formData
      });

      if (!uploadResponse.ok) {
        throw new Error('Upload failed (' + uploadResponse.status + ')');
      }

      const contentType = uploadResponse.headers.get('content-type');
      if (!contentType || !contentType.includes('application/json')) {
        throw new Error('Server response is not JSON');
      }

      const uploadData = await uploadResponse.json();
      if (!uploadData.success) {
        throw new Error(uploadData.error || 'Upload error');
      }

    } catch (err) {
      errorDiv.textContent = 'Error uploading avatar: ' + err.message;
      return;
    }
  }

  fetch('/verify-code', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ code })
  })
  .then(async response => {
    const data = await response.json();
    if (data.success) {
      window.location.href = 'youafter.html';
    } else {
      errorDiv.textContent = data.error || 'Invalid code.';
    }
  })
  .catch(err => {
    errorDiv.textContent = 'Error verifying code: ' + err.message;
  });
}
</script>

</body>
</html>
