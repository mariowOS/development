<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"/>
  <link rel="stylesheet" href="/desktop/assets/material-you.css">
  <script src="/desktop/assets/monet-engine.js"></script>

<style>
:root {
    /* Lasciamo le variabili pronte per essere popolate dinamicamente da monet-engine */
    --m3-accent-active: #3584e4; /* Fallback dinamico */
    --m3-accent-on-active: #ffffff;
    --md-sys-color-background: #141218;
    --md-sys-color-surface: rgba(29, 27, 32, 0.65);
    --md-sys-color-surface-container: rgba(255, 255, 255, 0.06);
    --md-sys-color-surface-container-high: rgba(255, 255, 255, 0.12);
    --md-sys-color-on-surface: #e6e0e9;
    --md-sys-color-on-surface-variant: #cac4d0;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: radial-gradient(circle at 80% 20%, rgba(35, 40, 45, 0.5) 0%, rgba(15, 15, 18, 0.95) 100%);
    color: var(--md-sys-color-on-surface);
    display: flex;
    height: 100vh;
    overflow: hidden;
    overscroll-behavior: none; 
  }

  /* Material You Sidebar Style with Glassmorphism */
  .sidebar {
    width: 320px;
    background: var(--md-sys-color-surface);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    overflow-y: auto;
    border-right: 1px solid var(--m3-glass-border);
  }

  .sidebar::-webkit-scrollbar {
    width: 4px;
  }
  
  .sidebar::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.2);
    border-radius: 10px;
  }

  .sidebar-header {
    padding: 0 12px;
  }

  .sidebar h1 {
    margin: 0;
    font-size: 24px;
    font-weight: 800;
    color: var(--md-sys-color-on-surface);
  }

  /* Material 3 Search Bar */
  .search {
    width: 100%;
  }

  .search-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }

  .search-wrapper .material-symbols-outlined {
    position: absolute;
    left: 14px;
    color: var(--md-sys-color-on-surface-variant);
    font-size: 20px;
  }

  .search input {
    width: 100%;
    padding: 12px 16px 12px 44px;
    border-radius: 28px;
    border: 1px solid transparent;
    outline: none;
    background: var(--md-sys-color-surface-container);
    color: var(--md-sys-color-on-surface);
    font-family: inherit;
    font-size: 14px;
    transition: all 0.2s ease;
  }

  .search input:focus {
    background: var(--md-sys-color-surface-container-high);
    border-color: var(--m3-accent-active);
    box-shadow: 0 0 0 1px var(--m3-accent-active);
  }

  .search input::placeholder {
    color: var(--md-sys-color-on-surface-variant);
  }

  /* Material 3 Dynamic Navigation Items */
  .menu {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .menu-item {
    background: transparent;
    padding: 12px 16px;
    border-radius: 28px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s, transform 0.15s;
    display: flex;
    align-items: center;
    gap: 16px;
    user-select: none;
  }

  .menu-item:hover {
    background: var(--md-sys-color-surface-container);
  }

.menu-item.active {
    background: var(--m3-accent-active) !important;
    color: var(--m3-accent-on-active) !important;
  }

  .menu-item.active .icon,
  .menu-item.active .title {
    color: var(--m3-accent-on-active) !important;
    font-weight: 600;
  }

  .menu-item.active .subtitle {
    color: var(--m3-accent-on-active) !important;
    opacity: 0.8;
  }

  .menu-item .text-group {
    display: flex;
    flex-direction: column;
  }

  .menu-item .title {
    font-weight: 500;
    font-size: 14px;
    color: var(--md-sys-color-on-surface);
    transition: color 0.2s;
  }

  .menu-item.active .title {
    color: var(--m3-accent-on-active);
    font-weight: 600;
  }

  .menu-item .subtitle {
    font-size: 12px;
    color: var(--md-sys-color-on-surface-variant);
    transition: color 0.2s;
  }

  .menu-item.active .subtitle {
    color: rgba(5, 33, 30, 0.75);
  }

  /* Main Content Area */
  .content {
    flex: 1;
    padding: 32px;
    overflow: hidden !important;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    position: relative;
    background: transparent;
  }

  .content iframe {
    width: 100%;
    height: 100% !important;
    border: none;
    display: block;
    overflow: hidden !important;
  }

  .popup-frame {
    width: 100%;
    border: none;
    background: transparent;
    display: block;
    overflow: hidden !important;
  }

  .content h2 {
    margin-top: 0;
    margin-bottom: 20px;
    font-size: 28px;
    font-weight: 800;
    color: var(--md-sys-color-on-surface);
  }

  .placeholder-view {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--md-sys-color-on-surface-variant);
  }

  .placeholder-view h3 {
    font-weight: 400;
    font-size: 20px;
    margin: 0;
    color: var(--md-sys-color-outline);
  }

  /* Draggable window fix */
  .window {
    position: absolute;
    will-change: transform;
  }
  
  a {
    text-decoration: none;
    color: var(--m3-accent-active);
  }

  html::-webkit-scrollbar {
    display: none;
  }
</style>
</head>
<body>

  <!-- Material You Navigation Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h1>Settings</h1>
    </div>

    <div class="search">
      <div class="search-wrapper">
        <span class="material-symbols-outlined">search</span>
        <input type="text" placeholder="Search settings...">
      </div>
    </div>

    <div class="menu">
      <div class="menu-item active" onclick="loadPage('you', this)">
        <span class="material-symbols-outlined icon">person</span>
        <div class="text-group">
          <div class="title">You</div>
          <div class="subtitle">Your profile & account</div>
        </div>
      </div>

      <div class="menu-item" onclick="loadPage('wallpaper', this)">
        <span class="material-symbols-outlined icon">palette</span>
        <div class="text-group">
          <div class="title">Wallpaper & style</div>
          <div class="subtitle">Background, icons, colors</div>
        </div>
      </div>

      <div class="menu-item" onclick="loadPage('functions', this)">
        <span class="material-symbols-outlined icon">science</span>
        <div class="text-group">
          <div class="title">Functions lab</div>
          <div class="subtitle">Experimental features</div>
        </div>
      </div>

      <div class="menu-item" onclick="loadPage('system', this)">
        <span class="material-symbols-outlined icon">settings</span>
        <div class="text-group">
          <div class="title">System</div>
          <div class="subtitle">Rules, time, reset</div>
        </div>
      </div>

      <div class="menu-item" onclick="loadPage('updater', this)">
        <span class="material-symbols-outlined icon">update</span>
        <div class="text-group">
          <div class="title">Updater</div>
          <div class="subtitle">Software updates</div>
        </div>
      </div>

      <div class="menu-item" onclick="loadPage('about', this)">
        <span class="material-symbols-outlined icon">info</span>
        <div class="text-group">
          <div class="title">About</div>
          <div class="subtitle">System information </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Content Container -->
  <div class="content" id="content">
    <div class="placeholder-view">
      <h3>What's cooking, good looking?</h3>
    </div>
  </div>

<script> 
  // Page Display Logic
  const pages = {
    you: `
      <h2>mariowOS Profile</h2>
      <iframe src="assets/you.html" class="popup-frame"></iframe>
    `,
    wallpaper: `
      <h2>Wallpaper & style</h2>
      <iframe src="assets/wallpaper.html" class="popup-frame"></iframe>
    `,
    functions: `
      <h2>Functions lab</h2>
      <iframe src="assets/lab.html" class="popup-frame"></iframe>
    `,
    system: `
      <h2>System</h2>
      <iframe src="assets/systemsettings.html" class="popup-frame"></iframe>
    `,
    updater: `
      <h2>Updater</h2>
      <iframe src="assets/update-mirror-2.html" class="popup-frame"></iframe>
    `,
    about: `
      <iframe src="assets/about.html" class="popup-frame" scrolling="no"></iframe>
    `
  };

  function loadPage(page, el) {
    document.getElementById("content").innerHTML = pages[page];

    if (page === "you") {
      setTimeout(loadProfileEditor, 50);
    }

    document.querySelectorAll(".menu-item").forEach(item => item.classList.remove("active"));
    if (el) el.classList.add("active");
  }

  // Search filtering logic
  const searchInput = document.querySelector(".search input");
  const menuItems = document.querySelectorAll(".menu-item");

  searchInput.addEventListener("input", () => {
    const query = searchInput.value.toLowerCase();
    let firstMatch = null;

    menuItems.forEach(item => {
      const title = item.querySelector(".title").textContent.toLowerCase();
      const subtitle = item.querySelector(".subtitle").textContent.toLowerCase();

      if (title.includes(query) || subtitle.includes(query)) {
        item.style.display = "flex";
        if (!firstMatch) firstMatch = item;
      } else {
        item.style.display = "none";
      }
    });

    if (firstMatch) {
      const page = firstMatch.getAttribute("onclick").match(/'([^']+)'/)[1];
      loadPage(page, firstMatch);
    }
  });

  // Profile functions
  function saveProfile() {
    const username = document.getElementById("usernameInput")?.value.trim();
    const password = document.getElementById("passwordInput")?.value.trim();
    const pfpFile = document.getElementById("pfpUpload")?.files[0];

    if (username) localStorage.setItem("username", username);
    if (password) localStorage.setItem("password", password);

    if (pfpFile) {
      const reader = new FileReader();
      reader.onload = () => {
        localStorage.setItem("avatar", reader.result);
        const pfpPreview = document.getElementById("pfpPreview");
        if (pfpPreview) pfpPreview.src = reader.result;
      };
      reader.readAsDataURL(pfpFile);
    }

    alert("Profile saved!");
  }

  function loadProfileEditor() {
    const savedUsername = localStorage.getItem("username");
    const savedPassword = localStorage.getItem("password");
    const savedAvatar = localStorage.getItem("avatar");

    const usernameInput = document.getElementById("usernameInput");
    const passwordInput = document.getElementById("passwordInput");
    const pfpPreview = document.getElementById("pfpPreview");

    if (savedUsername && usernameInput) usernameInput.value = savedUsername;
    if (savedPassword && passwordInput) passwordInput.value = savedPassword;
    if (savedAvatar && pfpPreview) pfpPreview.src = savedAvatar;
  }

  function saveFromSettings() {
    const newUser = document.getElementById("settingsUsername")?.value.trim();
    const newPass = document.getElementById("settingsPassword")?.value.trim();

    if (!newUser || !newPass) {
      alert("Fields cannot be empty!");
      return;
    }

    localStorage.setItem("username", newUser);
    localStorage.setItem("password", newPass);

    alert("Credentials updated!");
  }

  window.addEventListener('message', (e) => {
  if (e.data && (e.data.type === 'monet-update' || e.data.type === 'theme-update')) {
    if (e.data.accent) {
      document.documentElement.style.setProperty('--m3-accent-active', e.data.accent);
    }
    if (e.data.onAccent) {
      document.documentElement.style.setProperty('--m3-accent-on-active', e.data.onAccent);
    }
  }
});
</script>

</body>
</html>
