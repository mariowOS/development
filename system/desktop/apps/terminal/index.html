<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/desktop/assets/material-you.css">
  <script src="/desktop/assets/monet-engine.js"></script>
  <style>
    @font-face {
      font-family: 'Unifont Ex Mono';
      src: url('unifont-ex-mono.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Unifont Ex Mono', monospace !important;
      color: #fff;
    }

    html, body {
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    .terminal {
      padding: 20px;
      font-size: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      height: 100vh;
      overflow-y: auto;
      user-select: none;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .terminal::-webkit-scrollbar {
      display: none;
    }

    .user {
      color: #00ff00;
    }

    .cursor {
      display: inline-block;
      width: 8px;
      height: 18px;
      background: #00ff00;
      margin-left: 2px;
      vertical-align: middle;
    }

    ::selection {
      background: #fff;
      color: #000;
    }

    /* dmgr UI Overlay styles */
    #dmgr-overlay {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #7bd2fa; 
      z-index: 1000;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    .dmgr-window {
      background: #c0c0c0;
      box-shadow: 8px 8px 0px #000;
      padding: 30px;
      width: 500px;
      text-align: center;
    }

    .dmgr-title {
      color: #fff;
      margin-bottom: 40px;
    }

    .dmgr-title.red {
      color: #ff0000;
      font-weight: bold;
    }

    .dmgr-subtitle {
      color: #8a2be2; 
      font-weight: bold;
      margin-bottom: 10px;
    }

    .dmgr-text {
      color: #fff;
      margin-bottom: 5px;
    }

    .dmgr-list {
      text-align: left;
      display: inline-block;
      margin-bottom: 40px;
    }

    .dmgr-item {
      color: #fff;
      padding: 5px;
    }

    .dmgr-item.focused {
      background: rgba(255,255,255,0.2);
    }

    .dmgr-item span.star {
      color: #ff0000;
    }

    .dmgr-buttons {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .dmgr-btn {
      color: #fff;
      padding: 5px 15px;
    }

    .dmgr-btn.focused {
      background: rgba(255,255,255,0.3);
    }
  </style>
</head>
<body>
  <div class="terminal" id="terminal" tabindex="0"></div>

  <!-- DMGR TUI -->
  <div id="dmgr-overlay">
    <!-- Screen 1: Selection -->
    <div class="dmgr-window" id="dmgr-screen1">
      <div class="dmgr-title">Installed desktops</div>
      <div class="dmgr-list" id="dmgr-desktop-list"></div>
      <div class="dmgr-buttons">
        <div class="dmgr-btn" id="dmgr-btn-ok">[ OK ]</div>
      </div>
    </div>
    
    <!-- Screen 2: Confirmation -->
    <div class="dmgr-window" id="dmgr-screen2" style="display:none;">
      <div class="dmgr-title red">!! SWITCHING DE !!</div>
      <div class="dmgr-subtitle">SUMMARY:</div>
      <div class="dmgr-text" id="dmgr-summary-text"></div>
      <div class="dmgr-text">com.mariowos.loginui -> unchanged</div>
      <div class="dmgr-buttons" style="margin-top: 40px;">
        <div class="dmgr-btn" id="dmgr-btn-no">[ NO ]</div>
        <div class="dmgr-btn" id="dmgr-btn-yes">[ YES ]</div>
      </div>
    </div>
  </div>

  <script>
    const terminal = document.getElementById("terminal");
    const dmgrOverlay = document.getElementById("dmgr-overlay");

    let inputBuffer = "";
    let cursorVisible = true;
    let history = [];
    let historyIndex = -1;

    let currentInput, currentCursor;
    let sysUsername = "user";

    // DMGR State Machine
    let dmgrActive = false;
    let dmgrScreen = 1;
    let availableDEs = [];
    let selectedDEIndex = 0; 
    let focusIndex = 0; 
    let confirmFocusIndex = 0; 
    let currentActiveDE = "com.mariowos.desktop.html";

    // Installer State
    window.awaitingLicenseConfirm = false;
    window.pendingInstallApp = null;
    window.awaitingUpgradeConfirm = false;
    window.awaitingTilesSwitchConfirm = false;

    fetch("/get-settings")
      .then(res => res.json())
      .then(config => {
        if (config.username) sysUsername = config.username.toLowerCase().replace(/\s+/g, '');
        newPrompt();
      })
      .catch(() => newPrompt());

    setInterval(() => {
      if (currentCursor) currentCursor.style.visibility = cursorVisible ? "visible" : "hidden";
      cursorVisible = !cursorVisible;
    }, 500);

    terminal.addEventListener("click", () => {
      if (!dmgrActive) terminal.focus();
    });
    window.addEventListener("click", () => {
      if (!dmgrActive) terminal.focus();
    });

    document.addEventListener("keydown", (e) => {
      if (dmgrActive) {
        e.preventDefault();
        if (dmgrScreen === 1) {
          if (e.key === "ArrowDown") focusIndex = Math.min(focusIndex + 1, availableDEs.length);
          if (e.key === "ArrowUp") focusIndex = Math.max(focusIndex - 1, 0);
          
          if (e.key === "Enter" || e.key === " ") {
            if (focusIndex < availableDEs.length) {
              selectedDEIndex = focusIndex;
            } else {
              showDmgrScreen2();
            }
          }
          renderDmgr1();
        } else if (dmgrScreen === 2) {
          if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
            confirmFocusIndex = confirmFocusIndex === 0 ? 1 : 0;
          }
          if (e.key === "Enter" || e.key === " ") {
            if (confirmFocusIndex === 1) {
              if (availableDEs[selectedDEIndex] === currentActiveDE) {
                closeDmgr("dmgr: No changes made. Target DE is already active.");
              } else {
                dmgrActive = false;
                dmgrOverlay.style.display = "none";
                window.parent.location.href = `/desktop/${availableDEs[selectedDEIndex]}`;
              }
            } else {
              closeDmgr("dmgr: Operation cancelled.");
            }
          }
          renderDmgr2();
        }
        return;
      }

      if (["Backspace", "Enter", "ArrowUp", "ArrowDown"].includes(e.key) || (e.key.length === 1 && !e.ctrlKey && !e.metaKey)) {
        e.preventDefault();
      }

      if (!currentInput) return;

      if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
        inputBuffer += e.key;
      } else if (e.key === "Backspace") {
        inputBuffer = inputBuffer.slice(0, -1);
      } else if (e.key === "Enter") {
        const cmd = inputBuffer.trim();
        executeCommand(cmd);
        
        if (cmd && !window.awaitingUpgradeConfirm && !window.awaitingLicenseConfirm && !window.awaitingTilesSwitchConfirm) {
          history.push(cmd);
          historyIndex = history.length;
        }
        inputBuffer = "";
        return;
      } else if (e.key === "ArrowUp") {
        if (historyIndex > 0) { historyIndex--; inputBuffer = history[historyIndex]; }
      } else if (e.key === "ArrowDown") {
        if (historyIndex < history.length - 1) { historyIndex++; inputBuffer = history[historyIndex]; }
        else { historyIndex = history.length; inputBuffer = ""; }
      }

      currentInput.textContent = inputBuffer;
      terminal.scrollTop = terminal.scrollHeight;
    });

    function newPrompt(prefix = null) {
      const pfx = prefix !== null ? prefix : `<span class="user">${sysUsername}@mariowos</span>:$ `;
      const line = document.createElement("div");
      line.innerHTML = `${pfx}<span class="input"></span><span class="cursor"></span>`;
      terminal.appendChild(line);
      terminal.scrollTop = terminal.scrollHeight;
      currentInput = line.querySelector(".input");
      currentCursor = line.querySelector(".cursor");
      inputBuffer = "";
    }

    // --- DMGR UI FUNCTIONS ---
    function launchDmgr() {
      dmgrActive = true;
      dmgrScreen = 1;
      focusIndex = 0;
      selectedDEIndex = 0;
      
      try {
        const parentUrl = window.parent.location.pathname;
        const currentFile = parentUrl.substring(parentUrl.lastIndexOf('/') + 1);
        if (currentFile) currentActiveDE = currentFile;
      } catch(e) {}

      fetch("/api/system/desktops")
        .then(res => res.json())
        .then(data => {
          availableDEs = data.desktops || ["com.mariowos.desktop.html"];
          const foundIdx = availableDEs.indexOf(currentActiveDE);
          if(foundIdx !== -1) selectedDEIndex = foundIdx;
          
          dmgrOverlay.style.display = "flex";
          document.getElementById("dmgr-screen1").style.display = "block";
          document.getElementById("dmgr-screen2").style.display = "none";
          renderDmgr1();
        })
        .catch(() => {
          closeDmgr("E: Failed to read desktop environments.");
        });
    }

    function renderDmgr1() {
      const listDiv = document.getElementById("dmgr-desktop-list");
      listDiv.innerHTML = "";
      availableDEs.forEach((de, idx) => {
        const item = document.createElement("div");
        item.className = "dmgr-item" + (focusIndex === idx ? " focused" : "");
        const star = selectedDEIndex === idx ? `<span class="star">*</span>` : ` `;
        item.innerHTML = `[ ${star} ] ${de.replace('.html','')}`;
        listDiv.appendChild(item);
      });
      const okBtn = document.getElementById("dmgr-btn-ok");
      if (focusIndex === availableDEs.length) okBtn.classList.add("focused");
      else okBtn.classList.remove("focused");
    }

    function showDmgrScreen2() {
      dmgrScreen = 2;
      confirmFocusIndex = 0;
      document.getElementById("dmgr-screen1").style.display = "none";
      document.getElementById("dmgr-screen2").style.display = "block";
      
      const oldDE = currentActiveDE.replace('.html','');
      const newDE = availableDEs[selectedDEIndex].replace('.html','');
      document.getElementById("dmgr-summary-text").innerText = `${oldDE} -> ${newDE}`;
      
      renderDmgr2();
    }

    function renderDmgr2() {
      document.getElementById("dmgr-btn-no").className = "dmgr-btn" + (confirmFocusIndex === 0 ? " focused" : "");
      document.getElementById("dmgr-btn-yes").className = "dmgr-btn" + (confirmFocusIndex === 1 ? " focused" : "");
    }

    function closeDmgr(msg = "dmgr: Operation cancelled.") {
      dmgrActive = false;
      dmgrOverlay.style.display = "none";
      const out = document.createElement("div");
      out.innerText = msg;
      terminal.appendChild(out);
      newPrompt();
    }

    // --- INSTALL HELPER ---
    function executeInstall(app) {
      const queueDiv = document.createElement("div");
      queueDiv.innerText = `${app.id} is queued to be installed...`;
      terminal.appendChild(queueDiv); terminal.scrollTop = terminal.scrollHeight;

      setTimeout(() => {
        const fetchDiv = document.createElement("div");
        fetchDiv.innerText = `Fetching package ${app.id}...`;
        terminal.appendChild(fetchDiv); terminal.scrollTop = terminal.scrollHeight;

        fetch("/api/store/install", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ appId: app.id, title: app.title, icon: app.icon, repoUrl: app.repoUrl })
        })
        .then(res => res.json())
        .then(installRes => {
          const resDiv = document.createElement("div");
          if (installRes.success) {
            resDiv.innerText = `Unpacking ${app.id}...\nSetting up ${app.id}...\nAdding package to app list...\n${app.id} installed successfully.\n`;
            terminal.appendChild(resDiv); terminal.scrollTop = terminal.scrollHeight;
            
            // Special terminal prompt ONLY if the package is 'tiles'
            if (app.id === "tiles") {
              window.awaitingTilesSwitchConfirm = true;
              newPrompt("Do you want to switch to Tiles DE right now? [Y/n] ");
            } else {
              window.parent.postMessage({
                type: 'app-installed-live',
                app: { appId: app.id, title: app.title, icon: app.icon, url: `apps/${app.id}/index.html` }
              }, '*');
              newPrompt();
            }
          } else {
            resDiv.innerText = `E: Sub-process returned an error code: ${installRes.error}`;
            terminal.appendChild(resDiv); terminal.scrollTop = terminal.scrollHeight;
            newPrompt();
          }
        });
      }, 800);
    }

    // --- EULA PROMPT HELPER ---
    function showTerminalEula(app, eulaText) {
      window.pendingInstallApp = app;
      window.awaitingLicenseConfirm = true;
      
      const licDiv = document.createElement("div");
      licDiv.innerText = `\n== ${app.title.toUpperCase()} END USER LICENSE AGREEMENT ==\n\n${eulaText}\n`;
      terminal.appendChild(licDiv);
      terminal.scrollTop = terminal.scrollHeight;
      
      newPrompt("Do you agree to the terms to continue? [y/N] ");
    }

    // --- TERMINAL EXECUTION ---
    function executeCommand(cmd) {
      
      if (window.awaitingTilesSwitchConfirm) {
        window.awaitingTilesSwitchConfirm = false;
        const ans = cmd.toLowerCase().trim();
        const ansLine = document.createElement("div");
        ansLine.innerText = ans; terminal.appendChild(ansLine);

        if (ans === 'y' || ans === 'yes' || ans === '') {
          const swDiv = document.createElement("div");
          swDiv.innerText = `Switching DE immediately...`;
          terminal.appendChild(swDiv); terminal.scrollTop = terminal.scrollHeight;
          setTimeout(() => {
             window.parent.location.href = `/desktop/com.mariowos.tiles.html`;
          }, 500);
        } else {
          const abDiv = document.createElement("div");
          abDiv.innerText = `Switch cancelled. You can use 'dmgr' to switch later.`;
          terminal.appendChild(abDiv); terminal.scrollTop = terminal.scrollHeight;
          newPrompt();
        }
        return;
      }

      if (window.awaitingUpgradeConfirm) {
        window.awaitingUpgradeConfirm = false;
        const ans = cmd.toLowerCase().trim();
        const ansLine = document.createElement("div");
        ansLine.innerText = ans; terminal.appendChild(ansLine);

        if (ans === 'y' || ans === 'yes' || ans === '') {
          const upgDiv = document.createElement("div");
          upgDiv.innerText = `Fetching updates...\nUpgrading packages...`;
          terminal.appendChild(upgDiv); terminal.scrollTop = terminal.scrollHeight;
          fetch("/api/store/do-upgrade", { method: "POST" })
            .then(res => res.json())
            .then(data => {
               const d = document.createElement("div");
               if (data.success) d.innerText = `Upgrade complete. ${data.count} packages updated.`;
               else d.innerText = `E: ${data.error}`;
               terminal.appendChild(d); terminal.scrollTop = terminal.scrollHeight;
               newPrompt();
            });
        } else {
          const abDiv = document.createElement("div");
          abDiv.innerText = `Abort.`;
          terminal.appendChild(abDiv); terminal.scrollTop = terminal.scrollHeight;
          newPrompt();
        }
        return;
      }

      if (window.awaitingLicenseConfirm) {
        window.awaitingLicenseConfirm = false;
        const ans = cmd.toLowerCase().trim();
        const ansLine = document.createElement("div");
        ansLine.innerText = ans; terminal.appendChild(ansLine);

        if (ans === 'y' || ans === 'yes') {
          executeInstall(window.pendingInstallApp);
        } else {
          const abDiv = document.createElement("div");
          abDiv.innerText = `Installation aborted by user.`;
          terminal.appendChild(abDiv); terminal.scrollTop = terminal.scrollHeight;
          newPrompt();
        }
        return;
      }

      if (!cmd) return newPrompt();

      const outputLine = document.createElement("div");
      const args = cmd.split(" ");
      const rootCmd = args[0];

      switch (rootCmd) {
        case "dmgr":
          launchDmgr();
          return;

        case "help":
          outputLine.innerText = `Commands:
        help - Show help                          addkey - adds a key into the system's keyring
        about - About this terminal               delkey - deletes a key from the system's keyring
        clear - Clear the screen                  listkeys - list all the keys in the system's keyring 
        echo [text] - Print a message             fetch - show system information
        math [expr] - Simple math calculator      lili - show lili command
        dmgr - Desktop Manager                    get [cmd] - mariowOS package manager`;
          terminal.appendChild(outputLine);
          break;

        case "about":
          outputLine.innerText = `mariowOS Terminal (preview) - (C) 2026 mariowstech and the mariowOS team`;
          terminal.appendChild(outputLine);
          break;

        case "clear":
          terminal.innerHTML = "";
          newPrompt();
          return;

        case "echo":
          outputLine.innerText = cmd.slice(5);
          terminal.appendChild(outputLine);
          break;

        case "math":
          try {
            const expr = cmd.slice(5);
            const result = eval(expr);
            outputLine.innerText = `${expr} = ${result}`;
          } catch {
            outputLine.innerText = "E: Invalid expression, check syntax.";
          }
          terminal.appendChild(outputLine);
          break;

        case "lili":
          outputLine.innerText = `lili ti amo!!!`;
          terminal.appendChild(outputLine);
          break;

        case "addkey":
          const keyValue = cmd.slice(7).trim();
          if (!keyValue) {
            outputLine.innerText = "E: Please specify a key to add.";
            terminal.appendChild(outputLine);
            return newPrompt(); 
          }
        
          fetch("/save-key", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ key: keyValue }),
          })
            .then((res) => res.text())
            .then((msg) => {
              const resultLine = document.createElement("div");
              resultLine.innerText = msg;
              terminal.appendChild(resultLine);
              newPrompt(); 
            })
            .catch(() => {
              const errLine = document.createElement("div");
              errLine.innerText = "E: Failed to save key.";
              terminal.appendChild(errLine);
              newPrompt(); 
            });
          return;

        case "listkeys":
          fetch("/list-keys")
            .then((res) => res.json())
            .then((keys) => {
              const listOutput = document.createElement("div");
              if (keys.length === 0) {
                listOutput.innerText = "No keys saved.";
              } else {
                listOutput.innerText =
                  "== Saved Keys ==\n" +
                  keys
                    .map(
                      (k, i) =>
                        `${i + 1}. ${k.key} (added ${new Date(k.date).toLocaleString()})`
                    )
                    .join("\n");
              }
              terminal.appendChild(listOutput);
              newPrompt(); 
            })
            .catch(() => {
              const errLine = document.createElement("div");
              errLine.innerText = "E: Failed to list keys.";
              terminal.appendChild(errLine);
              newPrompt(); 
            });
          return;
        
        case "delkey":
          const keyToDelete = cmd.slice(7).trim();
          if (!keyToDelete) {
            outputLine.innerText = "E: Please specify a key to delete.";
            terminal.appendChild(outputLine);
            return newPrompt(); 
          }
        
          fetch("/delete-key", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ key: keyToDelete }),
          })
            .then((res) => res.text())
            .then((msg) => {
              const resultLine = document.createElement("div");
              resultLine.innerText = msg;
              terminal.appendChild(resultLine);
              newPrompt(); 
            })
            .catch(() => {
              const errLine = document.createElement("div");
              errLine.innerText = "E: Failed to delete key.";
              terminal.appendChild(errLine);
              newPrompt(); 
            });
          return;
        
        case "fetch":
          fetch("/sysinfo")
            .then((res) => res.json())
            .then((info) => {
              if (info.error) throw new Error(info.error);
        
              const hours = Math.floor(info.Uptime / 3600);
              const minutes = Math.floor((info.Uptime % 3600) / 60);
        
              const fetchOutput = document.createElement("div");
              fetchOutput.innerText = `                    
    @@@@@                            ┌──────────Basic Info──────────┐
 @@@@@@@@@@@      @@@@@@             OS: mariowOS PRE-RELEASE 1 (Insiders)   
    @@@@@         @@@@@@             Uptime: ${hours}h ${minutes}m
     @@@         @@@@@@@@            CPU: ${info.CPU}
              @@@@@@@@@@@@@@         RAM: ${info.RAM} (Free: ${info.FreeRAM})
          @@@@@@@@@@@@@@@@@@@@@@     Engine: Lillium Engine 
        @@@@@@@@@@@@@@@@@@@@@@@@@@   
           @@@@@@@@@@@@@@@@@@@@      ┌──────────Shell Info──────────┐
               @@@@@@@@@@@@          Shell: mariowOS DE (Tiles) v1.5
                 @@@@@@@@            Build number/date: v1.0 06/09/2026 17:57PM
       @@         @@@@@@             Kernel: 0.4-node (mwos@mariowos) 
      @@@@@        @@@@              
   @@@@@@@@@@@                       © mariowstech and the mariowOS team
      @@@@@                          All rights reserved.                           
`;
              terminal.appendChild(fetchOutput);
              terminal.scrollTop = terminal.scrollHeight;
        
              newPrompt();
            })
            .catch(() => {
              const errLine = document.createElement("div");
              errLine.innerText = "E: Failed to fetch system info.";
              terminal.appendChild(errLine);
              newPrompt();
            });
          return;

        case "get":
          const subCmd = args[1];
          const targetApp = args[2];

          if (!subCmd) {
            outputLine.innerText = `get: package manager for mariowOS\nUsage:\n  get list            - List all available packages\n  get install [pkg]   - Download and install a package\n  get remove [pkg]    - Remove an installed package\n  get update          - Update local package indexes\n  get upgrade         - Upgrade all installed packages`;
            terminal.appendChild(outputLine); return newPrompt(); 
          }

          if (subCmd === "list") {
            fetch("/api/store/catalog").then(r=>r.json()).then(cat=>{
              let out = "== Available Packages ==\n\n";
              cat.forEach(app => out += `${app.id.padEnd(20)} - ${app.title}\n`);
              const d = document.createElement("div"); d.innerText = out;
              terminal.appendChild(d); terminal.scrollTop = terminal.scrollHeight; newPrompt();
            }); return;
          }

          if (subCmd === "install") {
            if (!targetApp) {
              outputLine.innerText = "E: You must specify a package to install.";
              terminal.appendChild(outputLine); return newPrompt();
            }

            outputLine.innerText = `Searching for package ${targetApp}...`;
            terminal.appendChild(outputLine); terminal.scrollTop = terminal.scrollHeight;

            fetch("/api/store/catalog").then(r=>r.json()).then(catalog => {
              const app = catalog.find(a => a.id === targetApp);
              if (!app) {
                const errDiv = document.createElement("div");
                errDiv.innerText = `E: Package '${targetApp}' not found.`;
                terminal.appendChild(errDiv); return newPrompt();
              }
              
              if (app.eula) {
                showTerminalEula(app, app.eula);
                return;
              }

              const chkDiv = document.createElement("div");
              chkDiv.innerText = `Checking package agreements...`;
              terminal.appendChild(chkDiv); terminal.scrollTop = terminal.scrollHeight;

              fetch("/api/store/eula", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ repoUrl: app.repoUrl })
              }).then(res => res.json()).then(data => {
                if (data.eula) {
                  showTerminalEula(app, data.eula);
                } else {
                  const skipDiv = document.createElement("div");
                  skipDiv.innerText = `No EULA required. Proceeding with installation...`;
                  terminal.appendChild(skipDiv); terminal.scrollTop = terminal.scrollHeight;
                  executeInstall(app);
                }
              });

            }).catch(() => {
              const errDiv = document.createElement("div");
              errDiv.innerText = "E: Network error while fetching catalog.";
              terminal.appendChild(errDiv); return newPrompt();
            });
            return;
          }

          if (subCmd === "remove") {
            if (!targetApp) {
              outputLine.innerText = "E: You must specify a package to remove.";
              terminal.appendChild(outputLine); return newPrompt();
            }
            outputLine.innerText = `Searching for package ${targetApp}...`;
            terminal.appendChild(outputLine); terminal.scrollTop = terminal.scrollHeight;

            fetch("/get-settings").then(r=>r.json()).then(config => {
              const installedApps = config.installedApps || [];
              if (!installedApps.find(a => a.appId === targetApp)) {
                const errDiv = document.createElement("div");
                errDiv.innerText = `E: Package '${targetApp}' is not installed.`;
                terminal.appendChild(errDiv); return newPrompt();
              }
              const rmDiv = document.createElement("div"); rmDiv.innerText = `Removing ${targetApp}...`;
              terminal.appendChild(rmDiv); terminal.scrollTop = terminal.scrollHeight;

              fetch("/api/store/uninstall", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ appId: targetApp }) })
              .then(r=>r.json()).then(data => {
                const resDiv = document.createElement("div");
                if (data.success) { resDiv.innerText = `${targetApp} removed successfully.`; window.parent.postMessage({ type: 'app-uninstalled-live', appId: targetApp }, '*'); }
                else resDiv.innerText = `E: Could not remove package: ${data.error}`;
                terminal.appendChild(resDiv); terminal.scrollTop = terminal.scrollHeight; newPrompt();
              });
            }); return;
          }

          if (subCmd === "update") {
            outputLine.innerText = `Fetching catalog...`; terminal.appendChild(outputLine);
            fetch("/api/store/update").then(r=>r.json()).then(data => {
              setTimeout(() => { 
                const updDiv = document.createElement("div"); updDiv.innerText = `Updating catalog...`; terminal.appendChild(updDiv);
                setTimeout(() => {
                  const doneDiv = document.createElement("div");
                  if (data.success) doneDiv.innerText = `\nDone. ${data.addedCount} new packages added to local repository.`;
                  else doneDiv.innerText = `\nE: ${data.error}`;
                  terminal.appendChild(doneDiv); terminal.scrollTop = terminal.scrollHeight; newPrompt();
                }, 600);
              }, 600);
            }); return;
          }

          if (subCmd === "upgrade") {
            outputLine.innerText = `Reading package lists...`; terminal.appendChild(outputLine);
            setTimeout(() => {
              const depDiv = document.createElement("div"); depDiv.innerText = `Building dependency tree... Done\nReading state information... Done`; terminal.appendChild(depDiv);
              setTimeout(() => {
                const calcDiv = document.createElement("div"); calcDiv.innerText = `Calculating upgrade...`; terminal.appendChild(calcDiv);
                fetch("/api/store/check-upgrades").then(r=>r.json()).then(data => {
                  const resDiv = document.createElement("div");
                  if (data.upgrades && data.upgrades.length > 0) {
                     resDiv.innerText = `The following packages will be upgraded:\n  ${data.upgrades.join(" ")}\n${data.upgrades.length} upgraded, 0 newly installed, 0 to remove.`;
                     terminal.appendChild(resDiv); terminal.scrollTop = terminal.scrollHeight;
                     window.awaitingUpgradeConfirm = true; newPrompt("Do you want to continue? [Y/n] ");
                  } else {
                     resDiv.innerText = `Done\n0 upgraded, 0 newly installed, 0 to remove and 0 not upgraded.`;
                     terminal.appendChild(resDiv); terminal.scrollTop = terminal.scrollHeight; newPrompt();
                  }
                });
              }, 500);
            }, 500); return;
          }

          outputLine.innerText = `E: Invalid operation ${subCmd}`;
          terminal.appendChild(outputLine); return newPrompt();

        default:
          outputLine.innerText = `Command not found: ${cmd}`;
          terminal.appendChild(outputLine);
      }

      terminal.scrollTop = terminal.scrollHeight;
      newPrompt();
    }
  </script>
</body>
</html>
