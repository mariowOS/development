    async function runGet(tab, args) {
      const subcommand = args[1];
      const packageId = args[2];
      if (!subcommand || subcommand === "help") { showGetHelp(tab); return; }

      if (subcommand === "list" || subcommand === "search") {
        const query = args.slice(2).join(" ").toLowerCase();
        if (subcommand === "search" && !query) throw new Error(mariowOSI18n.t("terminal.error.usage", "usage: {usage}", { usage: "get search <text>" }));
        const [catalog, installed] = await Promise.all([loadCatalog(true), installedApps().catch(() => [])]);
        const installedIds = new Set(installed.map(app => app.appId));
        const matches = catalog.filter(app => !query || String(app.id).toLowerCase().includes(query) || String(app.title || "").toLowerCase().includes(query));
        if (!matches.length) { printLine(tab, query ? mariowOSI18n.t("terminal.get.no-match", "No packages match '{query}'.", { query }) : mariowOSI18n.t("terminal.get.repo-empty", "The local repository is empty. Run 'get update'.")); return; }
        printTable(tab, subcommand === "list" ? mariowOSI18n.t("terminal.get.available-title", "Available Packages:") : mariowOSI18n.t("terminal.get.matching-title", "Packages matching '{query}':", { query }),
          [mariowOSI18n.t("terminal.table.package-id", "package ID"), mariowOSI18n.t("terminal.table.title", "title"), mariowOSI18n.t("terminal.table.status", "status")],
          matches.map(app => [app.id, app.title || "", installedIds.has(app.id) ? mariowOSI18n.t("terminal.table.installed", "installed") : ""]));
        return;
      }

      if (subcommand === "install") {
        if (!packageId) throw new Error(mariowOSI18n.t("terminal.get.specify-install", "you must specify a package to install"));
        const catalog = await loadCatalog();
        const app = catalog.find(item => item.id === packageId);
        if (!app) {
          const suggestion = closestMatch(packageId, catalog.map(item => item.id));
          throw new Error(suggestion
            ? mariowOSI18n.t("terminal.get.not-found-suggest", "package '{pkg}' not found. Did you mean '{suggestion}'?", { pkg: packageId, suggestion })
            : mariowOSI18n.t("terminal.get.not-found", "package '{pkg}' not found", { pkg: packageId }));
        }
        if ((await installedApps().catch(() => [])).some(item => item.appId === packageId)) {
          printLine(tab, mariowOSI18n.t("terminal.get.reinstall", "{pkg} is already installed: it will be reinstalled.", { pkg: packageId }), "color-gray");
        }
        return withAuth(tab, "get", () => executeInstall(app, tab));
      }

      if (subcommand === "remove") {
        if (!packageId) throw new Error(mariowOSI18n.t("terminal.get.specify-remove", "you must specify a package to remove"));
        const installed = await installedApps();
        if (!installed.some(app => app.appId === packageId)) {
          const suggestion = closestMatch(packageId, installed.map(app => app.appId));
          throw new Error(suggestion
            ? mariowOSI18n.t("terminal.get.not-installed-suggest", "package '{pkg}' is not installed. Did you mean '{suggestion}'?", { pkg: packageId, suggestion })
            : mariowOSI18n.t("terminal.get.not-installed", "package '{pkg}' is not installed", { pkg: packageId }));
        }
        return withAuth(tab, "get", async () => {
          const stop = startSpinner(tab, mariowOSI18n.t("terminal.get.removing", "Removing {pkg}...", { pkg: packageId }));
          try { await api("/api/store/uninstall", { appId: packageId }); } finally { stop(); }
          printLine(tab, mariowOSI18n.t("terminal.get.removed", "{pkg} removed successfully.", { pkg: packageId }), "color-green");
          if (IS_EMBEDDED) window.parent.postMessage({ type: "app-uninstalled-live", appId: packageId }, window.location.origin);
        });
      }

      if (subcommand === "update") {
        const stop = startSpinner(tab, mariowOSI18n.t("terminal.get.fetching", "Fetching the remote catalog..."));
        let data;
        try { data = await api("/api/store/update"); } finally { stop(); }
        await loadCatalog(true).catch(() => {});
        printLine(tab, mariowOSI18n.t("terminal.get.updated", "Done. {added} new package(s) added to the local repository ({total} total).", { added: data.addedCount, total: globalCatalog.length }), "color-green");
        return;
      }

      if (subcommand === "upgrade") {
        const stop = startSpinner(tab, mariowOSI18n.t("terminal.get.checking-upgrades", "Checking installed packages for upgrades..."));
        let data;
        try { data = await api("/api/store/check-upgrades"); } finally { stop(); }
        const upgrades = data.upgrades || [];
        if (!upgrades.length) { printLine(tab, mariowOSI18n.t("terminal.get.up-to-date", "All packages are up to date."), "color-green"); return; }
        printTable(tab, mariowOSI18n.t("terminal.get.upgradable-title", "Upgradable Packages:"), [mariowOSI18n.t("terminal.table.package-id", "package ID"), mariowOSI18n.t("terminal.table.installed", "installed"), mariowOSI18n.t("terminal.table.available", "available")], upgrades.map(item => [item.appId, item.current, item.latest]));
        return askConfirm(tab, "get", mariowOSI18n.t("terminal.get.upgrade-confirm", "Upgrade {count} package(s)? [Y/n]", { count: upgrades.length }), answer => {
          if (!isYes(answer, true)) { printLine(tab, mariowOSI18n.t("terminal.get.upgrade-cancelled", "Upgrade cancelled.")); return; }
          return withAuth(tab, "get", async () => {
            const stopUpgrade = startSpinner(tab, mariowOSI18n.t("terminal.get.upgrading", "Upgrading packages..."));
            let result;
            try { result = await api("/api/store/do-upgrade", {}); } finally { stopUpgrade(); }
            (result.updated || []).forEach(item => printLine(tab, `✔ ${item.appId} -> ${item.version}`, "color-green"));
            printLine(tab, mariowOSI18n.t("terminal.get.upgraded", "{count} of {total} package(s) upgraded.", { count: result.count, total: upgrades.length }), result.count === upgrades.length ? "color-green" : "color-yellow");
            if (result.count < upgrades.length) printLine(tab, mariowOSI18n.t("terminal.get.upgrade-git-only", "Only packages installed from a git repository can be upgraded in place; reinstall the others with 'get install'."), "color-gray");
          });
        });
      }

      const suggestion = closestMatch(subcommand, Object.keys(GET_SUBCOMMANDS));
      throw new Error(suggestion
        ? mariowOSI18n.t("terminal.get.invalid-suggest", "invalid operation '{operation}'. Did you mean 'get {suggestion}'?", { operation: subcommand, suggestion })
        : mariowOSI18n.t("terminal.get.invalid", "invalid operation '{operation}'. Use 'get help'.", { operation: subcommand }));
    }

        return;

    function showHelp(tab, name) {

            ? mariowOSI18n.t("terminal.help.no-help-suggest", "no help for '{name}'. Did you mean '{suggestion}'?", { name, suggestion })

        printTable(tab, commandGroupTitle(group), commandTableHeaders(), rows);
      });
      printLine(tab, mariowOSI18n.t("terminal.help.footer", "Tab completes commands, paths, packages and apps · ↑/↓ browse the history · → accepts the grey suggestion\nCtrl+C cancels the line · Ctrl+L clears the screen · Ctrl+T / Ctrl+W open / close a tab · 'help <command>' for details"), "color-gray");
    }

    // --- COMMANDS ---
    // Every command lives here: help, the parser, Tab completion and the "did you mean"
    // suggestions all read this table, so they can never drift apart.
    //   run(tab, args, line) may be async; returning KEEP_PROMPT means it opened its
    //   own prompt. complete is "dir", "any" (paths) or (tab, argIndex, args) => list.
    const usageError = name => new Error(mariowOSI18n.t("terminal.error.usage", "usage: {usage}", { usage: COMMANDS[name].usage }));
    const COMMANDS = {
      help: { group: "General", usage: "help [command]", desc: mariowOSI18n.t("terminal.cmd.help", "Show every command, or details about one"),
        complete: (tab, index) => index === 1 ? commandNames() : null,
        run: (tab, args) => showHelp(tab, args[1]) },
      about: { group: "General", usage: "about", desc: mariowOSI18n.t("terminal.cmd.about", "About this terminal and the installed mariowOS version"),
        run: async tab => {
          let version = "";
          try { const about = await api("/api/system/about"); version = `\nmariowOS ${about.version} · build ${new Date(about.buildDate).toLocaleString(mariowOSI18n.locale)}`; } catch (error) {}
          printLine(tab, `mariowOS Terminal (preview) - (C) 2026 mariowstech and the mariowOS team${version}`);
        } },
      clear: { group: "General", usage: "clear", desc: mariowOSI18n.t("terminal.cmd.clear", "Clear the screen (Ctrl+L)"), run: tab => clearScreen(tab) },
      echo: { group: "General", usage: "echo [text]", desc: mariowOSI18n.t("terminal.cmd.echo", "Print a message ($USER and $PWD are expanded)"),
        run: (tab, args) => printLine(tab, args.slice(1).join(" ").replace(/\$USER\b/g, sysUsername).replace(/\$PWD\b/g, tab.currentDirectory)) },
      math: { group: "General", usage: "math <expression>", desc: mariowOSI18n.t("terminal.cmd.math", "Calculate an expression with + - * / % and parentheses"),
        run: (tab, args, line) => {
          const expression = line.replace(/^\S+\s*/, "").trim();
          if (!expression) throw usageError("math");
          let result;
          try { result = safeMath(expression); } catch (error) { throw new Error(mariowOSI18n.t("terminal.math.invalid", "invalid expression, check syntax")); }
          printLine(tab, `${expression} = ${result}`);
        } },
      history: { group: "General", usage: "history [-c]", desc: mariowOSI18n.t("terminal.cmd.history", "Show the command history; -c clears it"),
        complete: (tab, index) => index === 1 ? ["-c"] : null,
        run: (tab, args) => {
          if (args[1] === "-c") {
            tab.history = []; tab.historyIndex = 0;
            try { localStorage.removeItem(HISTORY_STORAGE_KEY); } catch (error) {}
            printLine(tab, mariowOSI18n.t("terminal.history.cleared", "History cleared."), "color-green");
            return;
          }
          if (args.length > 1) throw usageError("history");
          const width = String(tab.history.length).length;
          if (tab.history.length) printLine(tab, tab.history.map((line, i) => `${String(i + 1).padStart(width)}  ${line}`).join("\n"));
        } },
      whoami: { group: "General", usage: "whoami", desc: mariowOSI18n.t("terminal.cmd.whoami", "Print the current user name"), run: tab => printLine(tab, sysUsername) },
      date: { group: "General", usage: "date", desc: mariowOSI18n.t("terminal.cmd.date", "Show the current date and time"), run: tab => printLine(tab, new Date().toString()) },
      uptime: { group: "General", usage: "uptime", desc: mariowOSI18n.t("terminal.cmd.uptime", "Show how long the system has been running"),
        run: async tab => { const info = await api("/sysinfo"); printLine(tab, `up ${formatUptime(info.Uptime)}`); } },
      fetch: { group: "General", usage: "fetch", desc: mariowOSI18n.t("terminal.cmd.fetch", "Show system information"), run: tab => showFetch(tab) },
      lili: { group: "General", usage: "lili", desc: mariowOSI18n.t("terminal.cmd.lili", "A little easter egg ♥"),
        run: tab => printHTML(tab, `<span class="color-red">  ♥♥♥   ♥♥♥\n ♥♥♥♥♥ ♥♥♥♥♥\n  ♥♥♥♥♥♥♥♥♥\n    ♥♥♥♥♥\n      ♥</span>\n<span class="color-gray">just you and me, i love you lili &lt;3</span>`) },
      exit: { group: "General", usage: "exit", desc: mariowOSI18n.t("terminal.cmd.exit", "Close this tab (the window, if it is the last one)"),
        run: tab => { closeTerminal(tab); return KEEP_PROMPT; } },

      pwd: { group: "Files", usage: "pwd", desc: mariowOSI18n.t("terminal.cmd.pwd", "Print the working directory"), run: tab => printLine(tab, tab.currentDirectory) },
      cd: { group: "Files", usage: "cd [directory]", desc: mariowOSI18n.t("terminal.cmd.cd", "Change directory (no argument: /home, '-': previous, '~': home)"), complete: "dir",
        run: (tab, args) => { if (args.length > 2) throw usageError("cd"); return changeDirectory(tab, args[1]); } },
      ls: { group: "Files", usage: "ls [-l] [-a] [directory]", desc: mariowOSI18n.t("terminal.cmd.ls", "List files and folders; -l shows size and date, -a hidden items"), complete: "dir",
        run: (tab, args) => listDirectory(tab, args) },
      cat: { group: "Files", usage: "cat <file>", desc: mariowOSI18n.t("terminal.cmd.cat", "Print the content of a text file in your home partition"), complete: "any",
        run: (tab, args) => { if (args.length !== 2) throw usageError("cat"); return catFile(tab, args[1]); } },
      touch: { group: "Files", usage: "touch <file>", desc: mariowOSI18n.t("terminal.cmd.touch", "Create an empty file in your home partition"), complete: "any",
        run: (tab, args) => { if (args.length !== 2) throw usageError("touch"); return touchFile(tab, args[1]); } },
      mkdir: { group: "Files", usage: "mkdir [-p] <directory>", desc: mariowOSI18n.t("terminal.cmd.mkdir", "Create a directory in your home partition; -p creates the missing parents"), complete: "dir",
        run: (tab, args) => {
          const parents = args[1] === "-p";
          const target = parents ? args[2] : args[1];
          if (!target || args.length !== (parents ? 3 : 2)) throw usageError("mkdir");
          return makeDirectory(tab, target, parents);
        } },
      rm: { group: "Files", usage: "rm [-r] <path>", desc: mariowOSI18n.t("terminal.cmd.rm", "Delete a file; -r deletes a directory and its content"), complete: "any",
        run: (tab, args) => {
          const recursive = args[1] === "-r" || args[1] === "-rf";
          const target = recursive ? args[2] : args[1];
          if (!target || args.length !== (recursive ? 3 : 2)) throw usageError("rm");
          return removePath(tab, target, recursive);
        } },
      mv: { group: "Files", usage: "mv <source> <destination>", desc: mariowOSI18n.t("terminal.cmd.mv", "Move or rename a file or folder"), complete: "any",
        run: (tab, args) => { if (args.length !== 3) throw usageError("mv"); return transferPath(tab, "move", args[1], args[2]); } },
      cp: { group: "Files", usage: "cp <source> <destination>", desc: mariowOSI18n.t("terminal.cmd.cp", "Copy a file or folder"), complete: "any",
        run: (tab, args) => { if (args.length !== 3) throw usageError("cp"); return transferPath(tab, "copy", args[1], args[2]); } },
      nano: { group: "Files", usage: "nano <file>", desc: mariowOSI18n.t("terminal.cmd.nano", "Edit a file in your home partition (Ctrl+S save, Ctrl+X exit, Ctrl+G help)"), complete: "any",
        run: async (tab, args) => { if (args.length !== 2) throw usageError("nano"); await openNano(tab, args[1]); return KEEP_PROMPT; } },

      open: { group: "System", usage: "open [app]", desc: mariowOSI18n.t("terminal.cmd.open", "Open a desktop app; without arguments lists the apps"),
        complete: async (tab, index) => index === 1 ? Object.keys(await availableApps()) : null,
        run: (tab, args) => { if (args.length > 2) throw usageError("open"); return openApp(tab, args[1]); } },
      dmgr: { group: "System", usage: "dmgr", desc: mariowOSI18n.t("terminal.cmd.dmgr", "Desktop Manager: switch the desktop environment (arrows, Enter, Esc)"),
        run: () => { launchDmgr(); return KEEP_PROMPT; } },
      get: { group: "System", usage: "get <command> [pkg]", desc: mariowOSI18n.t("terminal.cmd.get", "mariowOS package manager (list, search, install, remove, update, upgrade)"),
        complete: async (tab, index, args) => {
          if (index === 1) return Object.keys(GET_SUBCOMMANDS);
          if (index === 2 && args[1] === "install") return (await loadCatalog()).map(app => app.id);
          if (index === 2 && args[1] === "remove") return (await installedApps()).map(app => app.appId);
          return null;
        },
        run: (tab, args) => runGet(tab, args) },
      addkey: { group: "System", usage: "addkey <key>", desc: mariowOSI18n.t("terminal.cmd.addkey", "Add a key to the system keyring (requires password)"),
        run: (tab, args) => {
          const key = args.slice(1).join(" ").trim();
          if (!key) throw usageError("addkey");
          return withAuth(tab, "addkey", async () => { await api("/api/system/keyring", { key }); printLine(tab, mariowOSI18n.t("terminal.keyring.added", "Key added to the keyring."), "color-green"); });
        } },
      delkey: { group: "System", usage: "delkey <key>", desc: mariowOSI18n.t("terminal.cmd.delkey", "Delete a key from the system keyring (requires password)"),
        complete: async (tab, index) => index === 1 ? (await api("/api/system/keyring")).keys.map(entry => entry.key) : null,
        run: async (tab, args) => {
          const key = args.slice(1).join(" ").trim();
          if (!key) throw usageError("delkey");
          const { keys } = await api("/api/system/keyring");
          if (!keys.some(entry => entry.key === key)) throw new Error(mariowOSI18n.t("terminal.keyring.not-found", "key not found in the keyring (see 'listkeys')"));
          return withAuth(tab, "delkey", async () => { await api("/api/system/keyring/delete", { key }); printLine(tab, mariowOSI18n.t("terminal.keyring.deleted", "Key deleted from the keyring."), "color-green"); });
        } },
      listkeys: { group: "System", usage: "listkeys", desc: mariowOSI18n.t("terminal.cmd.listkeys", "List the keys in the system keyring"),
        run: async tab => {
          const { keys } = await api("/api/system/keyring");
          if (!keys.length) { printLine(tab, mariowOSI18n.t("terminal.keyring.empty", "No keys saved.")); return; }
          printTable(tab, mariowOSI18n.t("terminal.keyring.title", "Saved Keys:"), [mariowOSI18n.t("terminal.table.key", "key"), mariowOSI18n.t("terminal.table.date-added", "date added")], keys.map(entry => [entry.key, new Date(entry.date).toLocaleString(mariowOSI18n.locale)]));
        } }
    };

    function commandNames() { return Object.keys(COMMANDS); }

    async function unknownCommand(tab, name) {
      let catalog = [];
      try { catalog = await loadCatalog(); } catch (error) {}
      const installed = await installedApps().catch(() => []);
      const pkg = catalog.find(app => app.id === name);
      if (pkg && !installed.some(app => app.appId === name)) {
        printHTML(tab, `<span class="color-red">${escapeHtml(mariowOSI18n.t("terminal.unknown.not-found-package", "{name}: command not found.", { name }))}</span>\n${mariowOSI18n.t("terminal.unknown.install-hint", 'You can install this package by running "{command}".', { command: `<span class="color-yellow">get</span> <span class="color-gray">install</span> ${escapeHtml(name)}` })}`);
        return askConfirm(tab, "get", mariowOSI18n.t("terminal.unknown.install-confirm", "Do you want to install it now? [y/N]"), answer => {
          if (!isYes(answer, false)) { printLine(tab, mariowOSI18n.t("terminal.unknown.install-cancelled", "Installation cancelled.")); return; }
          return withAuth(tab, "get", () => executeInstall(pkg, tab));
        });
      }
      const apps = await availableApps();
      const lower = name.toLowerCase();
      let hint = "";
      if (apps[lower]) hint = `open ${lower}`;
      else hint = closestMatch(name, commandNames()) || "";
      printHTML(tab, `<span class="color-red">${escapeHtml(mariowOSI18n.t("terminal.unknown.not-found", "{name}: command not found", { name }))}</span>` +
        (hint ? `\n${mariowOSI18n.t("terminal.unknown.did-you-mean", "Did you mean '{hint}'?", { hint: `<span class="color-yellow">${escapeHtml(hint)}</span>` })}` : "") +
        `\n${mariowOSI18n.t("terminal.unknown.type-help", "Type '{help}' to see all the commands.", { help: `<span class="color-yellow">help</span>` })}`);
    }

    async function executeCommand(line, tab) {
      const args = parseCommandArguments(line);
      const name = args[0];
      const command = Object.prototype.hasOwnProperty.call(COMMANDS, name) ? COMMANDS[name] : null;
      if (!command) return unknownCommand(tab, name);
      try {
        return await command.run(tab, args, line);
      } catch (error) {
        throw new Error(`${name}: ${error && error.message ? error.message : error}`);
      }
    }
  </script>
</body>
