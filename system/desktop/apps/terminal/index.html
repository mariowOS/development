<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/desktop/assets/material-you.css">
  <script src="/desktop/assets/monet-engine.js"></script>
  <style>
    @font-face {
      font-family: 'Unifont Ex Mono';
      src: url('unifont-ex-mono.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Unifont Ex Mono', monospace !important;
      color: #fff;
    }

    html, body {
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    .terminal {
      padding: 20px;
      font-size: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      height: 100vh;
      overflow-y: auto;
      user-select: none;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .terminal::-webkit-scrollbar {
      display: none;
    }

    .user {
      color: #00ff00;
    }

    .cursor {
      display: inline-block;
      width: 8px;
      height: 18px;
      background: #00ff00;
      margin-left: 2px;
      vertical-align: middle;
    }

    ::selection {
      background: #fff;
      color: #000;
    }
  </style>
</head>
<body>
  <div class="terminal" id="terminal" tabindex="0"></div>

  <script>
    const terminal = document.getElementById("terminal");

    let inputBuffer = "";
    let cursorVisible = true;
    let history = [];
    let historyIndex = -1;

    // Initialize variables
    let currentInput, currentCursor;
    let sysUsername = "user"; // default fallback

    // Fetch the actual username from settings before spawning the first prompt
    fetch("/get-settings")
      .then(res => res.json())
      .then(config => {
        if (config.username) {
          // Format like a real Linux username (lowercase, no spaces)
          sysUsername = config.username.toLowerCase().replace(/\s+/g, '');
        }
        newPrompt();
      })
      .catch(() => {
        newPrompt();
      });

    // Blink cursor
    setInterval(() => {
      if (currentCursor)
        currentCursor.style.visibility = cursorVisible ? "visible" : "hidden";
      cursorVisible = !cursorVisible;
    }, 500);

    // Focus terminal when clicked
    terminal.addEventListener("click", () => terminal.focus());
    window.addEventListener("click", () => terminal.focus());

    document.addEventListener("keydown", (e) => {
      if (
        ["Backspace", "Enter", "ArrowUp", "ArrowDown"].includes(e.key) ||
        (e.key.length === 1 && !e.ctrlKey && !e.metaKey)
      ) {
        e.preventDefault();
      }

      if (!currentInput) return;

      if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
        inputBuffer += e.key;
      } else if (e.key === "Backspace") {
        inputBuffer = inputBuffer.slice(0, -1);
      } else if (e.key === "Enter") {
        const cmd = inputBuffer.trim();
        executeCommand(cmd);
        if (cmd && !window.awaitingUpgradeConfirm) {
          history.push(cmd);
          historyIndex = history.length;
        }
        inputBuffer = "";
        return;
      } else if (e.key === "ArrowUp") {
        if (historyIndex > 0) {
          historyIndex--;
          inputBuffer = history[historyIndex];
        }
      } else if (e.key === "ArrowDown") {
        if (historyIndex < history.length - 1) {
          historyIndex++;
          inputBuffer = history[historyIndex];
        } else {
          historyIndex = history.length;
          inputBuffer = "";
        }
      }

      currentInput.textContent = inputBuffer;
      terminal.scrollTop = terminal.scrollHeight;
    });

    function newPrompt(prefix = null) {
      // Use dynamic username for the prompt prefix if no custom prompt is supplied
      const pfx = prefix !== null ? prefix : `<span class="user">${sysUsername}@mariowos</span>:$ `;
      const line = document.createElement("div");
      line.innerHTML = `${pfx}<span class="input"></span><span class="cursor"></span>`;
      terminal.appendChild(line);
      terminal.scrollTop = terminal.scrollHeight;

      currentInput = line.querySelector(".input");
      currentCursor = line.querySelector(".cursor");
      inputBuffer = "";
    }

    function executeCommand(cmd) {
      // 1. Intercept input if we are waiting for Y/n confirmation
      if (window.awaitingUpgradeConfirm) {
        window.awaitingUpgradeConfirm = false;
        const ans = cmd.toLowerCase().trim();
        
        const ansLine = document.createElement("div");
        terminal.appendChild(ansLine);

        if (ans === 'y' || ans === 'yes' || ans === '') {
          const upgDiv = document.createElement("div");
          upgDiv.innerText = `Fetching updates...\nUpgrading packages...`;
          terminal.appendChild(upgDiv);
          terminal.scrollTop = terminal.scrollHeight;

          fetch("/api/store/do-upgrade", { method: "POST" })
            .then(res => res.json())
            .then(data => {
               const d = document.createElement("div");
               if (data.success) d.innerText = `Upgrade complete. ${data.count} packages updated.`;
               else d.innerText = `E: ${data.error}`;
               terminal.appendChild(d);
               terminal.scrollTop = terminal.scrollHeight;
               newPrompt();
            });
        } else {
          const abDiv = document.createElement("div");
          abDiv.innerText = `Abort.`;
          terminal.appendChild(abDiv);
          terminal.scrollTop = terminal.scrollHeight;
          newPrompt();
        }
        return;
      }

      // 2. Normal execution path
      if (!cmd) {
        newPrompt();
        return;
      }

      const outputLine = document.createElement("div");
      const args = cmd.split(" ");
      const rootCmd = args[0];

      switch (rootCmd) {
        case "help":
          outputLine.innerText = `Commands:
        help - Show help                          addkey - adds a key into the system's keyring
        about - About this terminal               delkey - deletes a key from the system's keyring
        clear - Clear the screen                  listkeys - list all the keys in the system's keyring 
        echo [text] - Print a message             fetch - show system information
        math [expr] - Simple math calculator      lili - show lili command
        get [cmd] - mariowOS package manager`;
          terminal.appendChild(outputLine);
          break;

        case "about":
          outputLine.innerText = `mariowOS Terminal (preview) - (C) 2026 mariowstech and the mariowOS team`;
          terminal.appendChild(outputLine);
          break;

        case "clear":
          terminal.innerHTML = "";
          currentInput = null;
          currentCursor = null;
          inputBuffer = "";
          newPrompt();
          return;

        case "echo":
          outputLine.innerText = cmd.slice(5);
          terminal.appendChild(outputLine);
          break;

        case "math":
          try {
            const expr = cmd.slice(5);
            const result = eval(expr);
            outputLine.innerText = `${expr} = ${result}`;
          } catch {
            outputLine.innerText = "E: Invalid expression, check syntax.";
          }
          terminal.appendChild(outputLine);
          break;

        case "lili":
          outputLine.innerText = `lili ti amo!!!`;
          terminal.appendChild(outputLine);
          break;

        // --- PACKAGE MANAGER: GET ---
        case "get":
          const subCmd = args[1];
          const targetApp = args[2];

          if (!subCmd) {
            outputLine.innerText = `get: package manager for mariowOS\n\nUsage:\n  get list            - List all available packages in the catalog\n  get install [pkg]   - Download and install a package\n  get remove [pkg]    - Remove an installed package\n  get update          - Update local package indexes\n  get upgrade         - Upgrade all installed packages`;
            terminal.appendChild(outputLine);
            return newPrompt(); 
          }

          if (subCmd === "list") {
            fetch("/api/store/catalog")
              .then(res => res.json())
              .then(catalog => {
                let out = "== Available Packages ==\n\n";
                if (catalog.length === 0) out += "No packages found in catalog.";
                catalog.forEach(app => {
                  out += `${app.id.padEnd(20)} - ${app.title}\n`;
                });
                const outDiv = document.createElement("div");
                outDiv.innerText = out;
                terminal.appendChild(outDiv);
                terminal.scrollTop = terminal.scrollHeight;
                newPrompt();
              })
              .catch(() => {
                const errDiv = document.createElement("div");
                errDiv.innerText = "E: Failed to fetch package catalog.";
                terminal.appendChild(errDiv);
                newPrompt();
              });
            return;
          }

          if (subCmd === "install") {
            if (!targetApp) {
              outputLine.innerText = "E: You must specify a package to install.";
              terminal.appendChild(outputLine);
              return newPrompt();
            }

            outputLine.innerText = `Searching for package ${targetApp}...`;
            terminal.appendChild(outputLine);
            terminal.scrollTop = terminal.scrollHeight;

            fetch("/api/store/catalog")
              .then(res => res.json())
              .then(catalog => {
                const app = catalog.find(a => a.id === targetApp);
                if (!app) {
                  const errDiv = document.createElement("div");
                  errDiv.innerText = `E: Package '${targetApp}' not found.`;
                  terminal.appendChild(errDiv);
                  return newPrompt();
                }

                const queueDiv = document.createElement("div");
                queueDiv.innerText = `${targetApp} is queued to be installed...`;
                terminal.appendChild(queueDiv);
                terminal.scrollTop = terminal.scrollHeight;

                setTimeout(() => {
                  const fetchDiv = document.createElement("div");
                  fetchDiv.innerText = `Fetching package ${targetApp}...`;
                  terminal.appendChild(fetchDiv);
                  terminal.scrollTop = terminal.scrollHeight;

                  fetch("/api/store/install", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ appId: app.id, title: app.title, icon: app.icon, repoUrl: app.repoUrl })
                  })
                  .then(res => res.json())
                  .then(installRes => {
                    const resDiv = document.createElement("div");
                    if (installRes.success) {
                      resDiv.innerText = `Unpacking ${app.id}...\nSetting up ${app.id}...\nAdding package to app list...\n${app.id} installed successfully.`;
                      window.parent.postMessage({
                        type: 'app-installed-live',
                        app: { appId: app.id, title: app.title, icon: app.icon, url: `apps/${app.id}/index.html` }
                      }, '*');
                    } else {
                      resDiv.innerText = `E: Sub-process returned an error code: ${installRes.error}`;
                    }
                    terminal.appendChild(resDiv);
                    terminal.scrollTop = terminal.scrollHeight;
                    newPrompt();
                  });
                }, 800);
              })
              .catch(() => {
                const errDiv = document.createElement("div");
                errDiv.innerText = "E: Network error during installation phase.";
                terminal.appendChild(errDiv);
                newPrompt();
              });
            return;
          }

          if (subCmd === "remove") {
            if (!targetApp) {
              outputLine.innerText = "E: You must specify a package to remove.";
              terminal.appendChild(outputLine);
              return newPrompt();
            }

            outputLine.innerText = `Searching for package ${targetApp}...`;
            terminal.appendChild(outputLine);
            terminal.scrollTop = terminal.scrollHeight;

            fetch("/get-settings")
              .then(res => res.json())
              .then(config => {
                const installedApps = config.installedApps || [];
                const isInstalled = installedApps.find(a => a.appId === targetApp);

                if (!isInstalled) {
                  const errDiv = document.createElement("div");
                  errDiv.innerText = `E: Package '${targetApp}' is not installed.`;
                  terminal.appendChild(errDiv);
                  return newPrompt();
                }

                const rmDiv = document.createElement("div");
                rmDiv.innerText = `Removing ${targetApp}...`;
                terminal.appendChild(rmDiv);
                terminal.scrollTop = terminal.scrollHeight;

                fetch("/api/store/uninstall", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ appId: targetApp })
                })
                .then(res => res.json())
                .then(data => {
                  const resDiv = document.createElement("div");
                  if (data.success) {
                     resDiv.innerText = `${targetApp} removed successfully.`;
                     window.parent.postMessage({ type: 'app-uninstalled-live', appId: targetApp }, '*');
                  } else {
                     resDiv.innerText = `E: Could not remove package: ${data.error}`;
                  }
                  terminal.appendChild(resDiv);
                  terminal.scrollTop = terminal.scrollHeight;
                  newPrompt();
                });
              })
              .catch(() => {
                 const errDiv = document.createElement("div");
                 errDiv.innerText = "E: Failed to connect to local package manager.";
                 terminal.appendChild(errDiv);
                 newPrompt();
              });
            return;
          }

          if (subCmd === "update") {
            outputLine.innerText = `Fetching catalog...`;
            terminal.appendChild(outputLine);
            terminal.scrollTop = terminal.scrollHeight;

            fetch("/api/store/update")
              .then(res => res.json())
              .then(data => {
                setTimeout(() => { 
                  const updDiv = document.createElement("div");
                  updDiv.innerText = `Updating catalog...`;
                  terminal.appendChild(updDiv);
                  terminal.scrollTop = terminal.scrollHeight;

                  setTimeout(() => {
                    const doneDiv = document.createElement("div");
                    if (data.success) {
                      doneDiv.innerText = `\nDone. ${data.addedCount} new packages added to local repository.`;
                    } else {
                      doneDiv.innerText = `\nE: ${data.error}`;
                    }
                    terminal.appendChild(doneDiv);
                    terminal.scrollTop = terminal.scrollHeight;
                    newPrompt();
                  }, 600);
                }, 600);
              })
              .catch(() => {
                const errDiv = document.createElement("div");
                errDiv.innerText = "\nE: Network error while fetching catalog.";
                terminal.appendChild(errDiv);
                terminal.scrollTop = terminal.scrollHeight;
                newPrompt();
              });
            return;
          }

          if (subCmd === "upgrade") {
            outputLine.innerText = `Reading package lists...`;
            terminal.appendChild(outputLine);
            terminal.scrollTop = terminal.scrollHeight;

            setTimeout(() => {
              const depDiv = document.createElement("div");
              depDiv.innerText = `Building dependency tree... Done\nReading state information... Done`;
              terminal.appendChild(depDiv);
              terminal.scrollTop = terminal.scrollHeight;

              setTimeout(() => {
                const calcDiv = document.createElement("div");
                calcDiv.innerText = `Calculating upgrade...`;
                terminal.appendChild(calcDiv);
                terminal.scrollTop = terminal.scrollHeight;

                fetch("/api/store/check-upgrades")
                  .then(res => res.json())
                  .then(data => {
                    const resDiv = document.createElement("div");
                    if (data.upgrades && data.upgrades.length > 0) {
                       resDiv.innerText = `The following packages will be upgraded:\n  ${data.upgrades.join(" ")}\n${data.upgrades.length} upgraded, 0 newly installed, 0 to remove.`;
                       terminal.appendChild(resDiv);
                       terminal.scrollTop = terminal.scrollHeight;
                       
                       window.awaitingUpgradeConfirm = true;
                       newPrompt("Do you want to continue? [Y/n] ");
                    } else {
                       resDiv.innerText = `Done\n0 upgraded, 0 newly installed, 0 to remove and 0 not upgraded.`;
                       terminal.appendChild(resDiv);
                       terminal.scrollTop = terminal.scrollHeight;
                       newPrompt();
                    }
                  })
                  .catch(() => {
                     const errDiv = document.createElement("div");
                     errDiv.innerText = "E: Failed to check for upgrades.";
                     terminal.appendChild(errDiv);
                     terminal.scrollTop = terminal.scrollHeight;
                     newPrompt();
                  });
              }, 500);
            }, 500);
            return;
          }

          outputLine.innerText = `E: Invalid operation ${subCmd}`;
          terminal.appendChild(outputLine);
          return newPrompt();

        // --- ASYNC COMMANDS ---
        case "addkey":
          const keyValue = cmd.slice(7).trim();
          if (!keyValue) {
            outputLine.innerText = "E: Please specify a key to add.";
            terminal.appendChild(outputLine);
            return newPrompt(); 
          }

          fetch("/save-key", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ key: keyValue }),
          })
            .then((res) => res.text())
            .then((msg) => {
              const resultLine = document.createElement("div");
              resultLine.innerText = msg;
              terminal.appendChild(resultLine);
              newPrompt(); 
            })
            .catch(() => {
              const errLine = document.createElement("div");
              errLine.innerText = "E: Failed to save key.";
              terminal.appendChild(errLine);
              newPrompt(); 
            });
          return;

        case "listkeys":
          fetch("/list-keys")
            .then((res) => res.json())
            .then((keys) => {
              const listOutput = document.createElement("div");
              if (keys.length === 0) {
                listOutput.innerText = "No keys saved.";
              } else {
                listOutput.innerText =
                  "== Saved Keys ==\n" +
                  keys
                    .map(
                      (k, i) =>
                        `${i + 1}. ${k.key} (added ${new Date(k.date).toLocaleString()})`
                    )
                    .join("\n");
              }
              terminal.appendChild(listOutput);
              newPrompt(); 
            })
            .catch(() => {
              const errLine = document.createElement("div");
              errLine.innerText = "E: Failed to list keys.";
              terminal.appendChild(errLine);
              newPrompt(); 
            });
          return;

        case "delkey":
          const keyToDelete = cmd.slice(7).trim();
          if (!keyToDelete) {
            outputLine.innerText = "E: Please specify a key to delete.";
            terminal.appendChild(outputLine);
            return newPrompt(); 
          }

          fetch("/delete-key", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ key: keyToDelete }),
          })
            .then((res) => res.text())
            .then((msg) => {
              const resultLine = document.createElement("div");
              resultLine.innerText = msg;
              terminal.appendChild(resultLine);
              newPrompt(); 
            })
            .catch(() => {
              const errLine = document.createElement("div");
              errLine.innerText = "E: Failed to delete key.";
              terminal.appendChild(errLine);
              newPrompt(); 
            });
          return;

        case "fetch":
          fetch("/sysinfo")
            .then((res) => res.json())
            .then((info) => {
              if (info.error) throw new Error(info.error);

              const hours = Math.floor(info.Uptime / 3600);
              const minutes = Math.floor((info.Uptime % 3600) / 60);

              const fetchOutput = document.createElement("div");
              fetchOutput.innerText = `                    
    @@@@@                            ┌──────────Basic Info──────────┐
 @@@@@@@@@@@      @@@@@@             OS: mariowOS PRE-RELEASE 1 (Insiders)   
    @@@@@         @@@@@@             Uptime: ${hours}h ${minutes}m
     @@@         @@@@@@@@            CPU: ${info.CPU}
              @@@@@@@@@@@@@@         RAM: ${info.RAM}
          @@@@@@@@@@@@@@@@@@@@@@     Engine: Lillium Engine 
        @@@@@@@@@@@@@@@@@@@@@@@@@@   
           @@@@@@@@@@@@@@@@@@@@      ┌──────────Shell Info──────────┐
               @@@@@@@@@@@@          Shell: mariowOS DE (Tiles) v1.5
                 @@@@@@@@            Build number/date: v1.0 06/09/2026 17:57PM
       @@         @@@@@@             Kernel: 0.4-node (mwos@mariowos) 
      @@@@@        @@@@              
   @@@@@@@@@@@                       © mariowstech and the mariowOS team
      @@@@@                          All rights reserved.                           
`;
              terminal.appendChild(fetchOutput);
              terminal.scrollTop = terminal.scrollHeight;

              newPrompt();
            })
            .catch(() => {
              const errLine = document.createElement("div");
              errLine.innerText = "E: Failed to fetch system info.";
              terminal.appendChild(errLine);
              newPrompt();
            });
          return;

        default:
          outputLine.innerText = `Command not found: ${cmd}`;
          terminal.appendChild(outputLine);
      }

      // Synchronous commands fall through to here
      terminal.scrollTop = terminal.scrollHeight;
      newPrompt();
    }
  </script>
</body>
</html>
