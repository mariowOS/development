  <style>
    @font-face {
      font-family: 'MesloLGS NF';
      src: url('/desktop/assets/vendor/MesloLGS-NF-Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
    @font-face {
      font-family: 'Unifont Ex Mono';
      src: url('unifont-ex-mono.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    * { 
      margin: 0; padding: 0; box-sizing: border-box; 
      /* JetBrains Mono come font primario, Meslo in background per garantire i glifi Powerline */
      font-family: 'JetBrains Mono', 'MesloLGS NF', 'Unifont Ex Mono', monospace !important; 
      color: #fff; 
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    html, body { height: 100%; background: #000; overflow: hidden; }
    a { color: #92d9ff; text-decoration: none; }
    a:hover { text-decoration: underline; }

    #terminals-container { width: 100%; height: 100%; position: relative; }

    .terminal {
      padding: 15px 20px; font-size: 13px; line-height: 1.6; white-space: pre-wrap;
      height: 100vh; overflow-y: auto; user-select: text; scrollbar-width: none;
      -ms-overflow-style: none; position: absolute; top: 0; left: 0; width: 100%;
      outline: none;
    }
    .terminal::-webkit-scrollbar { display: none; }
    
    /* Oh-my-posh styling - Ripristinato con glifi testuali puri e allineamento flex */
    .posh-arrow-start { 
      color: #000000; 
      background: #ffffff; 
      font-size: 14px; 
      display: inline-flex; 
      align-items: center; 
      justify-content: center;
      height: 20px; 
      vertical-align: middle; 
    }
    .posh-block-user { 
      background: #ffffff; 
      color: #000000; 
      padding: 0 4px 0 0px; 
      font-weight: bold; 
      font-size: 12px;
      display: inline-flex; 
      align-items: center; 
      height: 20px; 
      vertical-align: middle;
    }
    .posh-arrow-user { 
      color: #ffffff; 
      background: #92d9ff; 
      font-size: 14px; 
      display: inline-flex; 
      align-items: center; 
      justify-content: center;
      height: 20px; 
      vertical-align: middle; 
    }
    .posh-block-path { 
      background: #92d9ff; 
      color: #000000; 
      padding: 0 8px; 
      font-size: 12px; 
      display: inline-flex; 
      align-items: center; 
      height: 20px; 
      vertical-align: middle; 
    }
    .posh-arrow-path { 
      color: #92d9ff; 
      background: transparent; 
      font-size: 14px; 
      display: inline-flex; 
      align-items: center; 
      justify-content: center;
      height: 20px; 
      vertical-align: middle; 
      margin-right: 8px; 
    }

    .prompt-line { display: flex; align-items: center; flex-wrap: nowrap; min-height: 20px; height: 20px; line-height: 20px; white-space: pre; }
    .input-wrapper { position: relative; display: inline-block; min-width: 2px; line-height: 20px; white-space: pre; }
    .input { color: #fff; position: relative; z-index: 2; font-size: 13px; line-height: 20px; white-space: pre; }
    .prediction { color: #555; position: absolute; top: 0; left: 0; z-index: 1; pointer-events: none; white-space: pre; font-size: 13px; line-height: 20px; }
    
    .cursor { display: inline-block; width: 7px; height: 15px; background: #ffffff; margin-left: 4px; vertical-align: middle; }
    
    /* Syntax & UI Colors */
    .spinner { color: #00ff00; font-weight: bold; }
    .color-blue { color: #92d9ff; }
    .color-green { color: #27c93f; }
    .color-yellow { color: #ffbd2e; }
    .color-red { color: #ff5f56; }
    .color-gray { color: #aaaaaa; }
    
    /* Command Tables */
    .term-table {
      border-collapse: collapse;
      margin-top: 4px;
      margin-bottom: 16px;
      width: 100%;
      max-width: 750px;
      font-size: 13px;
    }
    .term-table th, .term-table td {
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 6px 12px;
      text-align: left;
    }
    .term-table td {
      color: #dddddd;
    }
    .term-table th {
      color: #ffffff;
      font-weight: normal;
    }
    
    ::selection { background: #fff; color: #000; }

    /* dmgr UI Overlay styles */
    #dmgr-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #92d9ff; z-index: 1000; align-items: center; justify-content: center; flex-direction: column; }
    .dmgr-window { background: #111; border: 1px solid rgba(255,255,255,0.2); box-shadow: 8px 8px 0px #000; padding: 30px; width: 500px; text-align: center; }
    .dmgr-title { color: #fff; margin-bottom: 40px; font-weight: bold; }
    .dmgr-title.red { color: #ff453a; }
    .dmgr-subtitle { color: #92d9ff; margin-bottom: 10px; }
    .dmgr-text, .dmgr-item { color: #fff; padding: 5px; margin-bottom: 5px; }
    .dmgr-list { text-align: left; display: inline-block; margin-bottom: 40px; }
    .dmgr-item.focused { background: rgba(255,255,255,0.2); }
    .dmgr-item span.star { color: #ffbd2e; }
    .dmgr-buttons { margin-top: 20px; display: flex; justify-content: center; gap: 20px; }
    .dmgr-btn { color: #fff; padding: 5px 15px; border: 1px solid rgba(255,255,255,0.3); }
    .dmgr-btn.focused { background: rgba(255,255,255,0.3); }

    #nano-overlay { display: none; position: fixed; inset: 0; z-index: 2000; background: #000; }
    .nano-window { position: relative; display: flex; flex-direction: column; width: 100%; height: 100%; min-width: 0; min-height: 0; background: #000; color: #eee; }
    .nano-header { position: relative; display: flex; align-items: center; justify-content: space-between; flex: 0 0 20px; min-height: 20px; padding: 1px 8px; background: #c0c0c0; color: #111; font-size: 12px; line-height: 18px; }
    .nano-header > span { color: #111; }
    #nano-filename { position: absolute; left: 25%; right: 25%; overflow: hidden; text-align: center; text-overflow: ellipsis; white-space: nowrap; }
    #nano-modified { position: relative; z-index: 1; margin-left: auto; }
    #nano-editor { flex: 1; width: 100%; min-height: 0; resize: none; border: 0; outline: none; padding: 12px 3px 2px; background: #000; color: #eee; font: 13px/1.2 'JetBrains Mono', monospace; tab-size: 2; pointer-events: none; white-space: pre; overflow: auto; }
    .nano-footer { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); flex: 0 0 auto; background: #000; color: #eee; font: 12px/1.4 'JetBrains Mono', monospace; }
    .nano-shortcut { display: flex; align-items: center; min-width: 0; white-space: nowrap; }
    .nano-shortcut kbd { display: inline-block; flex: 0 0 auto; padding: 0 3px; background: #c0c0c0; color: #111; font: inherit; }
    .nano-shortcut span { overflow: hidden; padding-left: 4px; text-overflow: clip; }
    #nano-status { position: absolute; left: 50%; bottom: 34px; z-index: 1; transform: translateX(-50%); max-width: calc(100% - 16px); overflow: hidden; padding: 0 8px; background: #c0c0c0; color: #111; text-align: center; text-overflow: ellipsis; white-space: nowrap; }
    #nano-help { position: absolute; inset: 20px 0 36px; z-index: 2; display: none; overflow: auto; padding: 16px; background: #000; color: #eee; white-space: pre-wrap; }
    @media (max-width: 600px) {
      .nano-footer { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .nano-shortcut { font-size: 10px; }
      #nano-filename { left: 18%; right: 18%; }
      #nano-status { bottom: 58px; }
    }

  <script>
    // SECURITY (M-06): safe arithmetic evaluator for the `math` command. Tokenizes
    // numbers and + - * / % ( ) only, then evaluates via shunting-yard. Anything else
    // (identifiers, calls, etc.) throws, so no arbitrary JavaScript can run.
    function safeMath(input) {
      const tokens = String(input).match(/\d+\.?\d*|[()+\-*/%]/g);
      if (!tokens || tokens.join("").replace(/\s/g, "") !== String(input).replace(/\s/g, "")) {
        throw new Error("invalid");
      }
      const prec = { "+": 1, "-": 1, "*": 2, "/": 2, "%": 2 };
      const out = [], ops = [];
      for (const t of tokens) {
        if (/^\d/.test(t)) out.push(parseFloat(t));
        else if (t === "(") ops.push(t);
        else if (t === ")") {
          while (ops.length && ops[ops.length - 1] !== "(") out.push(ops.pop());
          if (ops.pop() !== "(") throw new Error("paren");
        } else {
          while (ops.length && prec[ops[ops.length - 1]] >= prec[t]) out.push(ops.pop());
          ops.push(t);
        }
      }
      while (ops.length) { const o = ops.pop(); if (o === "(") throw new Error("paren"); out.push(o); }
      const st = [];
      for (const tok of out) {
        if (typeof tok === "number") st.push(tok);
        else {
          const b = st.pop(), a = st.pop();
          if (a === undefined || b === undefined) throw new Error("operand");
          st.push(tok === "+" ? a + b : tok === "-" ? a - b : tok === "*" ? a * b : tok === "%" ? a % b : a / b);
        }
      }
      if (st.length !== 1 || !Number.isFinite(st[0])) throw new Error("result");
      return st[0];
    }

    const terminalsContainer = document.getElementById("terminals-container");
    const dmgrOverlay = document.getElementById("dmgr-overlay");
    const nanoOverlay = document.getElementById("nano-overlay");
    const nanoEditor = document.getElementById("nano-editor");
    const nanoStatus = document.getElementById("nano-status");
    const nanoHelp = document.getElementById("nano-help");
    const nanoModified = document.getElementById("nano-modified");
    const IS_EMBEDDED = window.parent !== window;

    // Multi-tab state
    let tabs = [];
    let activeTabId = null;
    let tabsContainer;
    let sysUsername = "user";
    let cursorVisible = true;
    let globalCatalog = [];
    // Returned by a command step that opened its own prompt (password, question, nano...).
    const KEEP_PROMPT = Symbol("keep-prompt");
    let nanoTarget = null;
    let nanoOriginalContent = "";
    let nanoConfirmDiscard = false;
    let nanoMode = "edit";
    let nanoInputBuffer = "";
    let nanoCutBuffer = "";

    // DMGR State Machine 
    let dmgrActive = false, dmgrScreen = 1, availableDEs = [], selectedDEIndex = 0, focusIndex = 0, confirmFocusIndex = 0;
    let currentActiveDE = "com.mariowos.desktop.html";


    // --- TAB & UI INJECTION LOGIC ---
    if (IS_EMBEDDED) {
      const frame = window.frameElement;
      const osHeader = frame ? frame.closest('.popup').querySelector('.popup-header') : window.parent.document.querySelector('#popup8 .popup-header');
      
      if (osHeader) {
        if (!window.parent.document.getElementById('term-os-styles')) {
          const style = window.parent.document.createElement('style');
          style.id = 'term-os-styles';
          style.textContent = `
            .notes-tab-btn { display: flex; align-items: center; gap: 8px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.12); border-bottom: none; border-radius: 12px 12px 0 0; padding: 6px 14px; color: rgba(255, 255, 255, 0.55); font-size: 12px; font-weight: 500; cursor: pointer; position: relative; height: 28px; box-sizing: border-box; transition: all 0.2s; font-family: 'Poppins', sans-serif !important; user-select: none; overflow: hidden; margin-top: 8px; }
            .notes-tab-btn span { font-family: 'Poppins', sans-serif !important; }
            .notes-tab-btn:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
            .notes-tab-btn.active { background: color-mix(in srgb, var(--sys-accent) 18%, transparent); color: #fff; height: 34px; border-color: color-mix(in srgb, var(--sys-accent) 30%, transparent); margin-top: 2px; }
            .notes-tab-btn.active::before { content: ''; position: absolute; inset: 0; border-radius: 12px 12px 0 0; border: 2px solid var(--sys-accent-text); border-bottom: none; pointer-events: none; }
            .tab-color-line { position: absolute; top: 0; left: 0; right: 0; height: 3px; transition: background 0.2s; z-index: 2; pointer-events: none; }
            .notes-tab-close { background: none; border: none; color: inherit; opacity: 0.6; cursor: pointer; padding: 0; font-size: 15px; font-weight: bold; display: flex; align-items: center; justify-content: center; margin-left: 2px; z-index: 3; position: relative;}
            .notes-tab-close:hover { opacity: 1; color: #ff453a; }
            .notes-tab-btn.dragging { opacity: 0.4; }
            .notes-tab-btn.drag-over { transform: translateX(2px); background: rgba(255,255,255,0.1); }
            #term-tab-context-menu {
              position: fixed; z-index: 10000; 
              background: rgba(24, 25, 28, 0.35) !important;
              backdrop-filter: blur(30px) saturate(200%) !important;
              -webkit-backdrop-filter: blur(30px) saturate(200%) !important;
              border: 1px solid rgba(255,255,255,0.15);
              border-radius: 12px; padding: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
              display: none; flex-direction: column; font-family: 'Poppins', sans-serif;
            }
            .color-dot { width: 20px; height: 20px; border-radius: 50%; cursor: pointer; transition: transform 0.15s; box-sizing: border-box; }
            .color-dot:hover { transform: scale(1.2); }
          `;
          window.parent.document.head.appendChild(style);
        }

        if (!window.parent.document.getElementById('term-tab-context-menu')) {
          const cm = window.parent.document.createElement('div');
          cm.id = 'term-tab-context-menu';
          cm.innerHTML = `
            <div style="font-size: 10px; margin-bottom: 8px; color: rgba(255,255,255,0.5); font-weight: 600; letter-spacing: 0.5px;">${mariowOSI18n.t("terminal.tabs.group-color", "GROUP COLOR")}</div>
            <div style="display: flex; gap: 8px;">
              <div class="color-dot" data-color="transparent" style="border: 1px solid rgba(255,255,255,0.3);" title="${mariowOSI18n.t("terminal.tabs.color.none", "None")}"></div>
              <div class="color-dot" data-color="#ff5f56" style="background: #ff5f56;" title="${mariowOSI18n.t("terminal.tabs.color.red", "Red")}"></div>
              <div class="color-dot" data-color="#ffbd2e" style="background: #ffbd2e;" title="${mariowOSI18n.t("terminal.tabs.color.yellow", "Yellow")}"></div>
              <div class="color-dot" data-color="#27c93f" style="background: #27c93f;" title="${mariowOSI18n.t("terminal.tabs.color.green", "Green")}"></div>
              <div class="color-dot" data-color="#92d9ff" style="background: #92d9ff;" title="${mariowOSI18n.t("terminal.tabs.color.blue", "Blue")}"></div>
              <div class="color-dot" data-color="#c864fa" style="background: #c864fa;" title="${mariowOSI18n.t("terminal.tabs.color.purple", "Purple")}"></div>
            </div>
          `;
          window.parent.document.body.appendChild(cm);
          window.parent.document.addEventListener('click', (e) => {
            if (cm.style.display === 'flex' && !cm.contains(e.target)) cm.style.display = 'none';
          });
        }

        const actionsDiv = osHeader.querySelector('.window-actions');
        
        if (osHeader.querySelector('#os-term-tabs')) osHeader.querySelector('#os-term-tabs').remove();
        if (osHeader.querySelector('#os-term-actions')) osHeader.querySelector('#os-term-actions').remove();

        tabsContainer = window.parent.document.createElement('div');
        tabsContainer.id = 'os-term-tabs';
        tabsContainer.style.cssText = 'display: flex; gap: 4px; flex: 1; overflow-x: auto; align-items: flex-end; height: 100%; margin-left: 12px; cursor: move;';
        
        const termActions = window.parent.document.createElement('div');
        termActions.id = 'os-term-actions';
        termActions.style.cssText = 'display: flex; align-items: center; gap: 5px; flex-shrink: 0; margin-right: 8px; margin-top: 4px;';
        termActions.innerHTML = `<button class="browser-nav-btn" id="os-term-new" title="${mariowOSI18n.t("terminal.tabs.new", "New Tab")}" style="background:transparent; border:none; color:rgba(255,255,255,0.7); cursor:pointer; padding:4px; display:flex; align-items:center; border-radius:4px;"><span class="material-symbols-outlined" style="font-size: 18px;">add</span></button>`;
        
        if (actionsDiv) {
          osHeader.insertBefore(tabsContainer, actionsDiv);
          osHeader.insertBefore(termActions, actionsDiv);
        } else {
          osHeader.appendChild(tabsContainer);
          osHeader.appendChild(termActions);
        }

        termActions.querySelector('#os-term-new').addEventListener('click', () => createTab());
        
        let activeContextTabId = null;
        const parentCm = window.parent.document.getElementById('term-tab-context-menu');
        parentCm.querySelectorAll('.color-dot').forEach(dot => {
          dot.addEventListener('click', () => {
            if (activeContextTabId) {
              const color = dot.dataset.color;
              const tabObj = tabs.find(t => t.id === activeContextTabId);
              if (tabObj) {
                tabObj.color = color;
                const tabEl = tabsContainer.querySelector(`[data-id="${activeContextTabId}"]`);
                if (tabEl) {
                  const line = tabEl.querySelector('.tab-color-line');
                  if (line) line.style.background = color;
                }
              }
            }
            parentCm.style.display = 'none';
          });
        });

        window.openTabContextMenu = function(e, id) {
          e.preventDefault();
          activeContextTabId = id;
          parentCm.style.display = 'flex';
          parentCm.style.left = Math.min(e.clientX, window.innerWidth - 150) + 'px';
          parentCm.style.top = (e.clientY + 10) + 'px';
        };
      }
    }

    function buildTabElement(id, name, color="transparent") {
      const doc = IS_EMBEDDED ? window.parent.document : document;
      const win = IS_EMBEDDED ? window.parent : window;
      const btn = doc.createElement('div');
      btn.className = 'notes-tab-btn';
      btn.dataset.id = id;

      const colorLine = doc.createElement('div');
      colorLine.className = 'tab-color-line';
      colorLine.style.background = color;
      btn.appendChild(colorLine);

      const span = doc.createElement('span');
      span.textContent = name;
      span.style.zIndex = "3";
      span.style.position = "relative";
      span.style.outline = "none"; 
      span.style.minWidth = "20px";
      span.style.display = "inline-block";
      span.style.whiteSpace = "nowrap";

      span.addEventListener('dblclick', (e) => {
        e.stopPropagation(); span.contentEditable = "true"; btn.setAttribute('draggable', false); span.style.cursor = "text"; span.focus();
        const selection = win.getSelection(); const range = doc.createRange(); range.selectNodeContents(span); selection.removeAllRanges(); selection.addRange(range);
      });

      const finishEditing = () => {
        if (span.contentEditable !== "true") return;
        span.contentEditable = "false"; btn.setAttribute('draggable', true); span.style.cursor = "inherit";
        const newName = span.textContent.trim() || "bash"; span.textContent = newName;
        const tab = tabs.find(t => t.id === id); if (tab) tab.name = newName;
      };

      span.addEventListener('blur', finishEditing);
      span.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); span.blur(); } });

      const closeBtn = doc.createElement('button'); closeBtn.className = 'notes-tab-close'; closeBtn.textContent = '×';
      closeBtn.addEventListener('click', (e) => { e.stopPropagation(); closeTab(id); });

      btn.appendChild(span); btn.appendChild(closeBtn);
      btn.addEventListener('click', () => switchTab(id));
      
      if (IS_EMBEDDED) btn.addEventListener('contextmenu', (e) => window.openTabContextMenu(e, id));
      
      btn.setAttribute('draggable', true);
      btn.addEventListener('dragstart', dragStart); btn.addEventListener('dragover', dragOver);
      btn.addEventListener('dragleave', dragLeave); btn.addEventListener('drop', dropTab); btn.addEventListener('dragend', dragEnd);

      return btn;
    }

    function createTab(name = "bash") {
      const id = Date.now().toString();
      const termDiv = document.createElement('div');
      termDiv.className = 'terminal'; termDiv.id = `term-${id}`; termDiv.tabIndex = 0;
      terminalsContainer.appendChild(termDiv);

      const tabState = {
        id, name, color: "transparent", element: termDiv,
        currentDirectory: "/home",
        completion: null,
        previousDirectory: null,
        history: [], historyIndex: 0, historyDraft: "", inputBuffer: "", currentInput: null, currentCursor: null, currentPrediction: null,
        awaitingPassword: false, authCallback: null, authLabel: "", passwordBuffer: "",
        pendingConfirm: null, busy: false
      };
      tabState.history = loadStoredHistory();
      tabState.historyIndex = tabState.history.length;
      
      tabs.push(tabState);
      if (tabsContainer) {
        const btn = buildTabElement(id, name, "transparent");
        tabsContainer.appendChild(btn);
      }
      
      newPrompt(tabState);
      switchTab(id);
      if (IS_EMBEDDED) window.parent.postMessage({ type: "terminal-ready" }, window.location.origin);
    }

    function switchTab(id) {
      activeTabId = id;
      tabs.forEach(t => {
        if (t.id === id) { t.element.style.display = 'block'; t.element.scrollTop = t.element.scrollHeight; } 
        else { t.element.style.display = 'none'; }
      });
      if (tabsContainer) {
        tabsContainer.querySelectorAll('.notes-tab-btn').forEach(b => { b.classList.toggle('active', b.dataset.id === id); });
      }
      focusTerminal();
    }

    function closeTab(id) {
      const index = tabs.findIndex(t => t.id === id);
      if (index === -1) return;
      tabs[index].element.remove(); tabs.splice(index, 1);
      
      if (tabsContainer) { const btn = tabsContainer.querySelector(`[data-id="${id}"]`); if (btn) btn.remove(); }
      if (tabs.length > 0) switchTab(tabs[Math.max(0, index - 1)].id); else createTab(); 
    }

    window.addEventListener("message", async event => {
      if (!IS_EMBEDDED || event.source !== window.parent || event.origin !== window.location.origin || event.data.type !== "set-working-directory") return;
      const tab = tabs.find(item => item.id === activeTabId);
      if (!tab || typeof event.data.path !== "string") return;
      try {
        const directoryPath = normalizeVirtualPath(event.data.path, "/home");
        await getDirectoryContents(directoryPath);
        tab.currentDirectory = directoryPath;
        updatePromptPath(tab);
      } catch (error) {
        appendFileCommandError(tab, mariowOSI18n.t("terminal.error.open-directory", "Unable to open directory: {error}", { error: error.message }));
        newPrompt(tab);
      }
    });

    // --- Drag & Drop logic ---
    let dragged = null;
    function dragStart(e){ dragged = e.currentTarget; dragged.classList.add('dragging'); }
    function dragOver(e){ e.preventDefault(); if(e.currentTarget !== dragged) { e.currentTarget.classList.add('drag-over'); } }
    function dragLeave(e){ e.currentTarget.classList.remove('drag-over'); }
    function dragEnd(e){ if(dragged) dragged.classList.remove('dragging'); tabsContainer.querySelectorAll('.notes-tab-btn').forEach(b => b.classList.remove('drag-over')); }
    function dropTab(e){
      e.preventDefault(); const target = e.currentTarget; target.classList.remove('drag-over');
      if(dragged && target !== dragged){
        const draggedIndex = [...tabsContainer.children].indexOf(dragged); const targetIndex = [...tabsContainer.children].indexOf(target);
        if(draggedIndex < targetIndex){ tabsContainer.insertBefore(dragged, target.nextSibling); const tabObj = tabs.splice(draggedIndex,1)[0]; tabs.splice(targetIndex,0,tabObj); } 
        else { tabsContainer.insertBefore(dragged, target); const tabObj = tabs.splice(draggedIndex,1)[0]; tabs.splice(targetIndex,0,tabObj); }
      }
    }

    // --- INITIALIZATION ---
    fetch("/get-settings").then(res => res.json()).then(config => {
        // Terminal is for administrators (Settings > Users); the server refuses commands too.
        if (config.currentUser && !config.currentUser.admin) {
            terminalsContainer.innerHTML = `
                <div style="padding: 20px; font-size: 14px;">
                    ${escapeHtml(mariowOSI18n.t("terminal.admin-only", "Terminal is only available to administrators. Ask an administrator to change your account type in Settings > Users."))}
                </div>
            `;
            return;
        }
        // Developer Options Verification
        if (config.developer === false) {
            terminalsContainer.innerHTML = `
                <div style="padding: 20px; font-size: 14px;">
                    ${escapeHtml(mariowOSI18n.t("terminal.devoptions.required", "For your security, Terminal requires developer options to be enabled to work."))}<br>
                    ${mariowOSI18n.t("terminal.devoptions.enable", "You can enable them in {link}.", { link: `<a href="#" style="color: #92d9ff;" onclick="window.parent.postMessage({type: 'open-app-from-store', appId: 'popup1'}, window.location.origin); return false;">${escapeHtml(mariowOSI18n.t("terminal.devoptions.link", "settings > lab"))}</a>` })}
                </div>
            `;
            return;
        }

        if (config.username) sysUsername = config.username.toLowerCase().replace(/\s+/g, '');
        fetch("/api/store/catalog").then(r=>r.json()).then(c => globalCatalog = c).catch(()=>{});
        createTab("bash");
    }).catch(() => createTab("bash"));


    setInterval(() => {
      tabs.forEach(t => { if (t.currentCursor) t.currentCursor.style.visibility = cursorVisible ? "visible" : "hidden"; });
      cursorVisible = !cursorVisible;
    }, 500);

    // --- PREDICTION ---
    // Ghost text after the input: the most recent matching history entry first (like
    // fish), otherwise the first command whose name starts with what was typed.
    // ArrowRight or End accepts it.
    function updatePrediction(tab) {
      if (!tab.currentPrediction) return;
      const input = tab.inputBuffer;
      if (!input || tab.awaitingPassword || tab.pendingConfirm) {
        tab.currentPrediction.textContent = "";
        return;
      }
      let guess = "";
      for (let i = tab.history.length - 1; i >= 0; i--) {
        if (tab.history[i].length > input.length && tab.history[i].startsWith(input)) { guess = tab.history[i]; break; }
      }
      if (!guess && !/\s/.test(input)) guess = commandNames().find(name => name.startsWith(input) && name !== input) || "";
      tab.currentPrediction.textContent = guess;
    }

    function renderInput(tab) {
      if (!tab.currentInput) return;
      tab.currentInput.textContent = tab.awaitingPassword ? "*".repeat(tab.passwordBuffer.length) : tab.inputBuffer;
      updatePrediction(tab);
      tab.element.scrollTop = tab.element.scrollHeight;
    }

    // --- FOCUS ---
    // The terminal has no <input>: keystrokes are read from the focused .terminal div.
    // It must therefore own the focus as soon as the app opens, when its desktop window
    // comes back to the front, and after any click that is not a text selection.
    function activeTab() { return tabs.find(t => t.id === activeTabId); }
    let isFrontWindow = () => true;

    function focusTerminal() {
      if (nanoOverlay.style.display === "flex") { nanoEditor.focus(); return; }
      const tab = activeTab();
      if (!tab) return;
      if (IS_EMBEDDED) {
        try {
          const frame = window.frameElement;
          if (frame && window.parent.document.activeElement !== frame) frame.focus({ preventScroll: true });
        } catch (error) {}
      }
      window.focus();
      if (document.activeElement !== tab.element) tab.element.focus({ preventScroll: true });
    }

    function hasTextSelection() {
      const selection = window.getSelection();
      return !!selection && !selection.isCollapsed && selection.toString().length > 0;
    }

    window.addEventListener("click", (event) => {
      if (nanoOverlay.contains(event.target) || dmgrActive) return;
      if (event.target.closest && event.target.closest("a")) return;
      if (hasTextSelection()) return; // keep the selection so it can be copied
      focusTerminal();
    });
    window.addEventListener("focus", () => { if (!hasTextSelection()) focusTerminal(); });
    document.addEventListener("visibilitychange", () => { if (!document.hidden && isFrontWindow()) focusTerminal(); });

    // Inside the desktop the app lives in an iframe of a .popup window. Watch that
    // window: when it becomes the front-most one (opened, restored, clicked) the
    // focus moves into the terminal, and a click on its title bar does the same.
    if (IS_EMBEDDED) {
      try {
        const popup = window.frameElement && window.frameElement.closest(".popup");
        if (popup) {
          const parentWindow = window.parent;
          const zIndexOf = element => parseInt(parentWindow.getComputedStyle(element).zIndex, 10) || 0;
          isFrontWindow = () => {
            if (!popup.classList.contains("active") || popup.style.display === "none") return false;
            const mine = zIndexOf(popup);
            return [...parentWindow.document.querySelectorAll(".popup.active")].every(other => other === popup || zIndexOf(other) <= mine);
          };
          let wasFront = isFrontWindow();
          new MutationObserver(() => {
            const front = isFrontWindow();
            if (front && !wasFront) requestAnimationFrame(focusTerminal);
            wasFront = front;
          }).observe(popup, { attributes: true, attributeFilter: ["class", "style"] });
          popup.addEventListener("mousedown", (event) => {
            const target = event.target;
            if (target === window.frameElement || target.isContentEditable || target.closest("input, textarea, [contenteditable='true']")) return;
            setTimeout(focusTerminal, 0);
          });
        }
      } catch (error) {}
    }

    // --- KEYBOARD ---
    document.addEventListener("keydown", (e) => {
      if (nanoOverlay.style.display === "flex") return;
      if (dmgrActive) {
        e.preventDefault();
        if (e.key === "Escape") { closeDmgr(); return; }
        if (dmgrScreen === 1) {
          if (e.key === "ArrowDown") focusIndex = Math.min(focusIndex + 1, availableDEs.length);
          if (e.key === "ArrowUp") focusIndex = Math.max(focusIndex - 1, 0);
          if (e.key === "Enter" || e.key === " ") { if (focusIndex < availableDEs.length) selectedDEIndex = focusIndex; else showDmgrScreen2(); }
          renderDmgr1();
        } else if (dmgrScreen === 2) {
          if (e.key === "ArrowRight" || e.key === "ArrowLeft") confirmFocusIndex = confirmFocusIndex === 0 ? 1 : 0;
          if (e.key === "Enter" || e.key === " ") {
            if (confirmFocusIndex === 1) {
              if (availableDEs[selectedDEIndex] === currentActiveDE) closeDmgr(mariowOSI18n.t("terminal.dmgr.no-changes", "dmgr: No changes made. Target DE is already active."));
              else { dmgrActive = false; dmgrOverlay.style.display = "none"; window.parent.location.href = `/desktop/${availableDEs[selectedDEIndex]}`; }
            } else { closeDmgr(); }
          }
          renderDmgr2();
        }
        return;
      }

      const tab = activeTab();
      if (!tab) return;
      const key = e.key;

      if (e.ctrlKey && !e.altKey && !e.metaKey) {
        const lower = key.toLowerCase();
        if (lower === "t") { e.preventDefault(); createTab(); return; }
        if (lower === "w") { e.preventDefault(); closeTab(tab.id); return; }
        if (lower === "l") { e.preventDefault(); if (!tab.busy) { clearScreen(tab); newPrompt(tab); } return; }
        if (lower === "c") { if (hasTextSelection()) return; e.preventDefault(); cancelLine(tab); return; }
        if (lower === "u") {
          e.preventDefault();
          if (!tab.busy) { tab.inputBuffer = ""; tab.passwordBuffer = ""; tab.completion = null; renderInput(tab); }
          return;
        }
        return; // Ctrl+V reaches the paste handler below
      }
      if (e.metaKey || e.altKey) return;

      if (["Backspace", "Enter", "ArrowUp", "ArrowDown", "Tab", "ArrowRight", "End"].includes(key) || key.length === 1) e.preventDefault();
      if (!tab.currentInput || tab.busy) return;

      if (key === "Tab") {
        if (!tab.awaitingPassword && !tab.pendingConfirm) completeInput(tab);
        return;
      }

      if (key === "ArrowRight" || key === "End") {
        if (tab.currentPrediction && tab.currentPrediction.textContent) {
          tab.inputBuffer = tab.currentPrediction.textContent;
          tab.completion = null;
          renderInput(tab);
        }
        return;
      }

      if (key.length === 1) {
        tab.completion = null;
        if (tab.awaitingPassword) tab.passwordBuffer += key;
        else tab.inputBuffer += key;
      } else if (key === "Backspace") {
        tab.completion = null;
        if (tab.awaitingPassword) tab.passwordBuffer = tab.passwordBuffer.slice(0, -1);
        else tab.inputBuffer = tab.inputBuffer.slice(0, -1);
      } else if (key === "Enter") {
        submitLine(tab);
        return;
      } else if (key === "ArrowUp") {
        if (tab.awaitingPassword || tab.pendingConfirm || !tab.history.length) return;
        tab.completion = null;
        if (tab.historyIndex >= tab.history.length) tab.historyDraft = tab.inputBuffer;
        if (tab.historyIndex > 0) { tab.historyIndex--; tab.inputBuffer = tab.history[tab.historyIndex]; }
      } else if (key === "ArrowDown") {
        if (tab.awaitingPassword || tab.pendingConfirm) return;
        tab.completion = null;
        if (tab.historyIndex < tab.history.length - 1) { tab.historyIndex++; tab.inputBuffer = tab.history[tab.historyIndex]; }
        else if (tab.historyIndex === tab.history.length - 1) { tab.historyIndex = tab.history.length; tab.inputBuffer = tab.historyDraft || ""; }
      } else {
        return;
      }
      renderInput(tab);
    });

    document.addEventListener("paste", (e) => {
      if (nanoOverlay.style.display === "flex" || dmgrActive) return;
      const tab = activeTab();
      if (!tab || tab.busy || !tab.currentInput) return;
      const text = (e.clipboardData ? e.clipboardData.getData("text") : "").replace(/\r?\n/g, " ");
      if (!text) return;
      e.preventDefault();
      tab.completion = null;
      if (tab.awaitingPassword) tab.passwordBuffer += text;
      else tab.inputBuffer += text;
      renderInput(tab);
    });

    // --- LINE HANDLING ---
    const HISTORY_STORAGE_KEY = "mariowos.terminal.history";
    const HISTORY_LIMIT = 200;
    function loadStoredHistory() {
      try {
        const stored = JSON.parse(localStorage.getItem(HISTORY_STORAGE_KEY) || "[]");
        return Array.isArray(stored) ? stored.filter(item => typeof item === "string").slice(-HISTORY_LIMIT) : [];
      } catch (error) { return []; }
    }
    function pushHistory(tab, line) {
      if (tab.history[tab.history.length - 1] !== line) tab.history.push(line);
      if (tab.history.length > HISTORY_LIMIT) tab.history.splice(0, tab.history.length - HISTORY_LIMIT);
      tab.historyIndex = tab.history.length;
      tab.historyDraft = "";
      try {
        const stored = loadStoredHistory();
        if (stored[stored.length - 1] !== line) stored.push(line);
        localStorage.setItem(HISTORY_STORAGE_KEY, JSON.stringify(stored.slice(-HISTORY_LIMIT)));
      } catch (error) {}
    }

    // Runs one asynchronous step of a command. Keys are ignored while it runs, errors
    // are printed, and a fresh prompt follows unless the step opened its own prompt
    // (password, yes/no question, nano, dmgr) by returning KEEP_PROMPT.
    async function runTask(tab, task, label = "") {
      tab.busy = true;
      if (tab.currentCursor) tab.currentCursor.style.display = "none";
      let result;
      try {
        result = await task();
      } catch (error) {
        const message = error && error.message ? error.message : String(error);
        printError(tab, label ? `${label}: ${message}` : message);
      }
      tab.busy = false;
      if (result !== KEEP_PROMPT) newPrompt(tab);
    }

    function submitLine(tab) {
      tab.completion = null;
      if (tab.currentPrediction) tab.currentPrediction.textContent = "";
      if (tab.awaitingPassword) { verifyPassword(tab); return; }
      const line = tab.inputBuffer.trim();
      if (tab.pendingConfirm) {
        const { callback, label } = tab.pendingConfirm;
        tab.pendingConfirm = null;
        runTask(tab, () => callback(line.toLowerCase()), label);
        return;
      }
      if (!line) { newPrompt(tab); return; }
      pushHistory(tab, line);
      runTask(tab, () => executeCommand(line, tab));
    }

    function verifyPassword(tab) {
      const password = tab.passwordBuffer;
      const callback = tab.authCallback;
      const label = tab.authLabel;
      tab.passwordBuffer = "";
      tab.awaitingPassword = false;
      tab.authCallback = null;
      runTask(tab, async () => {
        let data = {};
        try {
          const response = await fetch("/api/system/verify-password", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password })
          });
          data = await response.json();
        } catch (error) {}
        if (!data.success) { printError(tab, mariowOSI18n.t("terminal.auth.failure", "su: Authentication failure")); return; }
        return callback ? callback() : undefined;
      }, label);
    }

    function cancelLine(tab) {
      if (tab.busy || !tab.currentInput) return;
      tab.currentInput.textContent = `${tab.awaitingPassword ? "" : tab.inputBuffer}^C`;
      tab.awaitingPassword = false;
      tab.authCallback = null;
      tab.pendingConfirm = null;
      tab.completion = null;
      tab.historyIndex = tab.history.length;
      if (tab.currentPrediction) tab.currentPrediction.textContent = "";
      newPrompt(tab);
    }

    function clearScreen(tab) {
      tab.element.innerHTML = "";
      tab.currentCursor = null;
    }
    function updatePromptPath(tab, line = tab.currentCursor?.parentElement) {
      const pathLabel = line?.querySelector(".posh-block-path");
      if (!pathLabel) return;
      const pathParts = tab.currentDirectory.split("/").filter(Boolean);
      pathLabel.textContent = tab.currentDirectory === "/home" ? "" : (pathParts[pathParts.length - 1] || "/");
    }

    function newPrompt(tab, prefix = null, hideInput = false) {
      if (tab.currentCursor) {
        tab.currentCursor.remove();
      }

      const line = document.createElement("div");
      line.className = "prompt-line";
      line.style.marginBottom = "2px";
      
      let pfxHtml = prefix;
      if (prefix === null) {
          pfxHtml = `<span class="posh-arrow-start"></span><span class="posh-block-user"> ${sysUsername}@mariowos</span><span class="posh-arrow-user"></span><span class="posh-block-path"></span><span class="posh-arrow-path"></span>`;
      }
      
      line.innerHTML = `${pfxHtml}<div class="input-wrapper"><span class="prediction"></span><span class="input"></span></div><span class="cursor"></span>`;
      if (prefix === null) updatePromptPath(tab, line);
      tab.element.appendChild(line); tab.element.scrollTop = tab.element.scrollHeight;
      
      tab.currentInput = line.querySelector(".input"); 
      tab.currentPrediction = line.querySelector(".prediction");
      tab.currentCursor = line.querySelector(".cursor"); 
      tab.inputBuffer = "";
      tab.passwordBuffer = "";
    }

    function normalizeVirtualPath(targetPath, currentDirectory) {
      // "~" is the home partition, as in a POSIX shell.
      const normalizedInput = targetPath.replace(/\\/g, "/").replace(/^~(?=\/|$)/, "/home");
      const parts = normalizedInput.startsWith("/")
        ? []
        : currentDirectory.split("/").filter(Boolean);

      normalizedInput.split("/").forEach(part => {
        if (!part || part === ".") return;
        if (part === "..") parts.pop();
        else parts.push(part);
      });
      return `/${parts.join("/")}`;
    }

    function parseCommandArguments(command) {
      // A quote left open (e.g. while Tab-completing "My Fol) runs to the end of the line.
      const tokens = command.match(/"(?:\\.|[^"])*(?:"|$)|'(?:\\.|[^'])*(?:'|$)|[^\s]+/g) || [];
      return tokens.map(token => {
        const quote = token[0];
        if (quote !== '"' && quote !== "'") return token;
        return token.length > 1 && token.endsWith(quote) ? token.slice(1, -1) : token.slice(1);
      });
    }

    async function getDirectoryContents(directoryPath) {
      const response = await fetch(`/api/system/files?path=${encodeURIComponent(directoryPath)}`);
      const data = await response.json();
      if (!response.ok || !data.success) throw new Error(data.error || mariowOSI18n.t("terminal.error.read-directory", "Unable to read directory"));
      return data;
    }

    // --- TAB COMPLETION ---
    // The word under the cursor is completed from what makes sense at that position:
    // command names first, then whatever the command declares (paths, packages, apps,
    // keys, subcommands). One match is inserted; several are narrowed to their common
    // prefix, then listed, and further Tab presses cycle through them.
    function splitCompletionToken(input) {
      const match = input.match(/(?:^|\s)("[^"]*|'[^']*|[^\s"']*)$/);
      if (!match) return null;
      const rawToken = match[1];
      const quote = rawToken.startsWith('"') || rawToken.startsWith("'") ? rawToken[0] : "";
      return { before: input.slice(0, input.length - rawToken.length), token: quote ? rawToken.slice(1) : rawToken, quote };
    }

    function formatCompletion(value, quote, final) {
      const needsQuote = quote || /\s/.test(value);
      const q = quote || '"';
      return `${needsQuote ? q : ""}${value}${needsQuote && final ? q : ""}${final ? " " : ""}`;
    }

    function longestCommonPrefix(values) {
      let prefix = values[0] || "";
      for (const value of values) {
        while (prefix && !value.startsWith(prefix)) prefix = prefix.slice(0, -1);
      }
      return prefix;
    }

    async function pathCandidates(tab, token, kind) {
      const slash = token.lastIndexOf("/");
      const directoryPart = slash >= 0 ? token.slice(0, slash + 1) : "";
      const prefix = token.slice(slash + 1).toLocaleLowerCase();
      const data = await getDirectoryContents(normalizeVirtualPath(directoryPart || ".", tab.currentDirectory));
      return data.contents
        .filter(item => item.name.toLocaleLowerCase().startsWith(prefix) && (kind !== "dir" || item.type === "folder"))
        .map(item => item.type === "folder"
          ? { value: `${directoryPart}${item.name}/`, label: `${item.name}/`, final: false }
          : { value: `${directoryPart}${item.name}`, label: item.name, final: true });
    }

    async function completionCandidates(tab, args, argIndex, token) {
      if (argIndex === 0) {
        return commandNames().filter(name => name.startsWith(token)).map(name => ({ value: name, label: name, final: true }));
      }
      const command = COMMANDS[args[0]];
      if (!command || !command.complete) return [];
      const kind = typeof command.complete === "function" ? await command.complete(tab, argIndex, args) : command.complete;
      if (kind === "dir" || kind === "any") return pathCandidates(tab, token, kind);
      if (!Array.isArray(kind)) return [];
      const lower = token.toLowerCase();
      return kind.filter(value => value.toLowerCase().startsWith(lower)).map(value => ({ value, label: value, final: true }));
    }

    async function completeInput(tab) {
      const state = tab.completion;
      if (state && tab.inputBuffer === state.lastBuffer && state.candidates.length > 1) {
        state.index = (state.index + 1) % state.candidates.length;
        const candidate = state.candidates[state.index];
        tab.inputBuffer = state.before + formatCompletion(candidate.value, state.quote, candidate.final);
        state.lastBuffer = tab.inputBuffer;
        renderInput(tab);
        return;
      }

      tab.completion = null;
      const split = splitCompletionToken(tab.inputBuffer);
      if (!split) return;
      const args = parseCommandArguments(split.before);
      const requestedBuffer = tab.inputBuffer;
      let candidates = [];
      try { candidates = await completionCandidates(tab, args, args.length, split.token); } catch (error) {}
      // The user may have kept typing while the candidates were being fetched.
      if (tab.inputBuffer !== requestedBuffer || tab.busy || !tab.currentInput || !candidates.length) return;

      if (candidates.length === 1) {
        tab.inputBuffer = split.before + formatCompletion(candidates[0].value, split.quote, candidates[0].final);
        renderInput(tab);
        return;
      }
      const common = longestCommonPrefix(candidates.map(candidate => candidate.value));
      if (common.length > split.token.length) {
        tab.inputBuffer = split.before + formatCompletion(common, split.quote, false);
        renderInput(tab);
        return;
      }
      const listing = document.createElement("div");
      listing.className = "color-gray";
      listing.style.whiteSpace = "pre-wrap";
      listing.textContent = candidates.map(candidate => candidate.label).join("    ");
      insertBeforePrompt(tab, listing);
      tab.completion = { before: split.before, quote: split.quote, candidates, index: -1, lastBuffer: tab.inputBuffer };
    }
    function insertBeforePrompt(tab, element) {
      const activePrompt = tab.currentCursor?.parentElement;
      if (activePrompt?.parentElement === tab.element) tab.element.insertBefore(element, activePrompt);
      else tab.element.appendChild(element);
      tab.element.scrollTop = tab.element.scrollHeight;
    }

    function appendFileCommandError(tab, message) {
      const errorLine = document.createElement("div");
      errorLine.className = "color-red";
      errorLine.textContent = `E: ${message}`;
      tab.element.appendChild(errorLine);
      tab.element.scrollTop = tab.element.scrollHeight;
    }

    // --- OUTPUT & API HELPERS ---
    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch]);
    }

    function printLine(tab, text, className = "") {
      const line = document.createElement("div");
      if (className) line.className = className;
      line.style.whiteSpace = "pre-wrap";
      line.textContent = text;
      tab.element.appendChild(line);
      tab.element.scrollTop = tab.element.scrollHeight;
      return line;
    }

    function printHTML(tab, html) {
      const block = document.createElement("div");
      block.style.whiteSpace = "pre-wrap";
      block.innerHTML = html;
      tab.element.appendChild(block);
      tab.element.scrollTop = tab.element.scrollHeight;
      return block;
    }

    function printError(tab, message) { return printLine(tab, message, "color-red"); }

    function printTable(tab, title, headers, rows) {
      const head = `<tr>${headers.map(h => `<th>${escapeHtml(h)}</th>`).join("")}</tr>`;
      const body = rows.map(row => `<tr>${row.map(cell => `<td>${escapeHtml(cell)}</td>`).join("")}</tr>`).join("");
      return printHTML(tab, `${title ? `<div class="color-blue" style="margin-bottom: 8px;">${escapeHtml(title)}</div>` : ""}<table class="term-table">${head}${body}</table>`);
    }

    // Animated "working" line for slow backend calls; returns a stop function.
    function startSpinner(tab, label) {
      const frames = ["⠋", "⠙", "⠹", "⠸", "⠼", "⠴", "⠦", "⠧", "⠇", "⠏"];
      const line = printLine(tab, `${frames[0]} ${label}`, "color-blue");
      let frame = 0;
      const timer = setInterval(() => { frame = (frame + 1) % frames.length; line.textContent = `${frames[frame]} ${label}`; }, 90);
      return () => { clearInterval(timer); line.remove(); };
    }

    async function api(url, body) {
      const options = body === undefined
        ? { cache: "no-store" }
        : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
      const response = await fetch(url, options);
      let data = {};
      try { data = await response.json(); } catch (error) {}
      if (!response.ok || (data && data.success === false)) {
        throw new Error((data && data.error) || mariowOSI18n.t("terminal.error.request-failed", "request failed (HTTP {status})", { status: response.status }));
      }
      return data;
    }

    function formatBytes(bytes) {
      if (!Number.isFinite(bytes) || bytes < 0) return "--";
      const units = ["B", "KB", "MB", "GB", "TB"];
      let value = bytes, unit = 0;
      while (value >= 1024 && unit < units.length - 1) { value /= 1024; unit++; }
      return `${unit === 0 ? value : value.toFixed(1)} ${units[unit]}`;
    }

    function formatUptime(seconds) {
      const total = Math.max(0, Math.floor(Number(seconds) || 0));
      const days = Math.floor(total / 86400), hours = Math.floor((total % 86400) / 3600), minutes = Math.floor((total % 3600) / 60);
      return `${days ? `${days}d ` : ""}${hours}h ${minutes}m`;
    }

    // --- FILE COMMANDS ---
    function splitHomeTarget(targetPath) {
      if (targetPath === "/home") return null;
      if (!targetPath.startsWith("/home/")) throw new Error(mariowOSI18n.t("terminal.error.home-only-change", "only items in your home partition can be changed"));
      const separator = targetPath.lastIndexOf("/");
      const parentPath = separator === 0 ? "/" : targetPath.slice(0, separator);
      const name = targetPath.slice(separator + 1);
      if (!name || name === "." || name === "..") throw new Error(mariowOSI18n.t("terminal.error.invalid-path", "invalid path"));
      return { parentPath, name };
    }

    // Folder → { type: "folder" }, file → its listing entry, missing → null.
    async function statPath(virtualPath) {
      try { await getDirectoryContents(virtualPath); return { type: "folder", name: virtualPath.split("/").pop() }; } catch (error) {}
      const separator = virtualPath.lastIndexOf("/");
      if (separator < 0) return null;
      const parentPath = separator === 0 ? "/" : virtualPath.slice(0, separator);
      try {
        const data = await getDirectoryContents(parentPath);
        return data.contents.find(item => item.name === virtualPath.slice(separator + 1)) || null;
      } catch (error) { return null; }
    }

    async function changeDirectory(tab, target) {
      if (target === "-") {
        if (!tab.previousDirectory) throw new Error(mariowOSI18n.t("terminal.error.no-previous-directory", "no previous directory"));
        target = tab.previousDirectory;
      }
      const directoryPath = normalizeVirtualPath(target || "/home", tab.currentDirectory);
      await getDirectoryContents(directoryPath);
      if (directoryPath !== tab.currentDirectory) tab.previousDirectory = tab.currentDirectory;
      tab.currentDirectory = directoryPath;
    }

    async function listDirectory(tab, args) {
      const flags = args.slice(1).filter(arg => /^-[a-z]+$/i.test(arg)).join("");
      const targets = args.slice(1).filter(arg => !/^-[a-z]+$/i.test(arg));
      if (targets.length > 1 || /[^la]/i.test(flags.replace(/-/g, ""))) throw usageError("ls");
      const long = flags.includes("l");
      const showHidden = flags.includes("a");
      const directoryPath = targets[0] ? normalizeVirtualPath(targets[0], tab.currentDirectory) : tab.currentDirectory;
      const data = await getDirectoryContents(directoryPath);
      const items = data.contents.filter(item => showHidden || !item.name.startsWith("."));
      if (!items.length) return;
      const nameHtml = item => item.type === "folder"
        ? `<span class="color-blue">${escapeHtml(item.name)}/</span>`
        : escapeHtml(item.name);
      if (long) {
        printHTML(tab, items.map(item =>
          `${item.type === "folder" ? "d" : "-"}  ${escapeHtml(String(item.size || "--").padStart(9))}  ${escapeHtml(String(item.date || "--").padEnd(10))}  ${nameHtml(item)}`
        ).join("\n"));
      } else {
        printHTML(tab, items.map(nameHtml).join("    "));
      }
    }

    async function makeDirectory(tab, requestedPath, parents) {
      const targetPath = normalizeVirtualPath(requestedPath, tab.currentDirectory);
      if (!splitHomeTarget(targetPath)) throw new Error(mariowOSI18n.t("terminal.error.mkdir-home", "cannot create a directory over /home"));
      const segments = targetPath.slice("/home/".length).split("/");
      let current = "/home";
      for (let i = 0; i < segments.length; i++) {
        const next = `${current}/${segments[i]}`;
        const last = i === segments.length - 1;
        const existing = await statPath(next);
        if (existing) {
          if (existing.type !== "folder") throw new Error(mariowOSI18n.t("terminal.error.exists-not-directory", "{path} exists and is not a directory", { path: next }));
          if (last && !parents) throw new Error(mariowOSI18n.t("terminal.error.already-exists", "{path} already exists", { path: next }));
        } else {
          if (!last && !parents) throw new Error(mariowOSI18n.t("terminal.error.parent-missing", "{path} does not exist (use mkdir -p)", { path: `${current}/${segments[i]}` }));
          await api("/api/system/files/create-folder", { path: current, name: segments[i] });
        }
        current = next;
      }
      printLine(tab, mariowOSI18n.t("terminal.files.created-directory", "Created directory: {path}", { path: targetPath }), "color-green");
    }

    async function removePath(tab, requestedPath, recursive) {
      const targetPath = normalizeVirtualPath(requestedPath, tab.currentDirectory);
      const target = splitHomeTarget(targetPath);
      if (!target) throw new Error(mariowOSI18n.t("terminal.error.remove-home", "refusing to remove /home"));
      if (tab.currentDirectory === targetPath || tab.currentDirectory.startsWith(`${targetPath}/`)) {
        throw new Error(mariowOSI18n.t("terminal.error.remove-current", "refusing to remove the current directory (cd somewhere else first)"));
      }
      const parent = await getDirectoryContents(target.parentPath);
      const item = parent.contents.find(entry => entry.name === target.name);
      if (!item) throw new Error(mariowOSI18n.t("terminal.error.no-such-file", "{path}: no such file or directory", { path: targetPath }));
      if (item.type === "folder" && !recursive) throw new Error(mariowOSI18n.t("terminal.error.is-directory-rm", "{path} is a directory (use rm -r)", { path: targetPath }));
      await api("/api/system/files/delete", { path: target.parentPath, name: target.name, recursive });
      printLine(tab, mariowOSI18n.t("terminal.files.removed", "Removed: {path}", { path: targetPath }), "color-green");
    }

    async function catFile(tab, requestedPath) {
      const targetPath = normalizeVirtualPath(requestedPath, tab.currentDirectory);
      if (targetPath !== "/home" && !targetPath.startsWith("/home/")) throw new Error(mariowOSI18n.t("terminal.error.home-only-read", "only files in your home partition can be read"));
      const target = splitHomeTarget(targetPath);
      if (!target) throw new Error(mariowOSI18n.t("terminal.error.home-is-directory", "/home is a directory"));
      const data = await api(`/api/system/files/content?path=${encodeURIComponent(target.parentPath)}&name=${encodeURIComponent(target.name)}`);
      if (data.content) printLine(tab, data.content);
    }

    async function touchFile(tab, requestedPath) {
      const targetPath = normalizeVirtualPath(requestedPath, tab.currentDirectory);
      const target = splitHomeTarget(targetPath);
      if (!target) throw new Error(mariowOSI18n.t("terminal.error.home-is-directory", "/home is a directory"));
      await getDirectoryContents(target.parentPath);
      const existing = await statPath(targetPath);
      if (existing) {
        if (existing.type === "folder") throw new Error(mariowOSI18n.t("terminal.error.is-directory", "{path} is a directory", { path: targetPath }));
        return; // like touch: an existing file is left as it is
      }
      await api("/api/system/files/content", { path: target.parentPath, name: target.name, content: "", createOnly: true });
      printLine(tab, mariowOSI18n.t("terminal.files.created-file", "Created file: {path}", { path: targetPath }), "color-green");
    }

    // mv / cp. The destination is either an existing folder (the item keeps its name)
    // or a new path (the item is moved/copied there and renamed).
    async function transferPath(tab, mode, sourceArg, destinationArg) {
      const sourcePath = normalizeVirtualPath(sourceArg, tab.currentDirectory);
      const source = splitHomeTarget(sourcePath);
      if (!source) throw new Error(mariowOSI18n.t("terminal.error.transfer-home", "cannot move or copy /home"));
      const sourceItem = await statPath(sourcePath);
      if (!sourceItem) throw new Error(mariowOSI18n.t("terminal.error.no-such-file", "{path}: no such file or directory", { path: sourcePath }));

      const destinationPath = normalizeVirtualPath(destinationArg, tab.currentDirectory);
      const destinationItem = await statPath(destinationPath);
      let directory, name, explicitName;
      if (destinationItem && destinationItem.type === "folder") {
        directory = destinationPath; name = source.name; explicitName = false;
      } else if (destinationItem) {
        throw new Error(mariowOSI18n.t("terminal.error.already-exists", "{path} already exists", { path: destinationPath }));
      } else {
        const destination = splitHomeTarget(destinationPath);
        if (!destination) throw new Error(mariowOSI18n.t("terminal.error.invalid-destination", "invalid destination"));
        directory = destination.parentPath; name = destination.name; explicitName = true;
        if (!(await statPath(directory))) throw new Error(mariowOSI18n.t("terminal.error.no-such-directory", "{path}: no such directory", { path: directory }));
      }
      if (mode === "move" && (destinationPath === sourcePath || destinationPath.startsWith(`${sourcePath}/`))) {
        throw new Error(mariowOSI18n.t("terminal.error.move-inside-itself", "cannot move a folder inside itself"));
      }

      let finalName = name;
      if (mode === "move" && directory === source.parentPath) {
        if (name === source.name) return;
        await api("/api/system/files/rename", { path: directory, oldName: source.name, newName: name });
      } else {
        const data = await api("/api/system/files/transfer", { fromPath: source.parentPath, toPath: directory, names: [source.name], mode });
        const result = (data.results || [])[0] || {};
        if (result.error) throw new Error(result.error);
        finalName = result.newName || source.name;
        if (explicitName && finalName !== name) {
          await api("/api/system/files/rename", { path: directory, oldName: finalName, newName: name });
          finalName = name;
        }
      }
      if (mode === "move" && (tab.currentDirectory === sourcePath || tab.currentDirectory.startsWith(`${sourcePath}/`))) {
        tab.currentDirectory = `${directory === "/" ? "" : directory}/${finalName}${tab.currentDirectory.slice(sourcePath.length)}`;
      }
      const values = { from: sourcePath, to: `${directory === "/" ? "" : directory}/${finalName}` };
      printLine(tab, mode === "move"
        ? mariowOSI18n.t("terminal.files.moved", "Moved: {from} -> {to}", values)
        : mariowOSI18n.t("terminal.files.copied", "Copied: {from} -> {to}", values), "color-green");
    }
    async function openNano(tab, requestedPath) {
      const targetPath = normalizeVirtualPath(requestedPath, tab.currentDirectory);
      const separator = targetPath.lastIndexOf("/");
      const directoryPath = separator === 0 ? "/" : targetPath.slice(0, separator);
      const fileName = targetPath.slice(separator + 1);
      if (!fileName || fileName === "." || fileName === "..") {
        throw new Error(mariowOSI18n.t("terminal.error.provide-file-name", "provide a file name"));
      }
      if (directoryPath !== "/home" && !directoryPath.startsWith("/home/")) {
        throw new Error(mariowOSI18n.t("terminal.error.home-only-save", "files can only be saved in your home partition"));
      }

      try {
        let content = "";
        const response = await fetch(`/api/system/files/content?path=${encodeURIComponent(directoryPath)}&name=${encodeURIComponent(fileName)}`);
        if (response.status !== 404) {
          const data = await response.json();
          if (!response.ok || !data.success) throw new Error(data.error || mariowOSI18n.t("terminal.error.open-file", "Unable to open file"));
          content = data.content;
        }

        nanoTarget = { directoryPath, fileName, tab };
        nanoOriginalContent = content;
        document.getElementById("nano-filename").textContent = `File: ${targetPath}`;
        nanoEditor.value = content;
        nanoConfirmDiscard = false;
        nanoMode = "edit";
        nanoInputBuffer = "";
        nanoCutBuffer = "";
        nanoHelp.style.display = "none";
        nanoStatus.textContent = "";
        updateNanoModified();
        nanoOverlay.style.display = "flex";
        nanoEditor.focus();
      } catch (error) {
        nanoTarget = null;
        nanoOverlay.style.display = "none";
        throw error;
      }
    }

    function updateNanoModified() {
      nanoModified.textContent = nanoEditor.value === nanoOriginalContent ? "" : mariowOSI18n.t("terminal.nano.modified", "Modified");
    }

    function nanoPromptText(mode, text) {
      return mode === "search"
        ? mariowOSI18n.t("terminal.nano.prompt.search", "Search: {text}", { text })
        : mariowOSI18n.t("terminal.nano.prompt.read", "Read File: {text}", { text });
    }

    function nanoPrompt(mode) {
      nanoMode = mode;
      nanoInputBuffer = "";
      nanoStatus.textContent = nanoPromptText(mode, "");
    }

    function handleNanoPromptKey(event) {
      event.preventDefault();
      event.stopPropagation();
      if (event.key === "Escape") {
        nanoMode = "edit";
        nanoStatus.textContent = "";
      } else if (event.key === "Enter") {
        const value = nanoInputBuffer.trim();
        const mode = nanoMode;
        nanoMode = "edit";
        nanoInputBuffer = "";
        nanoStatus.textContent = "";
        if (mode === "search") searchNano(value);
        else if (mode === "read") readNanoFile(value);
      } else if (event.key === "Backspace") {
        nanoInputBuffer = nanoInputBuffer.slice(0, -1);
        nanoStatus.textContent = nanoPromptText(nanoMode, nanoInputBuffer);
      } else if (event.key.length === 1 && !event.ctrlKey && !event.metaKey) {
        nanoInputBuffer += event.key;
        nanoStatus.textContent = nanoPromptText(nanoMode, nanoInputBuffer);
      }
    }

    function searchNano(query) {
      if (!query) return;
      const text = nanoEditor.value;
      const from = nanoEditor.selectionEnd;
      const match = text.indexOf(query, from);
      const start = match === -1 ? text.indexOf(query) : match;
      if (start === -1) {
        nanoStatus.textContent = mariowOSI18n.t("terminal.nano.not-found", '"{query}" not found', { query });
        return;
      }
      nanoEditor.focus();
      nanoEditor.setSelectionRange(start, start + query.length);
      nanoStatus.textContent = "";
    }

    async function readNanoFile(requestedPath) {
      if (!requestedPath) {
        nanoStatus.textContent = mariowOSI18n.t("terminal.nano.read-cancelled", "Read File cancelled");
        return;
      }
      const targetPath = normalizeVirtualPath(requestedPath, nanoTarget.directoryPath);
      const parts = splitHomeTarget(targetPath);
      if (!parts) {
        nanoStatus.textContent = mariowOSI18n.t("terminal.nano.read-choose-home", "Read File: choose a file under /home");
        return;
      }
      try {
        const response = await fetch(`/api/system/files/content?path=${encodeURIComponent(parts.parentPath)}&name=${encodeURIComponent(parts.name)}`);
        const data = await response.json();
        if (!response.ok || !data.success) throw new Error(data.error || mariowOSI18n.t("terminal.error.read-file", "Unable to read file"));
        const start = nanoEditor.selectionStart;
        const end = nanoEditor.selectionEnd;
        nanoEditor.setRangeText(data.content, start, end, "end");
        updateNanoModified();
        nanoStatus.textContent = mariowOSI18n.t("terminal.nano.read-done", "Read {path}", { path: targetPath });
      } catch (error) {
        nanoStatus.textContent = mariowOSI18n.t("terminal.nano.read-failed", "Read failed: {error}", { error: error.message });
      }
    }

    function justifyNanoParagraph() {
      const text = nanoEditor.value;
      const cursor = nanoEditor.selectionStart;
      const lineStart = text.lastIndexOf("\n", cursor - 1) + 1;
      let paragraphStart = lineStart;
      while (paragraphStart > 0) {
        const previousEnd = paragraphStart - 1;
        const previousStart = text.lastIndexOf("\n", previousEnd - 1) + 1;
        if (!text.slice(previousStart, previousEnd).trim()) break;
        paragraphStart = previousStart;
      }
      let paragraphEnd = text.indexOf("\n\n", cursor);
      if (paragraphEnd === -1) paragraphEnd = text.length;
      const paragraph = text.slice(paragraphStart, paragraphEnd).replace(/\s+/g, " ").trim();
      const words = paragraph.split(" ");
      const lines = [];
      let line = "";
      words.forEach(word => {
        if (line && `${line} ${word}`.length > 72) {
          lines.push(line);
          line = word;
        } else {
          line = line ? `${line} ${word}` : word;
        }
      });
      if (line) lines.push(line);
      const formatted = lines.join("\n");
      nanoEditor.setRangeText(formatted, paragraphStart, paragraphEnd, "select");
      nanoEditor.setSelectionRange(paragraphStart, paragraphStart + formatted.length);
      updateNanoModified();
    }

    async function saveNano() {
      if (!nanoTarget) return false;
      const content = nanoEditor.value;
      nanoStatus.textContent = mariowOSI18n.t("terminal.nano.writing", "[ Writing... ]");
      try {
        const response = await fetch("/api/system/files/content", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            path: nanoTarget.directoryPath,
            name: nanoTarget.fileName,
            content
          })
        });
        const data = await response.json();
        if (!response.ok || !data.success) throw new Error(data.error || mariowOSI18n.t("terminal.error.save-file", "Unable to save file"));
        nanoOriginalContent = content;
        updateNanoModified();
        nanoStatus.textContent = mariowOSI18n.t("terminal.nano.wrote", "[ Wrote file ]");
        return true;
      } catch (error) {
        nanoStatus.textContent = mariowOSI18n.t("terminal.nano.save-failed", "Save failed: {error}", { error: error.message });
        return false;
      }
    }

    function closeNano(force = false) {
      if (!nanoTarget) return;
      if (!force && nanoEditor.value !== nanoOriginalContent) {
        nanoConfirmDiscard = true;
        nanoStatus.textContent = mariowOSI18n.t("terminal.nano.save-prompt", "Save modified buffer? (Y)es/(N)o");
        return;
      }
      const tab = nanoTarget.tab;
      nanoTarget = null;
      nanoConfirmDiscard = false;
      nanoMode = "edit";
      nanoOverlay.style.display = "none";
      newPrompt(tab);
      focusTerminal();
    }

    nanoEditor.addEventListener("keydown", event => {
      if (nanoMode === "search" || nanoMode === "read") {
        handleNanoPromptKey(event);
        return;
      }
      if (nanoConfirmDiscard) {
        event.preventDefault();
        event.stopPropagation();
        const key = event.key.toLowerCase();
        // The answer keys follow the language (S/N in Italian); Y always works too.
        const yesKey = mariowOSI18n.t("terminal.nano.key.yes", "y").toLowerCase();
        const noKey = mariowOSI18n.t("terminal.nano.key.no", "n").toLowerCase();
        if (key === "y" || key === yesKey) {
          nanoConfirmDiscard = false;
          nanoMode = "edit";
          saveNano().then(saved => {
            if (!saved) {
              nanoConfirmDiscard = true;
              return;
            }
            if (nanoEditor.value === nanoOriginalContent) closeNano();
            else {
              nanoConfirmDiscard = true;
              nanoStatus.textContent = mariowOSI18n.t("terminal.nano.changed-while-saving", "Buffer changed while saving. Press Y to save again or N to discard.");
            }
          });
        } else if (key === "n" || key === noKey) closeNano(true);
        else if (key === "escape") {
          nanoConfirmDiscard = false;
          nanoStatus.textContent = "";
          nanoEditor.focus();
        } else {
          nanoStatus.textContent = mariowOSI18n.t("terminal.nano.save-prompt-keys", "Save modified buffer? Y=save N=discard Esc=cancel");
        }
        return;
      }
      if (event.ctrlKey) {
        const key = event.key.toLowerCase();
        if (["g", "j", "k", "o", "r", "s", "t", "u", "v", "w", "x", "y", "c"].includes(key)) {
          event.preventDefault();
          event.stopPropagation();
        }
        if (key === "g") {
          nanoHelp.style.display = nanoHelp.style.display === "block" ? "none" : "block";
          nanoHelp.textContent = mariowOSI18n.t("terminal.nano.help", "GNU nano keyboard help\n\nCtrl+O  WriteOut (save)\nCtrl+X  Exit\nCtrl+W  Search forward\nCtrl+R  Insert a file\nCtrl+K  Cut line or selection\nCtrl+U  Uncut\nCtrl+Y/V Previous/next page\nCtrl+C  Show cursor position\nCtrl+J  Reflow current paragraph\nCtrl+T  Spell check (not available)\n\nPress Ctrl+G again or Escape to return.");
          return;
        }
        if (key === "o" || key === "s") { saveNano(); return; }
        if (key === "x") { closeNano(); return; }
        if (key === "w") { nanoPrompt("search"); return; }
        if (key === "r") { nanoPrompt("read"); return; }
        if (key === "c") {
          const beforeCursor = nanoEditor.value.slice(0, nanoEditor.selectionStart);
          const lines = beforeCursor.split("\n");
          nanoStatus.textContent = mariowOSI18n.t("terminal.nano.position", "Line {line}/{lines}, Col {col}", { line: lines.length, lines: nanoEditor.value.split("\n").length, col: lines[lines.length - 1].length + 1 });
          return;
        }
        if (key === "k") {
          const start = nanoEditor.selectionStart;
          const end = nanoEditor.selectionEnd;
          if (start !== end) {
            nanoCutBuffer = nanoEditor.value.slice(start, end);
            nanoEditor.setRangeText("", start, end, "start");
          } else {
            const lineStart = nanoEditor.value.lastIndexOf("\n", start - 1) + 1;
            let lineEnd = nanoEditor.value.indexOf("\n", start);
            if (lineEnd === -1) lineEnd = nanoEditor.value.length;
            else lineEnd += 1;
            nanoCutBuffer = nanoEditor.value.slice(lineStart, lineEnd);
            nanoEditor.setRangeText("", lineStart, lineEnd, "start");
          }
          updateNanoModified();
          nanoStatus.textContent = mariowOSI18n.t("terminal.nano.cut", "[ Cut text ]");
          return;
        }
        if (key === "u") {
          if (nanoCutBuffer) nanoEditor.setRangeText(nanoCutBuffer, nanoEditor.selectionStart, nanoEditor.selectionEnd, "end");
          updateNanoModified();
          nanoStatus.textContent = nanoCutBuffer ? mariowOSI18n.t("terminal.nano.uncut", "[ Uncut text ]") : mariowOSI18n.t("terminal.nano.nothing-to-uncut", "Nothing to uncut");
          return;
        }
        if (key === "y" || key === "v") {
          nanoEditor.scrollTop += (key === "y" ? -1 : 1) * nanoEditor.clientHeight * 0.8;
          return;
        }
        if (key === "j") {
          justifyNanoParagraph();
          nanoStatus.textContent = mariowOSI18n.t("terminal.nano.justified", "[ Paragraph justified ]");
          return;
        }
        if (key === "t") {
          nanoStatus.textContent = mariowOSI18n.t("terminal.nano.no-spell", "Spell checking is not available");
          return;
        }
      }
      if (event.key === "Escape" && nanoHelp.style.display === "block") {
        event.preventDefault();
        nanoHelp.style.display = "none";
        return;
      }
      if (event.key === "Escape") {
        event.preventDefault();
        event.stopPropagation();
        if (nanoMode !== "edit") {
          nanoMode = "edit";
          nanoInputBuffer = "";
          nanoStatus.textContent = "";
        } else if (nanoEditor.value !== nanoOriginalContent) {
          nanoConfirmDiscard = true;
          nanoStatus.textContent = mariowOSI18n.t("terminal.nano.save-prompt-keys", "Save modified buffer? Y=save N=discard Esc=cancel");
        } else {
          closeNano();
        }
      }
    });

    function runProgressBar(tab, label, duration, onComplete) {
        const line = document.createElement("div");
        tab.element.appendChild(line);
        let progress = 0;
        const totalBars = 25;
        
        const interval = setInterval(() => {
            progress += Math.floor(Math.random() * 5) + 2;
            if (progress > 100) progress = 100;
            
            const filled = Math.floor((progress / 100) * totalBars);
            const empty = totalBars - filled;
            line.innerHTML = `<span class="color-blue">${label}</span> [${'█'.repeat(filled)}${'-'.repeat(empty)}] ${progress}%`;
            tab.element.scrollTop = tab.element.scrollHeight;
            
            if (progress >= 100) {
                clearInterval(interval);
                setTimeout(onComplete, 200);
            }
        }, duration / (100 / 3));
    }

    // --- SUGGESTIONS ---
    function editDistance(a, b) {
      const row = Array.from({ length: b.length + 1 }, (_, i) => i);
      for (let i = 1; i <= a.length; i++) {
        let previous = row[0];
        row[0] = i;
        for (let j = 1; j <= b.length; j++) {
          const current = row[j];
          row[j] = Math.min(row[j] + 1, row[j - 1] + 1, previous + (a[i - 1] === b[j - 1] ? 0 : 1));
          previous = current;
        }
      }
      return row[b.length];
    }

    function closestMatch(word, options) {
      const lower = String(word || "").toLowerCase();
      if (!lower) return null;
      let best = null, bestScore = Infinity;
      for (const option of options) {
        const candidate = option.toLowerCase();
        const score = candidate.startsWith(lower) ? 0.5 : editDistance(lower, candidate);
        if (score < bestScore) { best = option; bestScore = score; }
      }
      return bestScore <= Math.max(1, Math.min(2, Math.floor(lower.length / 2))) ? best : null;
    }
