<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { background: transparent; }
  body {
    margin: 0;
    font-family: "Poppins", sans-serif;
    -webkit-font-smoothing: antialiased;
    color: #fff;
    display: flex;
    height: 100vh;
    overflow: hidden;
    color-scheme: dark;
  }
  .sidebar {
    width: 250px;
    flex-shrink: 0;
    background: rgba(22,22,25,0.65);
    backdrop-filter: blur(40px);
    -webkit-backdrop-filter: blur(40px);
    padding: 16px 12px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: 2px;
    border-right: 1px solid rgba(0,0,0,0.4);
    box-shadow: inset -1px 0 0 rgba(255,255,255,0.05);
    overflow-y: auto;
  }
  .sidebar h1 { margin: 0 0 0 8px; font-size: 20px; font-weight: 600; }
  .search { margin-top: 12px; position: relative; }
  .search input {
    width: 100%;
    box-sizing: border-box;
    padding: 6px 12px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.1);
    outline: none;
    background: rgba(0,0,0,0.35);
    color: #fff;
    font: 400 13px "Poppins", sans-serif;
    transition: border-color 0.2s;
  }
  .search input::placeholder { color: rgba(255,255,255,0.4); }
  .search input:focus { border-color: #0a84ff; }
  .menu { margin-top: 12px; display: flex; flex-direction: column; gap: 2px; }
  .menu-item {
    padding: 6px 8px;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s;
    display: flex;
    flex-direction: column;
  }
  .menu-item:hover { background: rgba(255,255,255,0.1); }
  .menu-item.active { background: #0a84ff; }
  .menu-item .title { font-weight: 500; font-size: 13px; }
  .menu-item .subtitle { font-size: 11px; color: rgba(255,255,255,0.55); }
  .menu-item.active .subtitle { color: rgba(255,255,255,0.8); }
  .content { flex: 1; min-width: 0; padding: 20px 24px; overflow-y: auto; }
  .content h2 { margin-top: 0; font-size: 24px; font-weight: 600; }
  .content p { margin-top: 0; text-align: center; }
  .content div { margin-top: 0; text-align: center; color: rgba(255,255,255,0.5); }
  .content h3 { margin-top: 230px; text-align: center; font-size: 13px; font-weight: 400; color: rgba(255,255,255,0.5); }
  .window { position: absolute; will-change: transform; }
  .popup-frame { width: 100%; height: calc(90% - 32px); border: none; background: transparent; }
  * { scrollbar-width: none; }
  *::-webkit-scrollbar { display: none; }
  a { text-decoration: none; color: #0a84ff; }
</style>
</head>
<body>
  <div class="sidebar">
    <h1>Settings</h1>
    <div class="search">
      <input type="text" placeholder="Search…">
    </div>
    <div class="menu">
      <div class="menu-item" onclick="loadPage('system', this)">
        <div class="title">System</div>
        <div class="subtitle">Rules, backup, time, reset</div>
      </div>
    </div>
  </div>

  <div class="content" id="content">
    <h3>Did you break something?</h3>
  </div>

<script src="/desktop/assets/mariowos-dialogs.js"></script>
<script>
  const pages = {
    system: `
      <h2>System</h2>
      <iframe src="assets/systemsettings.html" class="popup-frame"></iframe>
    `
  };

  function loadPage(page, el) {
    document.getElementById("content").innerHTML = pages[page];

    // update active state
    document.querySelectorAll(".menu-item").forEach(item => item.classList.remove("active"));
    if (el) el.classList.add("active");
  }

  // 🔍 Search filtering + auto-open first result
  const searchInput = document.querySelector(".search input");
  const menuItems = document.querySelectorAll(".menu-item");

  searchInput.addEventListener("input", () => {
    const query = searchInput.value.toLowerCase();
    let firstMatch = null;

    menuItems.forEach(item => {
      const title = item.querySelector(".title").textContent.toLowerCase();
      const subtitle = item.querySelector(".subtitle").textContent.toLowerCase();

      if (title.includes(query) || subtitle.includes(query)) {
        item.style.display = "flex";
        if (!firstMatch) firstMatch = item; // remember first visible
      } else {
        item.style.display = "none";
      }
    });

    // auto-load first match
    if (firstMatch) {
      const page = firstMatch.getAttribute("onclick").match(/'([^']+)'/)[1];
      loadPage(page, firstMatch);
    }
  });

  function saveProfile() {
  const username = document.getElementById("usernameInput").value.trim();
  const password = document.getElementById("passwordInput").value.trim();
  const pfpFile = document.getElementById("pfpUpload").files[0];

  if (username) localStorage.setItem("username", username);
  if (password) localStorage.setItem("password", password);

  if (pfpFile) {
    const reader = new FileReader();
    reader.onload = () => {
      localStorage.setItem("avatar", reader.result);
      document.getElementById("pfpPreview").src = reader.result;
    };
    reader.readAsDataURL(pfpFile);
  }

  alert("Profile saved.");
}

function loadProfileEditor() {
  const savedUsername = localStorage.getItem("username");
  const savedPassword = localStorage.getItem("password");
  const savedAvatar = localStorage.getItem("avatar");

  if (savedUsername) document.getElementById("usernameInput").value = savedUsername;
  if (savedPassword) document.getElementById("passwordInput").value = savedPassword;
  if (savedAvatar) document.getElementById("pfpPreview").src = savedAvatar;
}

function saveFromSettings() {
  const newUser = document.getElementById("settingsUsername").value.trim();
  const newPass = document.getElementById("settingsPassword").value.trim();

  if (!newUser || !newPass) {
    alert("Fields cannot be empty.");
    return;
  }

  localStorage.setItem("username", newUser);
  localStorage.setItem("password", newPass);

  alert("Credentials updated.");
}


function loadPage(page, el) {
  document.getElementById("content").innerHTML = pages[page];

  if (page === "you") {
    setTimeout(loadProfileEditor, 50); // give DOM time to render
  }

  document.querySelectorAll(".menu-item").forEach(item => item.classList.remove("active"));
  if (el) el.classList.add("active");
}


</script>

</body>
</html>
