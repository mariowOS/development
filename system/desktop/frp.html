

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Factory Reset Protection</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center; background: #f0f2f5; font-family: 'Poppins', sans-serif; }
    .card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 100%; max-width: 400px; text-align: center; }
    h2 { margin: 0 0 10px 0; color: #1a1a1a; font-weight: 500; }
    p { color: #666; font-size: 14px; margin-bottom: 30px; }
    input[type="password"] { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 20px; box-sizing: border-box; font-family: inherit; outline: none; }
    input[type="password"]:focus { border-color: #0a84ff; }
    .btn { background: #0a84ff; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; cursor: pointer; font-family: inherit; font-weight: 500; margin-bottom: 10px; }
    .btn-secondary { background: transparent; color: #0a84ff; border: 1px solid #0a84ff; }
    .error { color: #ff3b30; font-size: 12px; margin-bottom: 15px; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Device Protected</h2>
    <p>This OS was reset through recovery. To continue setup, enter the previous password or import a valid config.</p>
    
    <div class="error" id="err-msg"></div>
    
    <input type="password" id="frp-pass" placeholder="Previous Password">
    <button class="btn" onclick="verifyFRP()">Verify Password</button>
    
    <div style="margin: 20px 0; color: #aaa; font-size: 12px;">OR</div>
    
    <button class="btn btn-secondary" onclick="document.getElementById('file-upload').click()">Import credentials.json</button>
    <input type="file" id="file-upload" accept=".json" style="display: none;" onchange="importFRP(event)">
  </div>

<script>
  async function unlock(type, payload) {
    const res = await fetch('/api/system/frp-unlock', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type, payload })
    });
    const data = await res.json();
    if (data.success) {
      window.location.reload(); // Will hit root and redirect to setup/welcome
    } else {
      const err = document.getElementById('err-msg');
      err.innerText = data.error;
      err.style.display = 'block';
    }
  }

  function verifyFRP() {
    const pass = document.getElementById('frp-pass').value;
    if (pass) unlock('password', pass);
  }

  function importFRP(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => unlock('file', event.target.result);
    reader.readAsText(file);
  }
</script>
</body>
</html>
