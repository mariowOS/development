<!DOCTYPE html>
<html lang="en">
<head>
<script src="/desktop/assets/i18n-data.js"></script>
<script src="/desktop/assets/i18n.js"></script>
<script src="/desktop/assets/mariowos-dialogs.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="/desktop/assets/vendor/tailwind.js"></script>
  <link href="/desktop/assets/fonts/fonts.css" rel="stylesheet">
  <style>
    /* Brand refresh (D-07): aligned with the new mariowOS email design
       (deep green backdrop, warm off-white card, Poppins). Markup/JS unchanged. */
    body {
      font-family: 'Poppins', sans-serif;
      background: #4a5650;
      background-image: radial-gradient(1100px 620px at 50% -12%, #586760 0%, #4a5650 55%, #3e4843 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: auto;
    }

    .frosted-card {
      background-color: #fafaf7;
      background-color: rgba(250, 250, 247, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 30px 60px rgba(12, 20, 16, 0.28);
      border: 1px solid rgba(255, 255, 255, 0.55);
      width: 896px;
      height: 565px;
    }

    #nextBtn {
      cursor: not-allowed;
      background-color: #d1d5db;
      color: #9ca3af;
      transition: all 0.2s ease-in-out;
      width: 50px;
      height: 50px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
    }

    #nextBtn.enabled {
      cursor: pointer;
      background-color: #2e5d4a;
      color: #ffffff;
    }

    #nextBtn.enabled:hover {
      background-color: #24493a;
      transform: scale(1.05);
    }

    #nextBtn.enabled:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="frosted-card rounded-3xl p-6 md:p-10 w-11/12 max-w-4xl flex flex-col md:flex-row gap-8 my-8">
    <div class="md:w-1/3 flex flex-col items-center md:items-start text-center md:text-left">
      <div class="text-xl md:text-2xl font-semibold text-gray-700" data-i18n="setup.password-recovery.heading">
        Password Recovery
      </div>
      <div class="text-3xl md:text-4xl font-extrabold text-gray-900 leading-tight" data-i18n="setup.password-recovery.subheading">
        Reset your password
      </div>
      <p class="mt-4 text-gray-600 text-sm" data-i18n="setup.password-recovery.description">Enter your email address and we'll send you a verification code to reset your password.</p>
      <a href="/loginui/com.mariowos.loginui.html" class="mt-4 hover:underline text-sm" style="color:#2e5d4a" data-i18n="setup.password-recovery.back-to-login">← Back to login</a>
    </div>

    <div class="flex justify-end pt-32">
      <form id="recoveryForm" class="w-full max-w-xs space-y-6 mr-8">
        <div>
          <label for="emailInput" class="block text-sm font-medium text-gray-600 mb-2" data-i18n="setup.password-recovery.email">Enter your email</label>
          <input type="email" id="emailInput"
                 class="w-full p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 shadow-sm"
                 required />
        </div>

        <button id="nextBtn" type="submit"
                class="rounded-full font-bold uppercase tracking-wider transition duration-200 flex justify-center items-center absolute bottom-10 right-12">
          <div id="btn-content" class="flex items-center justify-center">
            <svg id="arrow-icon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6"
                 fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
              <path stroke-linecap="round" stroke-linejoin="round" d="M17 8l4 4m0 0l-4 4m4-4H3" />
            </svg>

            <svg id="spinner" class="animate-spin h-6 w-6 hidden" xmlns="http://www.w3.org/2000/svg"
                 fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10"
                      stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor"
                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0
                    c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
          </div>
        </button>
      </form>
    </div>
  </div>

<script>
const emailInput = document.getElementById("emailInput");
const nextBtn = document.getElementById("nextBtn");
const arrowIcon = document.getElementById("arrow-icon");
const spinner = document.getElementById("spinner");
const form = document.getElementById("recoveryForm");

function updateButtonState() {
  if (emailInput.value.length > 0) {
    nextBtn.classList.add("enabled");
  } else {
    nextBtn.classList.remove("enabled");
  }
}

emailInput.addEventListener("input", updateButtonState);

async function handleSubmit(e) {
  e.preventDefault();
  if (!nextBtn.classList.contains("enabled")) return;

  const email = emailInput.value;

  nextBtn.classList.remove("enabled");
  arrowIcon.classList.add("hidden");
  spinner.classList.remove("hidden");

  try {
    const res = await fetch("/forgot-password", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({ email: email })
    });

    const data = await res.json();

    if (data.success) {
      // Store email in sessionStorage for the reset page
      sessionStorage.setItem("recoveryEmail", email);
      // Redirect to reset page
      window.location.href = "/desktop/password-reset.html";
    } else {
      await mDialog.alert(data.error || mariowOSI18n.t("setup.password-recovery.failed", "Error sending recovery email"));
    }
  } catch (err) {
    await mDialog.alert(mariowOSI18n.t("setup.error-message", "Error: {error}", { error: err.message }));
  } finally {
    spinner.classList.add("hidden");
    arrowIcon.classList.remove("hidden");
    updateButtonState();
  }
}

form.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && nextBtn.classList.contains("enabled")) {
    handleSubmit(e);
  }
});

nextBtn.addEventListener("click", handleSubmit);
updateButtonState();
</script>

</body>
</html>
