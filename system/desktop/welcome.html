<!DOCTYPE html>
<html lang="en">
<head>
    <script src="/desktop/assets/mariowos-dialogs.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Including Poppins from Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;800&display=swap" rel="stylesheet">
    <link href="/desktop/assets/fonts/fonts.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #000;
            color: #fff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* 
         * CINEMATIC SCREENS
         * Moved up to top: 32% to leave breathing room for text
         */
        .screen-back {
            position: absolute;
            top: 32%; 
            left: 50%;
            width: 60%;
            max-width: 850px;
            z-index: 2;
            opacity: 0;
            border-radius: 12px;
            /* 4s duration to handle entrance, pause, and exit */
            animation: backScreenSequence 4s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.2s;
        }

        .screen-front {
            position: absolute;
            top: 32%;
            left: 50%;
            width: 70%;
            max-width: 1000px;
            z-index: 3;
            opacity: 0;
            border-radius: 12px;
            pointer-events: none;
            /* Starts exactly when the back screen starts shrinking (2.9s total delay) */
            animation: frontScreenIn 2s cubic-bezier(0.16, 1, 0.3, 1) forwards 2.9s;
        }

        /* Ultra-fluid Sequence: Enters blurred, sharpens, stays, pushes back to extreme blur */
        @keyframes backScreenSequence {
            0% { opacity: 0; transform: translate(-50%, 60px) scale(0.9); filter: blur(25px); }
            15% { opacity: 1; transform: translate(-50%, 0) scale(1); filter: blur(0px) brightness(1); }
            65% { opacity: 1; transform: translate(-50%, 0) scale(1); filter: blur(0px) brightness(1); }
            100% { opacity: 0.25; transform: translate(-50%, -60px) scale(0.75); filter: blur(20px) brightness(0.3); }
        }

        /* Enters with heavy blur and drop shadow, resolving to sharp */
        @keyframes frontScreenIn {
            0% { 
                opacity: 0; 
                transform: translate(-50%, 120px) scale(0.9); 
                filter: blur(20px) drop-shadow(0 20px 30px rgba(0,0,0,0.2)); 
            }
            100% { 
                opacity: 1; 
                transform: translate(-50%, 0) scale(1); 
                filter: blur(0px) drop-shadow(0 60px 100px rgba(0,0,0,0.95)); 
            }
        }

        /* 
         * TEXT ANIMATIONS
         * Positioned at the bottom
         */
        .hero-text-container {
            position: absolute;
            bottom: 18%; 
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            text-align: center;
            z-index: 5;
        }

        /* "The desktop you know and love..." */
        .text-part1 {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            font-size: 3rem;
            font-weight: 500;
            letter-spacing: -1px;
            white-space: nowrap;
            opacity: 0;
            /* Syncs with the back screen */
            animation: text1Anim 3s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.2s;
        }
        .text-part1 span { color: rgba(255, 255, 255, 0.4); }

        /* "Reimagined." */
        .text-part2 {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%) translateY(40px) scale(0.8);
            font-size: 5.5rem;
            font-weight: 800;
            letter-spacing: -2px;
            white-space: nowrap;
            opacity: 0;
            
            /* Gradient exactly as requested */
            background: linear-gradient(90deg, #38bdf8, #818cf8, #e879f9, #38bdf8);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            
            /* Enters perfectly synchronized with the new screen */
            animation: text2Anim 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards 2.9s, gradientShine 4s linear infinite 4.7s;
        }

        @keyframes text1Anim {
            0% { opacity: 0; transform: translateX(-50%) translateY(30px); filter: blur(15px); }
            15% { opacity: 1; transform: translateX(-50%) translateY(0); filter: blur(0px); }
            85% { opacity: 1; transform: translateX(-50%) translateY(0); filter: blur(0px); } 
            100% { opacity: 0; transform: translateX(-50%) translateY(-40px); filter: blur(15px); } 
        }

        @keyframes text2Anim {
            0% { opacity: 0; transform: translateX(-50%) translateY(50px) scale(0.85); filter: blur(20px); }
            100% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); filter: blur(0px); }
        }

        @keyframes gradientShine {
            to { background-position: 200% center; }
        }

        /* 
         * UI CONTROLS 
         * Smoothly fade in after all animations conclude
         */
        .btn-link, .btn-restore {
            opacity: 0;
            z-index: 10;
            animation: uiFadeIn 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards 4.5s;
        }

        /* Forward Arrow */
        .btn-link {
            position: fixed;
            bottom: 40px;
            right: 40px;
            text-decoration: none;
            transform: translateY(20px);
        }

        .arrow-button {
            background: white;
            border-radius: 50%;
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease;
        }

        .arrow-button:hover { 
            transform: scale(1.1); 
            box-shadow: 0 10px 25px rgba(255,255,255,0.2);
        }
        .arrow-button svg { width: 35px; height: 35px; fill: black; transition: transform 0.3s; }
        .arrow-button:hover svg { transform: translateX(3px); }

        /* Restore Backup */
        .btn-restore {
            position: fixed;
            bottom: 40px;
            left: 40px;
            background: rgba(255, 255, 255, 0.08);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translateY(20px);
        }

        .btn-restore:hover { 
            background: rgba(255, 255, 255, 0.15); 
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px); 
        }
        .btn-restore svg { width: 20px; height: 20px; fill: white; }

        @keyframes uiFadeIn { 
            to { opacity: 1; transform: translateY(0); filter: blur(0px); } 
            0% { filter: blur(10px); opacity: 0; }
        }

        /* Responsive Breakpoints */
        @media (max-width: 900px) {
            .text-part1 { font-size: 2.2rem; }
            .text-part2 { font-size: 3.5rem; }
            .screen-back { width: 85%; }
            .screen-front { width: 95%; }
            .hero-text-container { bottom: 12%; }
        }
    </style>
</head>
<body>

    <!-- Background Screen (Old version) -->
    <!-- Positioned higher and handles blur/shrink dynamically -->
    <img class="screen-back" src="/desktop/assets/screen-old.png" alt="mariowOS Previous" onerror="this.src='https://placehold.co/850x450/222222/555555?text=Old+mariowOS+Screen'">
    
    <!-- Foreground Screen (New version) -->
    <!-- Slides in with sharp drop-shadow just as the old screen fades out -->
    <img class="screen-front" src="/desktop/assets/setup-hero.png" alt="mariowOS New" onerror="this.src='https://placehold.co/1000x550/111111/FFFFFF?text=New+mariowOS+Hero'">

    <!-- Text Container positioned securely at the bottom -->
    <div class="hero-text-container">
        <div class="text-part1">The desktop you know and love<span>...</span></div>
        <div class="text-part2">Reimagined.</div>
    </div>

    <!-- Restore Backup Button & Hidden Input -->
    <button class="btn-restore" onclick="document.getElementById('backup-upload').click()">
        <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
        Restore Backup
    </button>
    <input type="file" id="backup-upload" accept=".json" style="display: none;" onchange="importBackup(event)">

    <!-- Next / Continue Button -->
    <a href="/desktop/license.html" class="btn-link">
        <div class="arrow-button">
            <svg viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
        </div>
    </a>

    <script>
        // No Parallax applied - completely clean CSS animations only.

        function importBackup(e) {
            const file = e.target.files[0];
            if (!file) return;
            const fd = new FormData();
            fd.append('backupFile', file);
            
            fetch('/api/system/restore', { method: 'POST', body: fd })
                .then(r => r.json())
                .then(res => {
                    if(res.success) { 
                        window.location.href = '/'; 
                    } else { 
                        if (typeof mDialog !== 'undefined') {
                            mDialog.alert("Restore failed: " + res.error); 
                        } else {
                            console.error("Restore failed: " + res.error);
                        }
                    }
                })
                .catch(err => {
                    if (typeof mDialog !== 'undefined') {
                        mDialog.alert("Error restoring backup.");
                    } else {
                        console.error("Error restoring backup.", err);
                    }
                });
        }
    </script>
</body>
</html>
