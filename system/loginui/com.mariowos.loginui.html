<html lang="en">
<head>
<script src="/desktop/assets/i18n-data.js"></script>
<script src="/desktop/assets/i18n.js"></script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link href="/desktop/assets/fonts/fonts.css" rel="stylesheet" id="default-font">
<style>
* { box-sizing: border-box; }
html,body {
  height:100%; margin:0;
  font-family:'Poppins',sans-serif;
  -webkit-font-smoothing:antialiased;
  user-select:none;
}

body {
  background-color:#000; /* fallback */
  display:flex; align-items:center; justify-content:center;
  color:#fff; overflow:hidden;
  isolation: isolate;
  transition: background 0.5s ease;
}

#desktop-wallpaper {
  position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
  background: url("/desktop/assets/wallpaper.factory.png") center/cover no-repeat;
  z-index: -100;
}

/* --- LIVE WALLPAPER CSS EFFECT --- */
body.live-wallpaper-active {
  background: linear-gradient(-45deg, #0a0a0a, #1a2a6c, #b21f1f, #fdbb2d) !important;
  background-size: 400% 400% !important;
  animation: liveGradient 15s ease infinite !important;
}
@keyframes liveGradient {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

@keyframes loginRiseUp {
  from { opacity: 0; transform: translate3d(-50%, 40px, 0); }
  to { opacity: 1; transform: translate3d(-50%, 0, 0); }
}

@keyframes datetimeRiseUp {
  from { opacity: 0; transform: translate3d(0, 160px, 0); }
  to { opacity: 1; transform: translate3d(0, 120px, 0); }
}

@keyframes fallDownExit {
  from { opacity: 1; transform: translate3d(-50%, 0, 0); }
  to { opacity: 0; transform: translate3d(-50%, 160px, 0); }
}

@keyframes datetimeFallDownExit {
  from { opacity: 1; transform: translate3d(0, 120px, 0); }
  to { opacity: 0; transform: translate3d(0, 180px, 0); }
}

.datetime {
  position:absolute; top: 0; left: 0; width:100%; text-align:center; pointer-events:none;
  transform: translate3d(0, 120px, 0); 
  animation: datetimeRiseUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
  will-change: transform, opacity;
}

.datetime.unlock-falling { animation: datetimeFallDownExit 0.34s cubic-bezier(0.32, 0, 0.67, 0) forwards !important; }

.datetime .date {
  font-size:22px; color:rgba(255,255,255,0.94); margin-bottom:6px;
  text-shadow:0 4px 14px rgba(0,0,0,0.35); transition: font-family 0.3s ease;
}
.datetime .time {
  font-size:120px; font-weight:600; line-height:0.9; color:rgba(255,255,255,0.98);
  text-shadow:0 8px 30px rgba(0,0,0,0.45); transition: font-family 0.3s ease, font-weight 0.3s ease;
}

.center-stack {
  position: absolute; bottom: 160px; left: 50%; transform: translate3d(-50%, 0, 0);
  display: flex; flex-direction: column; align-items: center; gap: 20px;
  animation: loginRiseUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.25s both; will-change: transform, opacity;
}
.center-stack.unlock-falling { animation: fallDownExit 0.32s cubic-bezier(0.32, 0, 0.67, 0) forwards !important; }

.avatar {
  width:58px; height:58px; border-radius:50%;
  background:url("/desktop/assets/avatar.png") center/cover no-repeat;
  box-shadow:0 6px 18px rgba(0,0,0,0.55), inset 0 -4px 10px rgba(0,0,0,0.12);
  transition: background-image 0.3s ease; transform: translateZ(0);
}

.login-name { margin: -8px 0 -4px; font-size: 20px; font-weight: 600; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,.5); }
.login-name:empty { display: none; }
/* Other accounts, bottom left: pick who signs in. */
@keyframes switcherRise { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: none; } }
.user-switcher { position: absolute; left: 28px; bottom: 28px; display: flex; flex-direction: column; gap: 6px; animation: switcherRise 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.35s both; }
.user-switcher[hidden] { display: none; }
.user-choice { display: flex; align-items: center; gap: 12px; min-width: 210px; padding: 8px 16px 8px 8px; border: 0; border-radius: 14px; background: rgba(0,0,0,0.18); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); color: #fff; font: 500 14px 'Poppins', sans-serif; text-align: left; cursor: pointer; transition: background 0.2s ease, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1); }
.user-choice:hover { background: rgba(255,255,255,0.16); }
.user-choice:active { transform: scale(0.97); }
.user-choice.active { background: rgba(255,255,255,0.24); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,0.45); }
.user-choice img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; flex: 0 0 36px; background: rgba(255,255,255,0.15); }
.user-choice small { display: block; font-size: 11px; font-weight: 400; color: rgba(255,255,255,0.65); }
@keyframes avatarSwap { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: none; } }
.avatar.swap { animation: avatarSwap 0.35s cubic-bezier(0.16, 1, 0.3, 1); }

.unlock-pill {
  display:flex; align-items:center; justify-content:space-between;
  background-color: rgba(0, 0, 0, 0.2);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  border-radius:999px; width:340px; height:48px; overflow:hidden;
  border:2px solid transparent; transition: border-color 0.3s ease;
  box-shadow:0 8px 24px rgba(0,0,0,0.25);
}

.unlock-pill input {
  flex:1; height:100%; padding:0 20px; background:rgba(20,22,28,0.24);
  border:none; outline:none; color:white; font-size:18px; font-family: 'Poppins';
}
.unlocking .unlock-pill { background-color: rgba(20, 22, 28, 0.82); -webkit-backdrop-filter: none; backdrop-filter: none; }

#forgotPassword {
  flex:1; height:100%; padding:0 20px; text-decoration: none; border:none; outline:none;
  color: #ffffff; font-size:18px; font-family: 'Poppins';
}

.unlock-pill.wrong { border-color: rgba(255, 59, 48, 1); animation: shake 0.45s cubic-bezier(.36, .07, .19, .97) both, fadeBorder 1s forwards; }
#loginStatus { min-height: 18px; margin: -10px 0 0; color: #ffb4ab; font-size: 12px; text-align: center; text-shadow: 0 1px 5px rgba(0,0,0,.7); }

@keyframes shake {
  10%, 90% { transform: translate3d(-4px, 0, 0); }
  20%, 80% { transform: translate3d(6px, 0, 0); }
  30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
  40%, 60% { transform: translate3d(8px, 0, 0); }
}

@keyframes fadeBorder { 0% { border-color:rgba(255,59,48,1); } 100% { border-color:transparent; } }
@media (max-width:520px) { .datetime .time { font-size:72px; } .unlock-pill { width:calc(100% - 40px); height:44px; } .avatar { width:52px; height:52px; } }

.popup-overlay {
  position: fixed; inset: 0; background: rgba(255, 255, 255, 0.55);
  display: none; align-items: center; justify-content: center; z-index: 999;
}
.popup {
  background: rgba(255, 255, 255, 0.9); border-radius: 16px; padding: 30px 40px; text-align: center; max-width: 400px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4); 
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px); 
}
.popup h1 { margin-top: 0; font-weight: 600; font-size: 26px; color: #000000; }
.popup p { color: rgba(0, 0, 0, 0.85); font-size: 15px; margin: 12px 0 24px; }
.popup-buttons { display: flex; justify-content: center; gap: 14px; }
.popup-buttons button {
  padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer;
  font-family: 'Poppins'; font-weight: 500; transition: transform 0.2s ease, background 0.2s ease; will-change: transform;
}
.popup-buttons button:hover { transform: scale3d(1.04, 1.04, 1); }
#closePopup { background: #bdbdbd; color: #fff; }
#redirectPopup { background: #002fff; color: #ffffff; }
@supports not (backdrop-filter: blur(1px)) {
  .unlock-pill { background-color: rgba(20, 22, 28, 0.92); }
  .unlock-pill input { background: rgba(20, 22, 28, 0.72); }
  .popup { background: rgba(255, 255, 255, 0.96); }
}
</style>
</head>
<body>
  <div id="desktop-wallpaper"></div>
  <div class="datetime" id="datetimeBlock" aria-hidden="true">
    <div class="date" id="date">Loading…</div>
    <div class="time" id="time">00:00</div>
  </div>

  <div class="center-stack" id="centerStackBlock" role="main">
    <div class="avatar" aria-hidden="true"></div>
    <div class="login-name" id="loginName"></div>
    <div class="unlock-pill" id="unlockPill" aria-label="Unlock" data-i18n-aria-label="login.unlock">
      <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Enter password" aria-label="Password" data-i18n-placeholder="login.password-placeholder" data-i18n-aria-label="login.password" class="w-full">
    </div>
    <p id="loginStatus" role="status" aria-live="polite"></p>
    <a href="/desktop/password-recovery.html" id="forgotPassword" class="text-white text-sm mt-3 hover:underline cursor-pointer" data-i18n="login.forgot-password">Forgot Password?</a>
  </div>

  <div class="user-switcher" id="userSwitcher" role="listbox" aria-label="Accounts" data-i18n-aria-label="login.accounts" hidden></div>

  <div class="popup-overlay" id="popupOverlay">
    <div class="popup">
      <h1 data-i18n="login.fallback.title">Enter fallback mode?</h1>
      <p data-i18n="login.fallback.description">Fallback mode is useful if you screwed something up and have no way to recover. To exit this mode, you can press Finder > Exit fallback mode</p>
      <div class="popup-buttons">
        <button id="closePopup" data-i18n="common.no">No</button>
        <button id="redirectPopup" data-i18n="common.yes">Yes</button>
      </div>
    </div>
  </div>

<script>
// --- Custom Lockscreen Settings Sync & Dynamic Google Fonts ---
function applyCustomSettings() {
  const font = localStorage.getItem('clockFont') || 'Poppins';
  const weight = localStorage.getItem('clockWeight') || '600';
  const isLive = localStorage.getItem('liveWallpaper') === 'true';

  if (font !== 'system-ui') {
    let fontLink = document.getElementById('dynamic-google-font');
    if (!fontLink) {
      fontLink = document.createElement('link');
      fontLink.id = 'dynamic-google-font';
      fontLink.rel = 'stylesheet';
      document.head.appendChild(fontLink);
    }
    fontLink.href = "/desktop/assets/fonts/fonts.css";
  }

  const timeEl = document.getElementById('time');
  const dateEl = document.getElementById('date');
  
  const fontStr = font === 'system-ui' ? 'system-ui' : `'${font}', sans-serif`;
  timeEl.style.fontFamily = fontStr;
  dateEl.style.fontFamily = fontStr;
  timeEl.style.fontWeight = weight;

  if (isLive) {
    document.body.classList.add('live-wallpaper-active');
  } else {
    document.body.classList.remove('live-wallpaper-active');
  }
}

window.addEventListener('storage', (e) => {
  if (['clockFont', 'clockWeight', 'liveWallpaper'].includes(e.key)) {
    applyCustomSettings();
  }
});
applyCustomSettings();

function updateDateTime() {
  const now = new Date();
  const date = now.toLocaleDateString(mariowOSI18n.locale, { weekday: 'long', month: 'long', day: 'numeric' });
  const time = now.toLocaleTimeString(mariowOSI18n.locale, { hour: '2-digit', minute: '2-digit', hour12: false });
  document.getElementById('date').textContent = date;
  document.getElementById('time').textContent = time;
}
updateDateTime();
setInterval(updateDateTime, 1000);

const passwordInput = document.getElementById('loginPassword');
const unlockPill = document.getElementById('unlockPill');
const loginStatus = document.getElementById('loginStatus');
const datetimeBlock = document.getElementById('datetimeBlock');
const centerStackBlock = document.getElementById('centerStackBlock');

passwordInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') attemptUnlock();
});

let wrongTimeout = null;
async function attemptUnlock() {
  const pass = passwordInput.value;
  if (pass.length === 0) return;
  passwordInput.disabled = true;
  loginStatus.textContent = '';
  try {
    const resp = await fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ password: pass, userId: selectedUserId })
    });
    if (resp.status === 401) {
      showWrong();
      return;
    }
    if (!resp.ok) {
      loginStatus.textContent = resp.status === 409
        ? mariowOSI18n.t('login.no-password', 'No password is configured. Use the recovery flow to set one.')
        : mariowOSI18n.t('login.verify-failed', 'Unable to verify password right now. Please try again.');
      return;
    }

    document.body.classList.add('unlocking');
    datetimeBlock.classList.add('unlock-falling');
    centerStackBlock.classList.add('unlock-falling');
    setTimeout(() => {
      window.location.href = '/desktop/com.mariowos.desktop.html';
    }, 360);
  } catch (error) {
    loginStatus.textContent = mariowOSI18n.t('login.unreachable', 'Unable to reach mariowOS. Please try again.');
    console.error('Could not verify lockscreen password:', error);
  } finally {
    if (loginStatus.textContent || unlockPill.classList.contains('wrong')) {
      passwordInput.disabled = false;
      passwordInput.focus();
    }
  }
}
function showWrong() {
  loginStatus.textContent = mariowOSI18n.t('login.wrong-password', 'Incorrect password. Please try again.');
  unlockPill.classList.add('wrong');
  passwordInput.value = '';
  clearTimeout(wrongTimeout);
  wrongTimeout = setTimeout(() => unlockPill.classList.remove('wrong'), 1000);
  passwordInput.focus();
}
window.addEventListener('load', () => passwordInput.focus());

// --- Accounts: the owner, and anyone the administrators added (Settings > Users) ---
let selectedUserId = 'owner';
let loginUsers = [];
function avatarUrl(id) { return '/api/users/avatar/' + encodeURIComponent(id) + '?ts=' + Date.now(); }
function selectUser(id, animate) {
  const user = loginUsers.find(u => u.id === id) || loginUsers[0];
  if (!user) return;
  selectedUserId = user.id;
  try { localStorage.setItem('loginLastUser', user.id); } catch (e) {}
  document.getElementById('loginName').textContent = loginUsers.length > 1 ? user.username : '';
  const avatar = document.querySelector('.avatar');
  avatar.style.backgroundImage = `url("${avatarUrl(user.id)}")`;
  if (animate) { avatar.classList.remove('swap'); void avatar.offsetWidth; avatar.classList.add('swap'); }
  // Recovery resets the owner's password; other accounts ask an administrator.
  document.getElementById('forgotPassword').hidden = !user.owner;
  document.querySelectorAll('.user-choice').forEach(b => { b.classList.toggle('active', b.dataset.id === user.id); b.setAttribute('aria-selected', String(b.dataset.id === user.id)); });
  passwordInput.value = '';
  loginStatus.textContent = '';
  passwordInput.focus();
}
async function loadLoginUsers() {
  try {
    const data = await (await fetch('/api/users/login-list', { cache: 'no-store' })).json();
    loginUsers = Array.isArray(data.users) ? data.users : [];
  } catch (e) { loginUsers = []; }
  if (!loginUsers.length) return;
  const box = document.getElementById('userSwitcher');
  box.replaceChildren(...loginUsers.map(user => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'user-choice'; b.dataset.id = user.id; b.setAttribute('role', 'option');
    const img = document.createElement('img'); img.alt = ''; img.src = avatarUrl(user.id);
    const text = document.createElement('span'); text.textContent = user.username;
    const role = document.createElement('small'); role.textContent = user.admin ? mariowOSI18n.t('login.role-admin', 'Administrator') : mariowOSI18n.t('login.role-standard', 'Standard');
    text.append(role);
    b.append(img, text);
    b.addEventListener('click', () => selectUser(user.id, true));
    return b;
  }));
  box.hidden = loginUsers.length < 2;
  let last = null; try { last = localStorage.getItem('loginLastUser'); } catch (e) {}
  selectUser(loginUsers.some(u => u.id === last) ? last : loginUsers[0].id, false);
}
loadLoginUsers();

const popupOverlay = document.getElementById('popupOverlay');
const closePopup = document.getElementById('closePopup');
const redirectPopup = document.getElementById('redirectPopup');

window.addEventListener('keydown', (e) => {
  // Not while typing a password (spaces are allowed) or pressing an account button.
  if (e.code === 'Space' && !popupOverlay.style.display && !e.target.closest('input, button')) {
    e.preventDefault();
    popupOverlay.style.display = 'flex';
  }
});

closePopup.addEventListener('click', () => {
  popupOverlay.style.display = 'none';
});

redirectPopup.addEventListener('click', () => {
  window.location.href = '/desktop/fallback/com.mariowos.desktop.html';
});

fetch("/desktop/assets/wallpaper.user.png", { method: "HEAD" })
    .then(res => {
      if (!document.body.classList.contains('live-wallpaper-active')) {
        if (res.ok) {
          document.body.style.backgroundImage = 'url("/desktop/assets/wallpaper.user.png?ts=' + Date.now() + '")';
          document.body.style.backgroundSize = 'cover';
          document.body.style.backgroundPosition = 'center';
        } else {
          document.body.style.backgroundImage = 'url("/desktop/assets/wallpaper.png")';
          document.body.style.backgroundSize = 'cover';
          document.body.style.backgroundPosition = 'center';
        }
      }
    });
window.addEventListener("DOMContentLoaded", () => {
    let wallpaper = localStorage.getItem("wallpaper");
    if (!wallpaper) wallpaper = "/desktop/assets/wallpaper.factory.png";

    if (!document.body.classList.contains('live-wallpaper-active')) {
      document.body.style.backgroundImage = `url('${wallpaper}')`;
    }

    // The picture is the selected account's (loadLoginUsers); this is the fallback.
    const avatar = document.querySelector('.avatar');
    if (!avatar.style.backgroundImage) avatar.style.backgroundImage = `url("${avatarUrl(selectedUserId)}")`;
});

function applyForcedLightMode() {
  let lightModeStyle = document.getElementById('forced-light-mode-styles');
  if (!lightModeStyle) {
    lightModeStyle = document.createElement('style');
    lightModeStyle.id = 'forced-light-mode-styles';
    document.head.appendChild(lightModeStyle);
  }
  lightModeStyle.textContent = `
    html body { background: #f5f5f5 !important; color: #1a1a1a !important; }
    body { background: #f5f5f5 !important; }
    .datetime .date { color: #1a1a1a !important; text-shadow: none !important; }
    .datetime .time { color: #1a1a1a !important; text-shadow: none !important; }
    .avatar { box-shadow: 0 6px 18px rgba(0,0,0,0.2), inset 0 -4px 10px rgba(0,0,0,0.08) !important; }
    .unlock-pill { background: rgba(255,255,255,0.95) !important; border: 1px solid #ddd !important; box-shadow: 0 8px 24px rgba(0,0,0,0.15) !important; }
    .unlock-pill input { background: rgba(255,255,255,0.95) !important; color: #1a1a1a !important; }
    .unlock-pill input::placeholder { color: #999 !important; }
    #forgotPassword { color: #0066cc !important; }
    label { color: #1a1a1a !important; }
    .popup-overlay { background: rgba(0, 0, 0, 0.3) !important; }
    .popup { background: #ffffff !important; }
    .popup h1 { color: #1a1a1a !important; }
    .popup p { color: #666666 !important; }
  `;
}

function removeForcedLightMode() {
  const lightModeStyle = document.getElementById('forced-light-mode-styles');
  if (lightModeStyle) { lightModeStyle.remove(); }
}

function checkForcedLightMode() {
  if (localStorage.getItem('forcedLightMode') === 'true') { applyForcedLightMode(); }
}

window.addEventListener('storage', (e) => {
  if (e.key === 'forcedLightMode') {
    if (e.newValue === 'true') { applyForcedLightMode(); } 
    else { removeForcedLightMode(); }
  }
});

window.addEventListener('load', checkForcedLightMode);
</script>
</body>
</html>
